<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decklight narration — auto-advance and failure harness</title>
  <link rel="stylesheet" href="../dist/decklight.css">
</head>
<body>
  <!--
    Live narration drives the deck: when a segment's audio ends, the build
    advances; after the last segment, the slide does. This harness pins that,
    and pins what happens when the voice bridge FAILS — the case that used to
    strand a presentation on whichever slide the error landed.

    Audio is mocked (headless Chrome has no output device, so a real <audio>
    would take the autoplay-blocked path and prove nothing). The bridge is
    mocked too, so a 429 is deterministic instead of a quota you have to earn.
  -->
  <div class="decklight">
    <section><h1>One</h1><aside class="notes">First sentence here. Second sentence here.</aside></section>
    <section><h2>Two</h2></section>
    <section><h2>Three</h2><aside class="notes">Slide three speaks.</aside></section>
    <section><h2>Four</h2><aside class="notes">Slide four speaks.</aside></section>
  </div>

  <pre id="test-sink">running…</pre>

  <script>
    // ── mock <audio>: every clip "plays" and ends on the next tick ───────────
    // The gaps each segment mode digs, by file stem. `segmiss` proves both
    // halves of the fallback rule: a slide whose FIRST segment is missing takes
    // its whole-slide recording instead, and one that fails PAST the first has
    // nothing to fall back to and stops the deck.
    const SEG_MISSING = (new URLSearchParams(location.search).get('mode') === 'segmiss')
      ? ['slide-05-01', 'slide-06-02'] : [];
    window.__audioSrcs = [];   // every URL the deck actually asked for
    // Which files 404. slide-02 was never generated (no notes) and slide-03 is
    // missing — a real <audio> reports both as an `error` event, never as a
    // rejected play(). The segment modes name their own gaps: see SEG_MISSING.
    const MISSING = () => ['slide-02', 'slide-03', ...SEG_MISSING];
    // How long a clip takes. 10ms is enough to sequence a chain; segnav needs a
    // clip long enough to interrupt, because the bug it guards is what happens
    // to an advance armed by audio the presenter walked away from.
    const CLIP_MS = () => (mode === 'segnav' ? 300 : 10);
    window.Audio = class {
      constructor() {
        this.onended = null; this.onerror = null; this.paused = true; this.ended = false;
        this.currentTime = 0; this.playbackRate = 1; this._src = ''; this._timer = null;
      }
      get src() { return this._src; }
      set src(v) {
        // A real element ABANDONS what it was playing the moment src moves —
        // no `ended`, no `error`. The mock has to as well, or a clip the
        // presenter skipped past still fires its handler and the deck under
        // test advances for a reason the browser would never have given it.
        clearTimeout(this._timer); this._timer = null;
        this._src = v; this.ended = false; window.__audioSrcs.push(v);
      }
      play() {
        this.paused = false;
        const src = this._src;
        if (MISSING().some((m) => src.includes(m))) {
          this._timer = setTimeout(() => { if (this._src === src) this.onerror?.(new Event('error')); }, 5);
          return Promise.resolve();
        }
        this._timer = setTimeout(() => {
          if (this._src !== src) return;
          this.ended = true; this.paused = true; this.onended?.();
        }, CLIP_MS());
        return Promise.resolve();
      }
      pause() { this.paused = true; clearTimeout(this._timer); this._timer = null; }
      addEventListener() {}
      removeEventListener() {}
    };

    // ── mock bridge: `mode` decides how /tts behaves ─────────────────────────
    // healthy   — always 200
    // pause     — 200; slide 1 carries data-narration-pause and must hold it
    // pausenav  — 200; a manual jump mid-beat must win over the pending advance
    // flaky     — 429s the FIRST sentence only, then 200 (a transient quota hit)
    // dead      — 429s everything (the bridge is down)
    // roster    — 200, but the bridge speaks a roster of its OWN (an ElevenLabs
    //             key knows none of the Gemini star names), so the persisted
    //             voice is stale and must give way to one it can actually say
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') ?? 'healthy';
    let calls = 0, failures = 0;
    const bodies = [];   // what the deck actually asked the bridge to say, and as whom

    // The bridge lives on its own port and NOTHING else may be intercepted.
    // Matching a bare "/ping" also swallows the edit server's /edit/ping probe,
    // which leaves the deck believing a live-reload server is up — and a fetch
    // left pending freezes Chrome's virtual clock, so the page hangs forever
    // instead of failing. Match this bridge, and only this bridge.
    // ── mock manifest: a signed track, either still good or lapsed ───────────
    // The URLs are absolute and carry a query string, which is the whole point
    // of a manifest — a signature cannot be a directory prefix — so this also
    // proves the runtime hands them to <audio> untouched.
    const SIGNED = (n) => `https://signed.example/showcase/algenib/slide-${n}.m4a`
      + '?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Signature=deadbeef%2Fcafe';
    // A segment's own signature. tools/publish-voices.mjs does not write these
    // yet — it uploads slides[i].file and spreads the rest of the entry through
    // untouched — which is exactly why `segsigned` exists: a signed manifest
    // advertising segments that were never uploaded must be disbelieved.
    const SEGSIGNED = (n, k) => `https://signed.example/showcase/algenib/slide-${n}-${k}.m4a`
      + '?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Signature=cafe%2Fdeadbeef';
    const MANIFEST_PATH = 'test-manifest.json';
    const manifestBody = () => JSON.stringify({
      engine: 'gemini',
      voice: 'Algenib',
      source: 'voices/algenib',
      bucket: 'gs://dl-voices/showcase',
      signDuration: '7d',
      expires: new Date(Date.now() + (mode === 'expired' ? -3600e3 : 3 * 86400e3)).toISOString(),
      slides: [
        { file: 'slide-01.m4a', hash: 'a', url: SIGNED('01') },
        null,                                   // slide 2 has no notes and no file
        { file: 'slide-03.m4a', hash: 'c', url: SIGNED('03') },
        { file: 'slide-04.m4a', hash: 'd', url: SIGNED('04') },
        // slides 5-7 exist only for the two manifest SEGMENT modes, which
        // append them to the deck. `segmanifest` signs each segment, so the
        // track paces itself; `segsigned` lists the same segments with no
        // signature of their own, which is what the publisher writes today —
        // audio that was never uploaded, and would 403 on every beat.
        ...(mode === 'segmanifest' || mode === 'segsigned' ? [
          {
            file: 'slide-05.m4a', hash: 'e', url: SIGNED('05'),
            segments: ['01', '02', '03'].map((k) => (mode === 'segmanifest'
              ? { file: `slide-05-${k}.m4a`, url: SEGSIGNED('05', k) }
              : { file: `slide-05-${k}.m4a` })),
          },
          { file: 'slide-06.m4a', hash: 'f', url: SIGNED('06') },  // recorded whole
          null,                                                    // slide 7 has no notes
        ] : []),
      ],
    });

    const BRIDGE = 'http://127.0.0.1:8899';
    // ── mock author server: only the `record` mode has one ──────────────────
    // ⇧V writes its slide-NN.wav through the server that owns the deck file
    // (PRESENTING), so proving it stopped using the browser's download folder
    // means standing an /edit/ping and an /edit/record up in front of it. Gated
    // on the mode: every OTHER mode must keep failing that probe, or a fetch
    // left pending would freeze Chrome's virtual clock and hang the page.
    const AUTHOR = 'http://127.0.0.1:8788';
    const recording = mode === 'record' || mode === 'recordseg';
    // ?nosrv — no author server answers, which is a `file://` deck or one served
    // read-only by `decklight present`: nothing here may write to disk, so the
    // browser's download folder is the honest fallback and must still work
    const authored = recording && !params.has('nosrv');
    window.__recorded = [];   // every /edit/record the deck posted
    window.__narrationWritten = [];   // …and every config it wrote back
    window.__downloaded = []; // …and every file it handed the browser instead
    // downloadFromUrl builds an <a download> and clicks it; that click is the
    // only observable difference between the two paths
    const realClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function click() {
      if (this.download) { window.__downloaded.push(this.download); return; }
      return realClick.call(this);
    };
    // .bind: an unbound window.fetch called as a bare function throws "Illegal
    // invocation", so every non-bridge request would die in the fallthrough
    const realFetch = window.fetch.bind(window);
    window.fetch = async (url, opts) => {
      const u = String(url);
      // the manifest is a real relative fetch, which file:// would refuse
      if (u.endsWith(MANIFEST_PATH)) {
        return new Response(manifestBody(), { status: 200, headers: { 'content-type': 'application/json' } });
      }
      if (authored && u.startsWith(AUTHOR)) {
        if (u.endsWith('/edit/ping')) {
          // the basename guard the runtime applies: this page IS narration.html
          return new Response(JSON.stringify({ ok: true, name: 'narration.html', undo: 0, redo: 0 }),
            { status: 200, headers: { 'content-type': 'application/json' } });
        }
        if (u.endsWith('/edit/tracks')) {
          // A folder already recorded with the voice about to be used, so
          // rule 2 (refresh, do not accumulate takes) has something to find.
          // ?dir tests rule 3 instead — the deck's OWN configured folder — so
          // it reports nothing, or rule 2 would rightly win over it.
          return new Response(JSON.stringify({ ok: true, tracks: params.has('dir') ? [] : [
            { dir: 'voices/alnilam', files: 6, segments: false, ext: 'm4a', engine: 'mock', voice: 'Alnilam' },
          ] }), { status: 200, headers: { 'content-type': 'application/json' } });
        }
        if (u.includes('/edit/narration')) {
          const cfg = JSON.parse(opts.body);
          // ?badconfig — a deck that builds its config elsewhere, which the
          // real server answers 409 for. The card must say so, not shrug.
          if (params.has('badconfig')) {
            return new Response(JSON.stringify({ ok: false,
              error: 'this deck builds its config outside the Decklight.init(…) call' }),
            { status: 409, headers: { 'content-type': 'application/json' } });
          }
          window.__narrationWritten.push(cfg);
          return new Response(JSON.stringify({ ok: true, changed: true }),
            { status: 200, headers: { 'content-type': 'application/json' } });
        }
        if (u.includes('/edit/record')) {
          const q = new URL(u).searchParams;
          const bytes = (await opts.body.arrayBuffer()).byteLength;
          window.__recorded.push({
            dir: q.get('dir'), slide: q.get('slide'), kind: q.get('kind'),
            seg: q.get('seg'), bytes,
          });
          return new Response(JSON.stringify({ ok: true, dir: q.get('dir') }),
            { status: 200, headers: { 'content-type': 'application/json' } });
        }
        return new Response('', { status: 404 });
      }
      if (!u.startsWith(BRIDGE)) return realFetch(url, opts);
      if (u.endsWith('/ping')) {
        // xss: the roster is somebody ELSE'S text — an ElevenLabs voice is
        // named by whoever shared it, and that name may be markup
        const roster = mode === 'roster'
          ? { engine: 'elevenlabs', model: 'eleven_multilingual_v2', stylable: false, voices: [['My Voice', 'cloned'], ['Rachel', 'calm']] }
          : mode === 'xss'
            ? { engine: 'elevenlabs', model: 'eleven_multilingual_v2', stylable: false, voices: [['<img src=x onerror="window.__xss=true">', '<b>bold claim</b>'], ['Rachel', 'calm']] }
            // eleven_v3 is the one ElevenLabs model the tone step exists for —
            // stylable follows the MODEL here, same as the real bridge computes
            // it (tools/tts-engines.mjs), never a hardcoded "elevenlabs is never
            // stylable" the picker would otherwise have to know by heart.
            : mode === 'elevenlabsv3'
              ? { engine: 'elevenlabs', model: 'eleven_v3', stylable: true, voices: [['Gilles', 'cloned'], ['Rachel', 'calm']] }
              // A roster far taller than the card, which is the ordinary case
              // on a system voice: a Mac answers 184 names. The scrolling bug
              // this mode guards only exists past the fold.
              : mode === 'scroll'
                ? { engine: 'say', model: 'Albert', stylable: false,
                  voices: Array.from({ length: 120 }, (_, i) => [`Voice ${String(i + 1).padStart(3, '0')}`, 'system']) }
              : { engine: 'mock', model: 'mock', stylable: true, voices: [['Alnilam', 'firm']] };
        return new Response(JSON.stringify({ ok: true, ...roster }),
          { status: 200, headers: { 'content-type': 'application/json' } });
      }
      if (u.endsWith('/tts')) {
        calls++;
        try { bodies.push(JSON.parse(opts?.body ?? '{}')); } catch { /* not json */ }
        const fail = mode === 'dead' || (mode === 'flaky' && calls === 1);
        if (fail) { failures++; return new Response('Quota exceeded', { status: 429 }); }
        return new Response(new Blob([new Uint8Array(64)], { type: 'audio/wav' }), { status: 200 });
      }
      return new Response('', { status: 404 });
    };
    window.URL.createObjectURL = () => 'blob:mock';
  </script>

  <script src="../dist/decklight.js"></script>
  <script>
    const sink = document.getElementById('test-sink');
    const key = 'decklight-narration:' + location.pathname;
    // pick the voice exactly as the N picker persists it — a recorded TRACK for
    // the recorded case, the live bridge otherwise (a persisted live voice wins
    // over config.narration.files, which is what made this test lie the first time)
    const segManifest = mode === 'segmanifest' || mode === 'segsigned';
    const manifestDeck = mode === 'manifest' || mode === 'expired' || segManifest;
    // The tracks whose files pace the deck — and `plainrec`, the same slides on
    // a track that did NOT opt in, which must behave exactly as it always has.
    const segmentModes = ['segments', 'segfold', 'segmiss', 'segnav'];
    const segmentDeck = segmentModes.includes(mode);
    const plainDeck = mode === 'plainrec';
    const recordedDeck = mode === 'recorded' || mode === 'hint' || mode === 'switch'
      || segmentDeck || plainDeck;

    // ── the segmented half of the harness deck ──────────────────────────────
    // Appended rather than written into the markup above, so every OTHER mode
    // still sees the same four slides its assertions count on.
    //
    //   5 — three ⟨CLICK⟩ beats over two builds: the ordinary case, one file
    //       per step. In `segfold` it keeps its three beats but drops to ONE
    //       build, which is #350: the surplus rides on the last step, and the
    //       deck must chain both files there rather than speak one and stop.
    //   6 — notes with no ⟨CLICK⟩ at all: recorded whole, inside a track whose
    //       other slides are segmented. It must still advance itself.
    //   7 — no notes: nothing was ever recorded, and that is not a failure.
    if (segmentDeck || plainDeck || segManifest || mode === 'recordseg' || mode === 'micwarn') {
      const beats = 'Beat one. ⟨CLICK⟩ Beat two. ⟨CLICK⟩ Beat three.';
      const builds = mode === 'segfold'
        ? '<p data-build>Only one build here.</p>'
        : '<ul data-build><li>First</li><li>Second</li></ul>';
      document.querySelector('.decklight').insertAdjacentHTML('beforeend', `
        <section><h2>Five</h2>${builds}<aside class="notes">${beats}</aside></section>
        ${mode === 'segmiss'
          // segmiss needs a SECOND segmented slide: the two halves of the
          // fallback rule cannot both be proved on one slide, because the first
          // half ends with the deck on the next one.
          ? `<section><h2>Six</h2>${builds}<aside class="notes">${beats}</aside></section>`
          : '<section><h2>Six</h2><aside class="notes">Slide six speaks, in one breath.</aside></section>'}
        <section><h2>Seven</h2></section>`);
    }
    localStorage.setItem(key, JSON.stringify(
      manifestDeck ? { track: MANIFEST_PATH }
        // `switch` STARTS live and swaps to the recorded track mid-sentence —
        // the persisted state must be the live one for the swap to be a swap
        : recordedDeck && mode !== 'switch' ? { dir: 'voices' }
          : { live: { voice: 'Alnilam', tone: 'Warm', style: 'warm' } }));
    // the hint is once-per-deck FOREVER, so a previous run of this harness
    // would otherwise suppress it and the mode would pass by doing nothing
    if (mode === 'hint') localStorage.removeItem('decklight-narr-used:' + location.pathname);

    const cfg = { narration: { liveUrl: 'http://127.0.0.1:8899/tts' } };
    if (recordedDeck) {
      // slide 2 has NO notes (nothing to say → no file, and that is fine);
      // slide 3 has notes but its file is missing (that IS worth saying)
      // `switch` keeps the mock bridge's liveUrl too — it starts LIVE and swaps
      // to this track mid-sentence, so both halves must point at the harness
      // `segments: true` is the OPT-IN: the runtime cannot see the folder, and
      // must not guess. plainrec omits it and is the proof that omitting it
      // changes nothing.
      const track = { label: 'Test', dir: 'voices', ...(segmentDeck ? { segments: true } : {}) };
      cfg.narration = { ...(mode === 'switch' ? cfg.narration : {}), files: [track] };
    }
    if (manifestDeck) cfg.narration = { files: [{ label: 'Algenib · cloud', manifest: MANIFEST_PATH }] };
    // ?dir — the deck already names a narration folder, so ⇧V records into THAT
    // one rather than seeding a second. The persisted LIVE voice still wins as
    // the source, which is what ⇧V needs to run at all.
    if (recording && params.has('dir')) cfg.narration.files = 'voices';
    if (mode === 'modules') {
      cfg.playlist = {
        index: 0,
        modules: [
          { title: 'This module', href: 'narration.html' },
          { title: 'Deep dive', href: 'other-module.html' },
        ],
      };
    }
    // This harness drives keys and narration, not onboarding: mark the welcome
    // seen so it never intercepts the first keystroke below, and tips off so a
    // tip never lands in the message log these assertions read (SPEC PRESENTING).
    try {
      localStorage.setItem('decklight-onboarded', '1');
      localStorage.setItem('decklight-tips-off', '1');
    } catch { /* ignore */ }

    const deck = Decklight.init(cfg);

    // The message shortcut has to reach the presenter WHEREVER they are: mid-talk,
    // and mid-edit — where a focused textarea owns every bare keystroke, so `i`
    // must type an "i" and the modifier form must still open the log.
    async function until(fn, ms = 4000) {
      const stop = Date.now() + ms;
      for (;;) {
        const v = fn();
        if (v) return v;
        if (Date.now() > stop) return null;
        await new Promise((ok) => setTimeout(ok, 30));
      }
    }
    const press = (k, target, opts = {}) => target.dispatchEvent(
      new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...opts }));
    const logOpen = () => !!document.querySelector('.decklight-msglog');

    (async () => {
      // tools/shot.mjs drives this page itself (real key/click events, for a
      // real screenshot) — the mocks and Decklight.init() above still apply,
      // this just skips the automated test's own scripted interaction so the
      // two don't race each other over the same picker.
      if (params.has('shot')) return;
      const r = {};
      try {
        if (mode === 'keys') {
          // The shortcut is the key LEFT OF 1 — matched on e.code, because what
          // it prints depends on the layout: ` on US, ² on a French AZERTY. Both
          // are sent below, and both must work.
          const TICK = { code: 'Backquote', key: '`' };
          const DEUX = { code: 'Backquote', key: '²' };   // same physical key, AZERTY

          press('`', document.body, TICK);
          r.playOpens = logOpen();
          press('`', document.body, TICK);
          r.playCloses = !logOpen();

          press('²', document.body, DEUX);   // a French keyboard reaches it too
          r.azertyOpens = logOpen();
          press('²', document.body, DEUX);

          // edit mode: a textarea has focus (this is what `E` gives you)
          const ta = document.createElement('textarea');
          document.body.appendChild(ta);
          ta.focus();

          press('`', ta, TICK);                          // the textarea keeps it
          r.editIgnoresBareKey = !logOpen();
          press('`', ta, { ...TICK, ctrlKey: true });    // …the modifier form gets through
          r.editCtrlOpens = logOpen();
          press('`', ta, { ...TICK, ctrlKey: true });
          r.editCtrlCloses = !logOpen();
          press('`', ta, { ...TICK, altKey: true });     // ⌥ too
          r.editAltOpens = logOpen();
          if (logOpen()) press('`', ta, { ...TICK, altKey: true });
          ta.remove();

          r.PASS = r.playOpens && r.playCloses && r.azertyOpens && r.editIgnoresBareKey
            && r.editCtrlOpens && r.editCtrlCloses && r.editAltOpens;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'recorded') {
          deck.toggleNarration();                 // V — plays slide 1's clip
          await new Promise((ok) => setTimeout(ok, 300));
          deck.goto(2, 0);                        // no notes → no file → must stay quiet
          await new Promise((ok) => setTimeout(ok, 300));
          const afterSilentSlide = deck.messages().map((m) => m.text);
          r.quietOnSlideWithNoNotes = !afterSilentSlide.some((m) => /no narration/.test(m));

          deck.goto(3, 0);                        // has notes, file is missing → say so
          await new Promise((ok) => setTimeout(ok, 400));
          const msgs = deck.messages().map((m) => m.text);
          r.warnsOnMissingFile = msgs.some((m) => /no narration for slide 3/.test(m));
          r.lastMessage = msgs[msgs.length - 1] ?? '';
          r.PASS = r.quietOnSlideWithNoNotes && r.warnsOnMissingFile;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'micwarn') {
          // ⇧R on a deck opened by `decklight record`, with no server
          // answering. That parameter means a server WAS started, so finding
          // none means something else holds the port for another deck — and
          // after eight beats is the wrong time to learn where the files went.
          const card = await until(() => document.querySelector('.decklight-mic .narr-card'), 4000);
          r.opened = !!card;
          r.countedTheBeats = /slides? · \d+ beats?/.test(card?.textContent ?? '');
          // the warning arrives when the PROBE gives up, not at open — the
          // whole bug was reading "no server" before the answer existed
          await until(() => card?.querySelector('.rec-warn'), 6000);
          const warn = card?.querySelector('.rec-warn');
          r.warned = !!warn;
          r.warnText = warn?.textContent ?? '';
          r.namedTheCause = /holding the port for another deck/.test(r.warnText);
          r.stillOffersToRecord = !!card?.querySelector('.narr-row');
          r.PASS = r.opened && r.countedTheBeats && r.warned && r.namedTheCause
            && r.stillOffersToRecord;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (segmentDeck || plainDeck) {
          // The whole feature in one surface: window.__audioSrcs is every URL
          // the deck asked for, in order, so what it played and when it moved
          // are the same list.
          const V = 'voices/';
          const asked = () => window.__audioSrcs.slice();
          const msgs = () => deck.messages().map((m) => m.text);
          const once = (list) => list.every((u, i) => list.indexOf(u) === i);
          const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));

          deck.goto(5, 0);
          await wait(20);
          window.__audioSrcs.length = 0;    // the goto itself plays nothing — narration is off
          deck.toggleNarration();           // V

          if (plainDeck) {
            // The regression. A track that did not opt in must behave exactly
            // as it did before segments existed: ONE file for the slide, no
            // auto-advance, and → does not restart it.
            await wait(300);
            r.playedTheWholeSlide = asked().join('|') === `${V}slide-05.m4a`;
            r.didNotAdvance = deck.state.slide === 5 && deck.state.step === 0;
            deck.next();
            await wait(200);
            deck.next();
            await wait(200);
            r.steppedWithoutRestarting = asked().length === 1;
            r.stepped = deck.state.step === 2;
            r.noComplaint = !msgs().some((m) => /🔇/.test(m));
            r.asked = asked();
            r.PASS = r.playedTheWholeSlide && r.didNotAdvance
              && r.steppedWithoutRestarting && r.stepped && r.noComplaint;
            sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
            return;
          }

          if (mode === 'segnav') {
            // The presenter overtakes their own recording. The advance armed by
            // the clip they walked away from must not land on top of theirs —
            // one → is one step, never two.
            await wait(60);                 // 05-01 is still playing (300ms clips)
            deck.next();
            await wait(560);                // 05-02 runs, ends, and hands over to 05-03
            r.midClip = deck.state.slide === 5 && deck.state.step === 2;
            r.asked = asked();
            r.inOrder = r.asked.join('|') === [1, 2, 3].map((k) => `${V}slide-05-0${k}.m4a`).join('|');
            r.nothingTwice = once(r.asked);
            await wait(900);                // let the rest of the track run out
            r.reachedTheEnd = deck.state.slide === 7;
            r.stillNothingTwice = once(asked());
            r.PASS = r.midClip && r.inOrder && r.nothingTwice
              && r.reachedTheEnd && r.stillNothingTwice;
            sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
            return;
          }

          if (mode === 'segmiss') {
            await wait(600);
            r.asked = asked();
            // slide 5's FIRST segment is missing: take the whole-slide file,
            // and having taken it, move on rather than parking
            r.fellBackAtArrival = r.asked.slice(0, 2).join('|')
              === `${V}slide-05-01.m4a|${V}slide-05.m4a`;
            r.wentOn = r.asked[2] === `${V}slide-06-01.m4a`;
            // slide 6's SECOND is missing: nothing to fall back to, so the deck
            // holds where the voice stopped instead of walking on in silence
            r.askedTheGap = r.asked[3] === `${V}slide-06-02.m4a`;
            r.heldThere = deck.state.slide === 6 && deck.state.step === 1;
            r.namedTheFile = msgs().some((m) => /slide-06-02\.m4a/.test(m));
            r.stopped = msgs().some((m) => /auto-advance stopped/.test(m));
            r.saidItOnce = msgs().filter((m) => /slide-06-02\.m4a/.test(m)).length === 1;
            r.PASS = r.fellBackAtArrival && r.wentOn && r.askedTheGap && r.heldThere
              && r.namedTheFile && r.stopped && r.saidItOnce;
            sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
            return;
          }

          // `segments` and `segfold` — the deck runs itself to the end
          await wait(700);
          r.asked = asked();
          r.spokeEverySegment = r.asked.slice(0, 3).join('|')
            === [1, 2, 3].map((k) => `${V}slide-05-0${k}.m4a`).join('|');
          // a slide recorded WHOLE, inside a segmented track: one file, and it
          // still advances itself at the end
          r.wholeSlideToo = r.asked[3] === `${V}slide-06.m4a`;
          r.askedForNothingElse = r.asked.length === 4;
          // slide 7 has no notes: nothing was recorded, and that is not a fault
          r.quietOnSlideWithNoNotes = !msgs().some((m) => /no narration/.test(m));
          r.ranToTheEnd = deck.state.slide === 7;
          r.noComplaint = !msgs().some((m) => /🔇/.test(m));
          r.PASS = r.spokeEverySegment && r.wholeSlideToo && r.askedForNothingElse
            && r.quietOnSlideWithNoNotes && r.ranToTheEnd && r.noComplaint;
          if (mode === 'segfold') {
            // #350 on a recorded track: one build, three beats. The two the
            // slide has no build for ride on the last step — chained, not
            // dropped — and the deck says the counts disagree.
            r.warnedOverflow = msgs().some((m) => /3 ⟨CLICK⟩ segments but 2 build steps/.test(m));
            r.PASS = r.PASS && r.warnedOverflow;
          }
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'hint') {
          // A deck with a recorded track has to SAY so — a viewer on a laptop
          // has no sound button and no reason to guess at V. Two runs: this
          // one, and the same URL with ?print, where the pill must not exist.
          const pill = () => document.querySelector('.decklight-narr-hint');
          const printing = params.has('print');

          r.printing = printing;
          r.beforeDelay = !pill();          // it waits for the slide to land first
          await new Promise((ok) => setTimeout(ok, 1400));

          const el = pill();
          if (printing) {
            // nothing to click on paper, and nothing to hear
            r.PASS = !el;
            r.hidden = !el;
            sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
            return;
          }

          r.shown = !!el;
          r.readsRight = /voice-over/.test(el?.textContent ?? '');
          r.namesTheKey = el?.querySelector('kbd')?.textContent === 'V';
          r.isAButton = el?.tagName === 'BUTTON' && !!el?.getAttribute('aria-label');
          r.faded = el?.classList.contains('show') === true;
          // the log remembers it; the toast stack does NOT also show it, or the
          // deck would say the same thing twice in two corners at once
          r.inLog = deck.messages().some((m) => /voice-over/.test(m.text));
          r.noDoubleToast = ![...document.querySelectorAll('.decklight-toast')]
            .some((t) => /voice-over/.test(t.textContent));

          el?.click();                       // a real gesture — audio may start
          await new Promise((ok) => setTimeout(ok, 300));
          r.clickStartsVoice = deck.messages().some((m) => /🔊 Test/.test(m.text));
          r.goneAfterClick = !pill();
          // and it never returns to this deck. The persisted flag is what a
          // later load reads; that the flag suppresses the pill is pinned in
          // test/narration.test.mjs, which can ask the question directly.
          r.remembered = localStorage.getItem('decklight-narr-used:' + location.pathname) === '1';

          r.PASS = r.beforeDelay && r.shown && r.readsRight && r.namesTheKey && r.isAButton
            && r.faded && r.inLog && r.noDoubleToast && r.clickStartsVoice
            && r.goneAfterClick && r.remembered;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (segManifest) {

          //
          // A manifest ALREADY lists the per-segment files tools/voiceover.mjs
          // wrote — so a cloud track needs no new config to pace itself. But
          // tools/publish-voices.mjs uploads slides[i].file and nothing else,
          // while spreading the rest of the entry through: a signed manifest
          // can therefore advertise segments whose audio was never uploaded.
          // Believing it would 403 on every beat and stop the deck dead — so a
          // segment on a signed manifest counts only with a signature of its own.
          const signed = mode === 'segsigned';
          deck.goto(5, 0);
          await new Promise((ok) => setTimeout(ok, 20));
          window.__audioSrcs.length = 0;
          deck.toggleNarration();                        // V — fetches, then plays
          await new Promise((ok) => setTimeout(ok, 700));
          r.asked = window.__audioSrcs.slice();
          r.unsignedSegments = signed;

          if (signed) {
            // disbelieved: the whole-slide file, and a track that does not pace
            // itself — exactly the behaviour before segments existed
            r.ignoredThem = !r.asked.some((u) => /slide-05-0/.test(u));
            r.playedTheWholeSlide = r.asked.join('|') === SIGNED('05');
            r.didNotAdvance = deck.state.slide === 5 && deck.state.step === 0;
            r.PASS = r.ignoredThem && r.playedTheWholeSlide && r.didNotAdvance;
          } else {
            r.playedEachSigned = r.asked.slice(0, 3).join('|')
              === ['01', '02', '03'].map((k) => SEGSIGNED('05', k)).join('|');

            r.wholeSlideToo = r.asked[3] === SIGNED('06');   // slide 6 lists no segments
            r.ranToTheEnd = deck.state.slide === 7;
            r.noComplaint = !deck.messages().some((m) => /🔇/.test(m.text));
            r.PASS = r.playedEachSigned && r.keptTheQuery && r.wholeSlideToo
              && r.ranToTheEnd && r.noComplaint;
          }
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (manifestDeck) {
          // A manifest track's whole reason to exist is that the URL it plays
          // cannot be derived from a directory — so the thing to prove is that
          // the deck asks for the URL it was GIVEN, character for character.
          const expired = mode === 'expired';
          deck.toggleNarration();                        // V — fetches, then checks
          await new Promise((ok) => setTimeout(ok, 600));

          const msgs = () => deck.messages().map((m) => m.text);
          r.expiredCase = expired;
          r.asked = window.__audioSrcs.slice();

          if (expired) {
            // the voice is the clock: a lapsed signature stops the deck like a
            // 429 or a dead bridge, and names the command that fixes it
            r.playedNothing = r.asked.length === 0;
            r.didNotAdvance = deck.state.slide === 1;   // the same proof the 429 case uses
            r.saidExpired = msgs().some((m) => /expired/.test(m));
            r.namedResign = msgs().some((m) => /publish-voices\.mjs voices\/algenib --bucket gs:\/\/dl-voices\/showcase --sign 7d/.test(m));
            r.lastMessage = msgs()[msgs().length - 1] ?? '';
            r.PASS = r.playedNothing && r.didNotAdvance && r.saidExpired && r.namedResign;
            sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
            return;
          }

          r.playedSigned = r.asked[0] === SIGNED('01');
          r.keptTheQuery = /X-Goog-Signature=deadbeef%2Fcafe$/.test(r.asked[0] ?? '');
          r.noComplaint = !msgs().some((m) => /🔇/.test(m));

          // slide 2 is a null entry AND has no notes — silence, not a warning
          deck.goto(2, 0);
          await new Promise((ok) => setTimeout(ok, 300));
          r.quietOnNullSlide = window.__audioSrcs.length === 1
            && !msgs().some((m) => /no narration/.test(m));

          // slide 3 is a different entry entirely — its own signed URL
          deck.goto(3, 0);
          await new Promise((ok) => setTimeout(ok, 300));
          r.perSlideUrls = window.__audioSrcs[1] === SIGNED('03');

          r.PASS = r.playedSigned && r.keptTheQuery && r.noComplaint
            && r.quietOnNullSlide && r.perSlideUrls;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (recording) {
          // ⇧V used to hand every stitched slide to the browser, which is how a
          // recorded deck ended up as slide-NN.wav in the OS download folder —
          // never the deck's, and `bundle` reads no other. With an author
          // server up, every file must go through it instead.
          await new Promise((ok) => setTimeout(ok, 400));   // /edit/ping answers
          press('V', document.body, { shiftKey: true });
          r.dialogOpens = !!document.querySelector('.decklight-record');
          // the target lands asynchronously (the server is asked what exists),
          // so the card names the folder a moment after it opens
          const field = await until(() => document.querySelector('.decklight-record .rec-dir'), 3000);
          r.folderField = field?.value ?? null;
          document.querySelector('.decklight-record .narr-card .narr-row')?.click();  // Start recording

          // Poll for the done card rather than sleeping a guessed interval: a
          // slide is several bridge round-trips and a blob stitch, and under a
          // virtual clock those take real time the page cannot predict. Every
          // tick spends the run's virtual-time budget, so the interval is short
          // and the ceiling is generous — a run that needs the whole 60s is
          // still under a second of wall clock.
          const card = document.querySelector('.decklight-record .narr-card');
          for (let i = 0; i < 1200 && !/recording done/.test(card?.textContent ?? ''); i++) {
            await new Promise((ok) => setTimeout(ok, 50));
          }
          r.finished = /recording done/.test(card?.textContent ?? '');
          r.posted = window.__recorded.slice();
          r.downloaded = window.__downloaded.slice();
          r.authored = authored;
          const text = card?.textContent ?? '';
          // slides 1, 3 and 4 have notes; slide 2 has none and is not recorded
          r.slides = authored
            ? r.posted.filter((p) => p.kind === 'wav' && p.seg == null).map((p) => p.slide)

          // slides 1, 3 and 4 have notes; slide 2 has none and is not recorded.
          // recordseg adds 5 (three ⟨CLICK⟩ beats) and 6 (one breath); 7 is silent.
          r.everySlideHasNotes = r.slides.join(',') === (mode === 'recordseg' ? '1,3,4,5,6' : '1,3,4');

          if (!authored) {
            // no server, so the browser takes them — under their own names, and
            // the card must not claim a folder next to a deck nothing wrote to
            r.wentToDisk = r.posted.length === 0;
            r.saidWhere = /downloads/.test(text);
            // no server to write through, so no offer to — the button is
            // absent exactly where it could not have worked
            r.noOfferWithoutAServer = !card?.querySelector('.rec-use');
            // …and it says WHY it chose the download folder. "Saved to your
            // downloads" is where, and where is not something you can act on.
            r.saidWhyNotTheDeck = /decklight record/.test(text);
            r.PASS = r.dialogOpens && r.finished && r.wentToDisk
              && r.everySlideHasNotes && r.saidWhere && r.noOfferWithoutAServer

            return;

          r.carriedAudio = r.posted.every((p) => p.bytes > 0);

          // the same `voiceover` tools/voiceover.mjs writes to
          r.dir = r.posted[0]?.dir;
          // A TRACK IS A FOLDER, named after the voice: recording a second
          // voice into the first one's folder is what this replaced. `?dir`
          // still wins — it is what the person asked for out loud.
          r.dirIsRight = r.dir === (params.has('dir') ? 'voices' : 'voices/alnilam');
          // and the card names where they landed, plus the line that plays them
          r.saidWhere = text.includes(`${r.dir}/`) && !/downloads/.test(text);
          r.namedTheConfig = text.includes(`files: '${r.dir}', ext: 'wav'`);

          r.folderWasShown = !!r.folderField && r.folderField === r.dir;

          // line, and the one thing between a finished recording and a deck
          // that plays it.
          const useBtn = card?.querySelector('.rec-use');
          r.offeredToUseIt = !!useBtn;
          if (useBtn) {
            // The KEYBOARD path, not a click: Enter on the done card used to
            // close it — walking straight past this offer, with a hint that
            // said to — and a recording the deck never learns about has no
            // later door (N lists only configured tracks). Enter must accept
            // FIRST and close only when nothing is left to accept.
            r.hintSaysEnterUsesIt = /⏎ uses this track/.test(card?.textContent ?? '');
            press('Enter', document.body);
            for (let i = 0; i < 200 && !/now plays this track|couldn/.test(useBtn.textContent); i++) {
              await new Promise((ok) => setTimeout(ok, 20));
            }
            r.enterDidNotClose = !!document.querySelector('.decklight-record');
            r.useResult = useBtn.textContent;
            r.wroteTheConfig = window.__narrationWritten.slice();
            r.saidItWorked = /now plays this track/.test(useBtn.textContent);
            // a 409 must reach the presenter as the server's own sentence
            r.explainedTheRefusal = params.has('badconfig')
              && /outside the Decklight\.init/.test(useBtn.textContent);
          }

          if (mode === 'recordseg') {
            // ⇧V catching up with ⇧R: the same layout from both recorders, so
            // the files on disk say nothing about which one made them. A
            // SYNTHESIZED track gains build-pacing for free here — until now
            // only a track recorded by mouth could have it.
            r.beats = r.posted.filter((p) => p.seg != null)
              .map((p) => `${p.slide}-${p.seg}`);
            r.wroteABeatPerClick = r.beats.join(' ') === '5-1 5-2 5-3';
            // …and only where the tool would have segmented: slide 6 is one
            // breath, and one beat is not a segmented slide
            r.noBeatsForAOneBreathSlide = !r.beats.some((b) => b.startsWith('6-'));
            r.beatsCarriedAudio = r.posted.filter((p) => p.seg != null).every((p) => p.bytes > 44);
            // the card prints the flag without which the beats do nothing
            r.namedSegments = text.includes(`files: '${r.dir}', ext: 'wav', segments: true`);
            // …and the button writes exactly the line the card printed
            const wrote = r.wroteTheConfig[0] ?? {};
            r.configMatchedTheCard = r.wroteTheConfig.length === 1
              && wrote.files === r.dir && wrote.ext === 'wav' && wrote.segments === true
              // the label is what makes a picker row distinguishable from the
              // seven others; a track written without one is a row reading as
              // its own folder path
              && typeof wrote.label === 'string' && wrote.label.length > 0;
            r.PASS = r.dialogOpens && r.finished && r.wentToDisk && r.everySlideHasNotes
              && r.carriedAudio && r.dirIsRight && r.saidWhere && r.wroteABeatPerClick
              && r.noBeatsForAOneBreathSlide && r.beatsCarriedAudio && r.namedSegments
              && r.offeredToUseIt && r.hintSaysEnterUsesIt && r.enterDidNotClose
              && (params.has('badconfig')
                ? r.explainedTheRefusal && !r.wroteTheConfig.length
                : r.saidItWorked && r.configMatchedTheCard);

            return;
          }

          // must not offer a flag that would send the player looking for them
          r.noBeatsWithoutClicks = r.posted.every((p) => p.seg == null)
            && !/segments: true/.test(text);

          // a deck with no ⟨CLICK⟩ anywhere must not be handed segments: true
          const wrote = r.wroteTheConfig[0] ?? {};
          r.configMatchedTheCard = r.wroteTheConfig.length === 1
            && wrote.files === r.dir && wrote.ext === 'wav' && wrote.segments === undefined
            && typeof wrote.label === 'string' && wrote.label.length > 0;
          r.label = wrote.label;
          r.PASS = r.dialogOpens && r.finished && r.wentToDisk && r.everySlideHasNotes

            && r.noBeatsWithoutClicks && r.offeredToUseIt && r.saidItWorked
            && r.configMatchedTheCard && r.folderWasShown;

        }

        if (mode === 'modules') {
          // The module menu (M) is gone: the finder (G) does both of its jobs.
          // Marked slides were always ordinary slides it indexed; a playlist's
          // other modules are now rows in it — the one thing M could do that G
          // could not.
          press('m', document.body);
          r.noModuleMenu = !document.querySelector('.decklight-module-menu');
          // …and M is not free any more: it is review comments (SPEC REVIEW).
          // Asserting that here is what keeps this mode honest — it used to
          // press M for the side effect of nothing happening, and an overlay
          // that DID open then swallowed the G below and the finder never ran.
          r.mIsReviewNow = !!document.querySelector('.decklight-review');
          press('Escape', document.body);
          await new Promise((ok) => setTimeout(ok, 30));

          press('g', document.body);
          const rows = [...document.querySelectorAll('.decklight-finder .tp-row')].map((el) => el.textContent);
          r.finderOpens = rows.length > 0;
          r.listsSlides = rows.some((t) => /Two/.test(t));
          r.listsModules = rows.some((t) => /Deep dive/.test(t));   // another FILE
          r.hidesCurrentModule = !rows.some((t) => /This module/.test(t));
          r.moduleRowMarked = !!document.querySelector('.decklight-finder .tp-row.tp-module');

          r.PASS = r.noModuleMenu && r.mIsReviewNow && r.finderOpens && r.listsSlides
            && r.listsModules && r.hidesCurrentModule && r.moduleRowMarked;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'elevenlabsv3') {

          // /ping reports stylable from the MODEL (tools/tts-engines.mjs), and
          // the picker must show the tone step for it exactly as it would for
          // gemini, then send each preset as its SHORT v3 cue, never the long
          // gemini-shaped prose (tools/elevenlabs-tts.mjs turns that into the
          // bracketed audio tag actually sent to ElevenLabs).
          press('n', document.body);                       // no tracks → voices view
          await new Promise((ok) => setTimeout(ok, 500));   // /ping answers, view repaints
          let picker = document.querySelector('.decklight-narr');
          let rows = [...(picker?.querySelectorAll('.narr-row') ?? [])];
          r.voiceRows = rows.map((el) => el.querySelector('.narr-row-label')?.textContent);

          // the voices view also carries the engine row (SPEC PRESENTING), and
          // an index into this list is a thing that silently starts meaning
          // something else the next time a row is added above it.
          rows.find((el) => !/engine:/.test(el.textContent))?.click();

          // (tools/shot.mjs --drive against this same mode, budget ~1200ms)
          // before the next click moves on.
          await new Promise((ok) => setTimeout(ok, 2000));
          picker = document.querySelector('.decklight-narr');
          rows = [...(picker?.querySelectorAll('.narr-row') ?? [])];
          r.toneStepShown = rows.length > 0;
          r.toneLabels = rows.map((el) => el.querySelector('.narr-row-label')?.textContent);

          const excited = rows.find((el) => /Super excited/.test(el.textContent));
          excited?.click();
          await new Promise((ok) => setTimeout(ok, 300));
          r.sentStyle = bodies[bodies.length - 1]?.style;

          r.PASS = r.voiceRows.length > 0 && r.toneStepShown
            && r.toneLabels.includes('Super excited') && r.sentStyle === 'excited';
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'scroll') {
          // ↓ must bring its selection WITH it. The card scrolls (max-height:
          // 70vh) and the voices view is longer than it, so a selection that
          // moves without scrolling walks off the bottom and you are choosing
          // blind from about row 15 on — the list looks frozen and the
          // highlight is simply gone.
          press('n', document.body);                       // no tracks → voices view
          await new Promise((ok) => setTimeout(ok, 500));   // /ping answers, view repaints
          const card = document.querySelector('.narr-card');
          const inView = () => {
            const sel = document.querySelector('.narr-sel');
            if (!sel) return false;
            const c = card.getBoundingClientRect(), s = sel.getBoundingClientRect();
            return s.top >= c.top - 1 && s.bottom <= c.bottom + 1;
          };
          r.rows = document.querySelectorAll('.narr-row').length;
          r.scrollable = card.scrollHeight > card.clientHeight;
          r.visibleThroughout = true;
          for (let i = 0; i < 60; i++) {
            press('ArrowDown', document.body);
            if (!inView()) { r.visibleThroughout = false; r.lostAt = i + 1; break; }
          }
          r.scrolled = card.scrollTop > 0;
          r.selectedAfter = document.querySelector('.narr-sel .narr-row-label')?.textContent;

          // ...and HOVER must not, or the list jerks under the cursor: a row
          // half off the edge would pull itself in and drag the row under the
          // mouse out from under it.
          const before = card.scrollTop;
          const rows = [...document.querySelectorAll('.narr-row')];
          rows[rows.length - 1]?.dispatchEvent(new MouseEvent('mouseenter'));
          await new Promise((ok) => setTimeout(ok, 60));
          r.hoverHeldStill = card.scrollTop === before;

          r.PASS = r.rows > 60 && r.scrollable && r.visibleThroughout
            && r.scrolled && r.hoverHeldStill;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'segoverflow') {
          // #350: a slide whose notes carry more ⟨CLICK⟩ segments than it has
          // build steps used to drop every surplus segment — never synthesized,
          // never spoken, never mentioned, while the speaker view went on
          // showing it. Slide one has no data-build, so it has exactly one step
          // and everything after the first marker is the surplus.
          const notes = deck._sections[0].querySelector('aside.notes');
          notes.textContent = 'Segment zero speaks here. ⟨CLICK⟩ Segment one is the surplus one.';
          deck.toggleNarration();                                // V
          await new Promise((ok) => setTimeout(ok, 6000));

          const said = bodies.map((b) => b.text ?? '');
          r.asked = said.length;
          r.spokeFirst = said.some((t) => /Segment zero speaks here/.test(t));
          r.spokeSurplus = said.some((t) => /surplus one/.test(t));
          // and the deck still moves on — speaking the tail must not strand it
          r.movedOn = deck.state.slide > 1;
          // the counts disagreeing is an authoring slip worth seeing, so it is
          // named in the message log (I) — but never toasted, because it is a
          // note about the deck, not something to act on mid-sentence
          r.warned = deck.messages().some((m) => /⟨CLICK⟩ segments but/.test(m.text));
          r.notToasted = ![...document.querySelectorAll('.decklight-toast')]
            .some((t) => /⟨CLICK⟩ segments but/.test(t.textContent));

          r.PASS = r.spokeFirst && r.spokeSurplus && r.movedOn && r.warned && r.notToasted;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'xss') {
          // The N picker lists whatever the bridge said it can speak. A voice
          // named with markup must land in the rows as TEXT — the picker runs
          // in the deck's origin, and in author mode that origin can reach the
          // edit server, so a parsed name would be code execution.
          press('n', document.body);                 // no tracks → voices view
          await new Promise((ok) => setTimeout(ok, 500));   // /ping answers, view repaints
          const picker = document.querySelector('.decklight-narr');
          const labels = [...(picker?.querySelectorAll('.narr-row-label') ?? [])];
          r.rows = labels.length;
          r.scriptDidNotRun = !window.__xss;
          r.nothingParsed = !picker?.querySelector('img, b');
          const hostile = labels.find((l) => l.textContent.includes('<img src=x onerror="window.__xss=true">'));
          r.nameIsLiteralText = !!hostile;
          r.flavorIsLiteralText = hostile?.querySelector('.narr-flavor')?.textContent === '<b>bold claim</b>';
          r.PASS = r.scriptDidNotRun && r.nothingParsed && r.nameIsLiteralText && r.flavorIsLiteralText;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'roster') {
          // The saved voice was chosen against a different engine. Opening the
          // picker probes the bridge; from then on the deck must speak a name
          // this bridge knows, must SAY that it swapped, and must remember it.
          r.savedBefore = JSON.parse(localStorage.getItem(key)).live.voice;
          deck.toggleNarration();                                // V — probes /ping
          await new Promise((ok) => setTimeout(ok, 1500));

          r.savedAfter = JSON.parse(localStorage.getItem(key)).live.voice;
          r.swapped = r.savedBefore === 'Alnilam' && r.savedAfter === 'My Voice';
          r.persisted = r.savedAfter === 'My Voice';
          r.saidSo = deck.messages().some((m) => /Alnilam.*My Voice/.test(m.text));
          // and the bridge was asked for the voice it can speak, not the stale one
          r.spokeAs = bodies.every((b) => b.voice === 'My Voice');
          r.asked = bodies.length > 0;
          r.PASS = r.swapped && r.persisted && r.saidSo && r.asked && r.spokeAs;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'switch') {
          // The advanceFrom guard, pinned (#342's machinery, reshaped for
          // recorded playback). A live sentence chain is mid-flight when the
          // presenter switches to a recorded track in the N picker. The chain's
          // pending advance must DIE with the switch: it was armed by a mode
          // that no longer holds the deck, and a deck that jumps a slide right
          // after you change tracks is this guard failing. The old guard
          // (`!narrSet?.live`) protected this by accident; the mode comparison
          // protects it on purpose — and this is the test that notices if a
          // refactor loses it.
          deck.toggleNarration();                              // V — live speaks
          await new Promise((ok) => setTimeout(ok, 700));      // mid-sentence
          const slideBefore = deck.state.slide;
          r.liveWasSpeaking = bodies.length > 0;

          // the picker's own commit path: N → the recorded track's row
          deck.editmodeHooks?.noop;                            // (no-op; keyboard path below)
          press('n', document.body);
          await new Promise((ok) => setTimeout(ok, 400));
          const rows = [...document.querySelectorAll('.narr-row')];
          const trackRow = rows.find((el) => /Test/.test(el.textContent));
          r.pickerListedTrack = !!trackRow;
          trackRow?.click();
          // long enough for the orphaned live chain's sentence to end and its
          // advance — if the guard failed — to fire
          await new Promise((ok) => setTimeout(ok, 2500));

          r.stayedPut = deck.state.slide === slideBefore;
          r.nowRecorded = JSON.parse(localStorage.getItem(key)).dir === 'voices';
          r.PASS = r.liveWasSpeaking && r.pickerListedTrack && r.stayedPut && r.nowRecorded;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'pause') {
          // data-narration-pause: the slide holds its beat, then the deck
          // carries on by itself. Both halves matter — a beat that never ends
          // is data-narration="hold", and a beat the deck sails through is no
          // beat at all.
          deck._sections[0].dataset.narrationPause = '1';
          const seen = [];
          deck.on('slide', () => seen.push({ n: deck.state.slide, at: Date.now() }));
          const t0 = Date.now();
          deck.toggleNarration();                                // V
          await new Promise((ok) => setTimeout(ok, 5000));

          const left1 = seen.find((s) => s.n === 2);
          r.heldFor = left1 ? left1.at - t0 : null;
          // the two mocked sentences of slide 1 end within ~50ms; everything
          // past that is the beat
          r.held = r.heldFor !== null && r.heldFor >= 900;
          r.slide = deck.state.slide;
          r.total = deck.state.totalSlides;
          r.reachedEnd = deck.state.slide === deck.state.totalSlides;
          r.PASS = r.held && r.reachedEnd;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'pausenav') {
          // Manual navigation mid-beat WINS, exactly as it does mid-sentence:
          // the pending advance must be dropped, not queued behind the jump.
          deck._sections[0].dataset.narrationPause = '3';
          const seen = [];
          deck.on('slide', () => seen.push(deck.state.slide));
          deck.toggleNarration();                                // V
          await new Promise((ok) => setTimeout(ok, 400));        // into the beat
          r.duringBeat = deck.state.slide;
          deck.goto(4, 0);                                       // the presenter moves on
          await new Promise((ok) => setTimeout(ok, 4000));       // past the beat's end

          r.visited = seen;
          r.stayedForTheBeat = r.duringBeat === 1;
          r.wentWhereAsked = seen[0] === 4;
          r.neverJumpedToTwo = !seen.includes(2);
          r.slide = deck.state.slide;
          r.PASS = r.stayedForTheBeat && r.wentWhereAsked && r.neverJumpedToTwo
            && deck.state.slide === 4;
          sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
          return;
        }

        deck.toggleNarration();                                  // V
        await new Promise((ok) => setTimeout(ok, 3000));         // let the chain run

        r.mode = mode;
        r.slide = deck.state.slide;
        r.total = deck.state.totalSlides;
        r.ttsCalls = calls;
        r.failures = failures;

        const msgs = deck.messages().map((m) => m.text);
        r.messages = msgs.length;

        if (mode === 'healthy') {
          // the voice carries the deck to the last slide, on its own
          r.PASS = deck.state.slide === deck.state.totalSlides;
        } else {
          // THE VOICE IS THE CLOCK. It could not speak, so the deck must not
          // have moved on — and it must SAY why, in a message that is kept.
          const stopped = deck.state.slide === 1;
          const explained = msgs.some((m) => /voice|auto-advance/i.test(m));
          // the message window is on screen, top-left, and the log opens over it
          const windowUp = !!document.querySelector('.decklight-messages .decklight-toast');
          deck.toggleMessages();
          const logUp = !!document.querySelector('.decklight-msglog .msg-row');
          r.stopped = stopped;
          r.explained = explained;
          r.windowUp = windowUp;
          r.logUp = logUp;
          r.lastMessage = msgs[msgs.length - 1] ?? '';
          r.PASS = stopped && explained && windowUp && logUp;
        }
      } catch (e) {
        r.exception = String(e && e.stack || e);
        r.PASS = false;
      }
      sink.textContent = 'DECKLIGHT-NARRATION-RESULTS ' + JSON.stringify(r);
    })();
  </script>
</body>
</html>
