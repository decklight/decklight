<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>character overlay — headless verification</title>
<link rel="stylesheet" href="../dist/decklight.css">
</head>
<body>
<div class="decklight" id="root"></div>
<!-- recorded-path sidecar, as `decklight bundle` would inline it -->
<script type="application/json" data-decklight-visemes="slide-01">
{ "v": 1, "kind": "visemes", "duration": 1.0, "source": "test",
  "cues": [ { "t": 0, "v": "X" }, { "t": 0.4, "v": "E" } ] }
</script>
<!-- and the sidecar for ONE ⟨CLICK⟩ beat of that slide. Deliberately a
     different shape at the same instant: at t=0.5 the slide's timeline says E
     and this one says C, so "did it read the beat's own timeline" has a
     one-character answer rather than an inference. -->
<script type="application/json" data-decklight-visemes="slide-01-02">
{ "v": 1, "kind": "visemes", "duration": 1.0, "source": "test",
  "cues": [ { "t": 0, "v": "X" }, { "t": 0.3, "v": "C" } ] }
</script>
<script type="module">
// Drives src/core/character.js directly (no engine, no bridge, no audio
// device): the bridge is a stubbed fetch, the narration audio a plain mock
// object — the controller only ever reads paused/ended/currentTime from it.
// static import: dynamic import() under --virtual-time-budget is flaky
// (module fetch races the budget); static module graphs load before it starts
import { createCharacter, cueAt } from '../src/core/character.js';
import { createFilmRecorder } from '../src/core/film.js';
const results = { PASS: false };
// two 33 ms sync-loop ticks — the controller runs on setInterval, not rAF
const raf2 = () => new Promise((r) => setTimeout(r, 80));
try {
  const timeline = {
    v: 1, kind: 'visemes', duration: 2.0, source: 'stub',
    cues: [{ t: 0, v: 'X' }, { t: 0.3, v: 'B' }, { t: 0.6, v: 'D' }, { t: 1.2, v: 'F' }],
  };
  // 404 for a beat that was never cut — a track recorded before lipsync knew
  // how to cut them is exactly that, and it must not fall back to the slide's
  window.fetch = async (url) => (String(url).includes('slide-01-09')
    ? new Response('nope', { status: 404 })
    : new Response(JSON.stringify(timeline), {
      status: 200, headers: { 'content-type': 'application/json' },
    }));

  const root = document.getElementById('root');
  const character = createCharacter({
    root,
    config: { narration: { character: { mode: 'viseme' } } },
    debugLog: () => {},
    toast: () => {},
  });
  results.mode = character.mode;

  const audio = { paused: false, ended: false, currentTime: 0, playbackRate: 1, addEventListener() {} };
  character.attachAudio(audio);
  character.beginSentence('slide1|s0|n0', { url: 'blob:stub', blob: new Blob(['wav']) }, 'Hello there.');
  await new Promise((r) => setTimeout(r, 60)); // stubbed timeline lands
  await raf2();

  const el = root.querySelector('.decklight-character');
  results.mounted = !!el;
  results.shown = !!el?.classList.contains('show');
  results.mouthShapes = el ? el.querySelectorAll('[data-mouth]').length : 0;

  audio.currentTime = 0.35;
  await raf2();
  results.visemeMidB = el?.getAttribute('data-viseme');
  audio.currentTime = 0.7;
  await raf2();
  results.visemeMidD = el?.getAttribute('data-viseme');
  audio.paused = true;
  await raf2();
  results.visemeWhenPaused = el?.getAttribute('data-viseme');
  audio.paused = false;

  // recorded path: the inline sidecar above, no fetch involved
  character.beginSlide({ dir: 'voiceover' }, 1);
  await new Promise((r) => setTimeout(r, 30));
  audio.currentTime = 0.5;
  await raf2();
  results.visemeFromSidecar = el?.getAttribute('data-viseme');

  // …and a ⟨CLICK⟩ beat reads its OWN timeline. A beat-paced track plays one
  // beat's audio at a time, so the slide's timeline starts at zero against
  // every one of them — right for the first, progressively wronger after it.
  character.beginSlide({ dir: 'voiceover' }, 1, 2);
  await new Promise((r) => setTimeout(r, 30));
  await raf2();
  results.visemeFromBeatSidecar = el?.getAttribute('data-viseme');

  // A beat with no sidecar animates from amplitude rather than mouthing the
  // slide's words: wrong-but-confident is worse than visibly approximate.
  character.beginSlide({ dir: 'voiceover' }, 1, 9);
  await new Promise((r) => setTimeout(r, 30));
  await raf2();
  results.missingBeatDidNotReuseTheSlide = el?.getAttribute('data-viseme') !== 'E';

  // solo: the class lands on the ROOT (the stage is what gets hidden), and
  // only while the character is on screen — a stopped narration or a
  // switched-off character must never leave the deck staring at a blank stage
  character.setSolo(true);
  await raf2();
  results.soloOnRoot = root.classList.contains('decklight-solo');
  results.soloPersisted = character.solo;
  character.setMode('off');
  await raf2();
  results.soloDroppedWhenOff = !root.classList.contains('decklight-solo');
  character.setMode('viseme');   // solo is remembered across the mode switch
  await raf2();
  results.soloBackOnWhenShown = root.classList.contains('decklight-solo');
  character.setSolo(false);
  await raf2();
  results.soloOffClears = !root.classList.contains('decklight-solo');

  // video mode: switching TRACKS on the same slide must switch the file.
  // Every track names its files slide-NN.mp4, so a suffix comparison said
  // "already playing" and kept the old track's face over the new track's audio.
  character.setMode('video');
  character.beginSlide({ dir: 'voices/rachel' }, 7);
  await raf2();
  const vid = () => root.querySelector('.decklight-character video')?.getAttribute('src') ?? '';
  results.videoFromFirstTrack = /voices\/rachel\/slide-07\.mp4$/.test(vid());
  character.beginSlide({ dir: 'voices/me' }, 7);
  await raf2();
  results.videoFollowsTheTrack = /voices\/me\/slide-07\.mp4$/.test(vid());
  // The portrait sits UNDER the video, so the medallion is the photo — never
  // black — while a clip renders; the video shows only once it is playing.
  const still = () => root.querySelector('.decklight-character .still');
  const videoEl = root.querySelector('.decklight-character video');
  results.stillUnderTheVideo = (still()?.getAttribute('src') ?? '').endsWith(`/portrait?name=${encodeURIComponent(character.portrait)}`);
  results.videoHiddenUntilPlaying = !videoEl.classList.contains('live');
  videoEl.dispatchEvent(new Event('playing'));
  results.videoShownWhilePlaying = videoEl.classList.contains('live');
  videoEl.dispatchEvent(new Event('ended'));
  results.photoBackWhenItEnds = !videoEl.classList.contains('live');
  character.setMode('video', { portrait: 'gilles' });
  results.stillFollowsThePortrait = /\/portrait\?name=gilles$/.test(still()?.getAttribute('src') ?? '');
  character.setMode('video', { portrait: 'default' });   // the choice persists: leave it as found
  character.setMode('viseme');

  character.stop();
  results.hiddenAfterStop = !el?.classList.contains('show');
  results.soloDroppedWhenStopped = !root.classList.contains('decklight-solo');
  results.cueAtSpot = cueAt(timeline, 1.5);

  // ── a recorded track with no clips beside it ─────────────────────────────
  // The server says slide-03.mp4 does not exist, the bridge makes video: the
  // head gets a clip made from the very audio file playing, once per file;
  // the files ahead are warmed in order; a track WITH clips never asks.
  {
    const posts = [];
    const realFetch = window.fetch;
    window.fetch = async (url, init = {}) => {
      const u = String(url);
      if (/\.mp4$/.test(u)) return new Response('mp4', { status: /voices\/withclips\//.test(u) ? 200 : 404 });
      if (u.endsWith('/ping')) return new Response(JSON.stringify({ ok: true, engines: { viseme: false, video: ['wav2lip'] }, portraits: ['default'] }), { status: 200 });
      if (/\.wav$/.test(u)) return new Response(new Blob([`RIFF-${u}`]), { status: 200 });
      if (u.includes('/video?')) {
        posts.push(await init.body.text());
        return new Response(new Blob(['mp4'], { type: 'video/mp4' }), { status: 200 });
      }
      return realFetch(url, init);
    };
    const recRoot = document.createElement('div');
    document.body.appendChild(recRoot);
    const rec = createCharacter({ root: recRoot, config: { narration: { character: { bridgeUrl: 'http://bridge.test' } } }, debugLog: () => {}, toast: () => {} });
    rec.setMode('video', { engine: 'wav2lip', portrait: 'default' });
    const audio2 = { paused: true, ended: false, currentTime: 0, playbackRate: 1, addEventListener() {} };
    rec.attachAudio(audio2);
    const v = () => recRoot.querySelector('.decklight-character video');
    const until = async (pred, ms = 5000) => { const t0 = Date.now(); while (!pred() && Date.now() - t0 < ms) await new Promise((r) => setTimeout(r, 20)); return pred(); };
    rec.beginSlide({ dir: 'voices/me' }, 3, 1, 'voices/me/slide-03-01.wav');
    results.recClipFromTheBridge = await until(() => (v()?.getAttribute('src') ?? '').startsWith('blob:'));
    results.recClipIsThatFile = posts[0] === 'RIFF-voices/me/slide-03-01.wav';
    rec.prefetchFiles({ dir: 'voices/me' }, 3, ['voices/me/slide-03-01.wav', 'voices/me/slide-03-02.wav', 'voices/me/slide-04.wav']);
    await until(() => posts.length >= 3);
    results.recWarmsAheadOnce = JSON.stringify(posts) === JSON.stringify(['RIFF-voices/me/slide-03-01.wav', 'RIFF-voices/me/slide-03-02.wav', 'RIFF-voices/me/slide-04.wav']);
    rec.beginSlide({ dir: 'voices/me' }, 3, 2, 'voices/me/slide-03-02.wav');
    await until(() => false, 200);
    results.recNextBeatFromCache = posts.length === 3 && (v()?.getAttribute('src') ?? '').startsWith('blob:');
    rec.beginSlide({ dir: 'voices/withclips' }, 5, null, 'voices/withclips/slide-05.wav');
    results.recSidecarStillWins = await until(() => /voices\/withclips\/slide-05\.mp4$/.test(v()?.getAttribute('src') ?? '')) && posts.length === 3;
    rec.setMode('video', { portrait: 'default' });
    rec.stop();
    recRoot.remove();
    window.fetch = realFetch;
  }

  // ── film yourself (src/core/film.js) ─────────────────────────────────────
  // A canvas is the camera (headless has none) and a stand-in MediaRecorder
  // hands back one chunk on stop; the bridge is a stubbed fetch. What is
  // real: the overlay, its views and keys, the upload, the camera's release.
  {
    const until = async (pred, ms = 20000) => {
      const t0 = Date.now();
      while (!pred()) { if (Date.now() - t0 > ms) throw new Error('timed out waiting'); await new Promise((r) => setTimeout(r, 20)); }
    };
    if (!navigator.mediaDevices?.getUserMedia) {
      Object.defineProperty(navigator, 'mediaDevices', { value: { getUserMedia: () => Promise.reject(new Error('unused')) }, configurable: true });
    }
    class FakeRecorder {
      constructor(stream, o) { this.mimeType = o?.mimeType ?? 'video/webm'; this.state = 'inactive'; }
      start() { this.state = 'recording'; }
      stop() {
        this.state = 'inactive';
        this.ondataavailable?.({ data: new Blob([new Uint8Array(4096)], { type: this.mimeType }) });
        setTimeout(() => this.onstop?.(), 0);
      }
    }
    const filmRoot = document.createElement('div');
    document.body.appendChild(filmRoot);
    const opts = { root: filmRoot, bridge: 'http://bridge.test/lipsync', seconds: 1, countdownMs: 10, createRecorder: (s, o) => new FakeRecorder(s, o) };

    // the camera refused: said as what to do, not a stack
    const refused = createFilmRecorder({ ...opts, getUserMedia: () => Promise.reject(new DOMException('denied', 'NotAllowedError')) });
    refused.open();
    await until(() => refused.view === 'why');
    results.filmRefusalSaid = /the camera was refused — allow it/.test(filmRoot.textContent);
    refused.close();

    const canvas = Object.assign(document.createElement('canvas'), { width: 64, height: 48 });
    canvas.getContext('2d').fillRect(0, 0, 64, 48);
    const cam = canvas.captureStream(10);
    const posts = [];
    const answers = [
      { status: 422, body: { error: 'no face found in the film — film the face toward the camera, evenly lit' } },
      { status: 200, body: { ok: true, name: 'filmed', steady: true, seconds: 1 } },
    ];
    let used = null;
    const film = createFilmRecorder({
      ...opts,
      getUserMedia: async (c) => { results.filmAskedNoMic = c.audio === false && !!c.video; return cam; },
      fetchFn: async (url, init) => {
        posts.push({ url, type: init.headers['content-type'], size: init.body.size });
        const a = answers.shift();
        return new Response(JSON.stringify(a.body), { status: a.status, headers: { 'content-type': 'application/json' } });
      },
      onUse: (u) => { used = u; },
    });
    film.open();
    await until(() => film.view === 'ready');
    const live = filmRoot.querySelector('.decklight-film .film-circle .film-video');
    results.filmLivePreview = live?.srcObject === cam && live.classList.contains('mirror');
    results.filmTipsShown = /don't talk/.test(filmRoot.textContent);
    film.keydown({ key: 'Enter' });
    await until(() => film.view === 'review');
    results.filmReviewPlaysTheTake = (filmRoot.querySelector('.film-video')?.getAttribute('src') ?? '').startsWith('blob:');
    film.keydown({ key: 'r' });
    results.filmRetakeBackToReady = film.view === 'ready';
    film.keydown({ key: 'Enter' });
    await until(() => film.view === 'review');
    film.keydown({ key: 'Enter' });
    await until(() => film.view === 'failed');
    results.filmBridgeRefusalSaid = /no face found in the film/.test(filmRoot.textContent);
    results.filmPosted = posts[0]?.url === 'http://bridge.test/lipsync/portrait?name=filmed' && /^video\/(mp4|webm)$/.test(posts[0].type) && posts[0].size === 4096;
    film.keydown({ key: 'Enter' });            // retake from the failure
    await until(() => film.view === 'ready');
    film.keydown({ key: 'Enter' });
    await until(() => film.view === 'review');
    film.keydown({ key: 'Enter' });
    await until(() => film.view === 'closed');
    results.filmUsed = used?.name === 'filmed' && used.steady === true;
    results.filmCameraReleased = cam.getTracks().every((t) => t.readyState === 'ended');
    results.filmOverlayGone = !filmRoot.querySelector('.decklight-film');
  }

  results.PASS = results.mounted && results.shown && results.mouthShapes === 9
    && results.videoFromFirstTrack && results.videoFollowsTheTrack
    && results.stillUnderTheVideo && results.videoHiddenUntilPlaying && results.videoShownWhilePlaying
    && results.photoBackWhenItEnds && results.stillFollowsThePortrait
    && results.visemeMidB === 'B' && results.visemeMidD === 'D'
    && results.visemeWhenPaused === 'X' && results.visemeFromSidecar === 'E'
    && results.visemeFromBeatSidecar === 'C' && results.missingBeatDidNotReuseTheSlide
    && results.hiddenAfterStop && results.cueAtSpot === 'F'
    && results.soloOnRoot && results.soloPersisted && results.soloDroppedWhenOff
    && results.soloBackOnWhenShown && results.soloOffClears
    && results.soloDroppedWhenStopped
    && results.recClipFromTheBridge && results.recClipIsThatFile && results.recWarmsAheadOnce
    && results.recNextBeatFromCache && results.recSidecarStillWins
    && results.filmRefusalSaid && results.filmAskedNoMic && results.filmLivePreview && results.filmTipsShown
    && results.filmReviewPlaysTheTake && results.filmRetakeBackToReady && results.filmBridgeRefusalSaid
    && results.filmPosted && results.filmUsed && results.filmCameraReleased && results.filmOverlayGone;
} catch (e) {
  results.error = String(e && e.stack || e);
}
document.body.appendChild(Object.assign(document.createElement('pre'),
  { textContent: 'DECKLIGHT-CHARACTER-RESULTS ' + JSON.stringify(results) }));
</script>
</body>
</html>
