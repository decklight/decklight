<!-- South Brand templates: structure only, the look lives in design-system.css -->
<template data-template="title-points" data-title="Title and points">
  <div class="south-frame">
    <div data-slot="eyebrow" data-slot-hint="p"></div>
    <div class="south-title" data-slot="title" data-slot-hint="h1,h2" data-slot-required></div>
    <div data-slot="subtitle" data-slot-hint="p"></div>
    <div class="south-points" data-slot="points" data-slot-hint="ul,ol"></div>
    <div data-slot="body" data-slot-default></div>
  </div>
</template>
