<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decklight engine — overlay & keyboard-nav harness</title>
  <link rel="stylesheet" href="../dist/decklight.css">
</head>
<body>
  <!--
    The interaction the render harness can't see: the overlays (theme picker,
    command palette) and the keyboard that drives them — opening, wrap-around
    list navigation, Enter/Escape, backdrop-click-to-close, and the rule that
    only one overlay is up at a time. This is the safety net for splitting the
    overlay / theme / palette machinery out of engine.js: it exercises the
    behaviour, not just that the DOM mounts.

    Everything runs against the REAL bundled engine; only fetch is mocked, so a
    stray localhost probe (the edit server's /ping) can't leave a pending
    request that freezes Chrome's virtual clock and hangs the page.
  -->
  <div class="decklight">
    <section><h1>One</h1></section>
    <section><h2>Two</h2>
      <aside class="sources">
        <dl><dt>owner</dt><dd>platform-team</dd><dt>reviewed</dt><dd>2026-08-14</dd></dl>
        <ul>
          <li><a href="https://example.invalid/kip-98">KIP-98</a> — the original proposal</li>
          <li><a href="https://example.invalid/txn">Transactions guide</a></li>
        </ul>
      </aside>
    </section>
    <section><h2>Three</h2></section>
    <section><h2>Four</h2></section>
  </div>

  <pre id="test-sink">running…</pre>

  <script>
    // No network in a harness: answer everything fast so nothing stays pending.
    // The restore overlay (R) is the exception — it only exists when an edit
    // server does, so that mode stands one up in miniature: enough of /edit/ping
    // and /edit/history for the overlay to mount and list something real.
    const HARNESS_MODE = new URLSearchParams(location.search).get('mode') ?? 'themepicker';
    const FAKE_HISTORY = [
      { hash: 'aaaaaaa', when: '2 minutes ago', subject: 'tighten the closing slide' },
      { hash: 'bbbbbbb', when: '1 hour ago', subject: 'add the pros/cons split' },
      { hash: 'ccccccc', when: '3 days ago', subject: 'first draft' },
    ];
    // The two shapes an added theme reaches a page in. A theme the deck MARKS
    // is linked by the server — inert, under its marketplace — and an older
    // `theme add` pasted a block into the deck, which still has to work. The
    // deck is put in LINK mode alongside them because that is the combination
    // that could go wrong — a deck whose themes come from a <link> must not
    // lose them the moment it gains an added one.
    // The exports are told the theme on screen (#547), so they run on a deck
    // that HAS one — linked, the way a data-only deck is served.
    if (HARNESS_MODE === 'exportvideo' || HARNESS_MODE === 'exportpptx') {
      document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="../themes/aurora.css">');
    }
    if (HARNESS_MODE === 'added') {
      document.head.insertAdjacentHTML('beforeend',
        '<link rel="stylesheet" href="../themes/aurora.css">'
        + '<style data-theme="nord-deep" data-theme-added media="not all">'
        + '.decklight { --bg: #101018; --fg: #eeeeee; }</style>'
        + '<link rel="stylesheet" href="data:text/css,.decklight%7B--bg:%23203040;--fg:%23eeeeee%7D"'
        + ' data-theme="acme-blue" data-theme-added data-theme-marketplace="acme" data-theme-source="Acme"'
        + ' media="not all">');
    }
    // Marketplace themes in the overlay (MARKETPLACE.md THEME_BROWSE#UI) need
    // an author server to exist at all, so `browse` stands one up in
    // miniature — enough of /edit/ping, /edit/theme/browse and /edit/theme/mark
    // to drive them. `nobrowse` is the same deck with NO server, which is where
    // they must be absent.
    const FAKE_BROWSE = {
      ok: true,
      cacheOnly: true,
      stale: ['decklight'],
      themes: [
        { name: 'nord-deep', marketplace: 'nord-pack', qualified: 'nord-deep@nord-pack', title: 'Nord Pack', description: 'deep blues', marked: false },
        { name: 'broken', marketplace: 'nord-pack', qualified: 'broken@nord-pack', title: 'Nord Pack', marked: false },
      ],
    };
    // The wizard (MARKETPLACE.md ENGINES#WIZARD) also needs an author server to
    // exist, so `wizard` stands one up in miniature: a ping that advertises one
    // configurable engine, a GET that hands over a vetted schema covering every
    // renderable field type, and a POST that rejects the first answers so the
    // failure surface is exercised before the success one.
    const FAKE_WIZARD_SCHEMA = {
      engine: 'elevenlabs', title: 'ElevenLabs',
      fields: [
        { name: 'apiKey', label: 'API key', type: 'secret', required: true },
        { name: 'voice', label: 'Voice', type: 'choice', options: ['Rachel', 'Adam'], required: false },
        { name: 'cache', label: 'Cache audio', type: 'boolean', default: true, required: false },
        { name: 'note', label: 'Note', type: 'text', required: false },
      ],
      validate: '/validate',
    };
    // What cli/wizard.mjs's provenance() derives for that schema (#232) — the
    // asker in the registry's words and where the answers go. `bare@voices`
    // below deliberately arrives WITHOUT this pair, to prove the refusal.
    const FAKE_WIZARD_PROVENANCE = {
      askedBy: 'asked by elevenlabs@voices',
      sentTo: 'answers go to its own bridge on this machine (127.0.0.1:8787/validate), then ~/.decklight/credentials.json (0600)',
    };
    const CALLS = { get: [], post: [] };
    const json = (o, status = 200) => new Response(JSON.stringify(o), { status, headers: { 'content-type': 'application/json' } });
    window.fetch = async (url, init) => {
      const u = String(url);
      if (init?.method === 'POST') CALLS.post.push({ u, body: JSON.parse(init.body ?? '{}') });
      else CALLS.get.push(u);
      if (HARNESS_MODE === 'restore') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/history')) return json({ ok: true, entries: FAKE_HISTORY });
        if (u.includes('/edit/restore')) return json({ ok: true, changed: true, short: 'aaaaaaa', undo: 1, redo: 0 });
      }
      // The commit window (K, and its ⌘K/⌃K alias) needs an author server for
      // editAvailable, plus the two routes it actually calls. `messages:false`
      // so no agent is asked to draft a subject — the shortcut is what is under
      // test here, not the drafting.
      if (HARNESS_MODE === 'commit') {
        if (u.includes('/edit/ping')) {
          return json({ ok: true, undo: 0, redo: 0, git: true, agents: [],
            commit: { dirty: true, lines: 7, sinceMs: 0, nag: false, canWrite: true, messages: false } });
        }
        if (u.includes('/edit/commit') && (init?.method ?? 'GET') === 'GET') {
          return json({ ok: true, dirty: true, lines: 7, sinceMs: 0, nag: false,
            canWrite: true, messages: false, deck: 'engine.html' });
        }
        if (u.includes('/edit/commit')) {
          window.__committed = JSON.parse(init?.body ?? '{}').message;
          return json({ ok: true, committed: true, subject: window.__committed,
            undo: 0, redo: 0, dirty: false, lines: 0, sinceMs: 0, nag: false, canWrite: true });
        }
      }
      // The hand-over rows (PRESENTING) are author-mode only, so this mode
      // stands up the two routes they use: a ping so editAvailable is true,
      // and the export itself. `exportfail` is the same deck with a server
      // that refuses, which is the branch that must not leave the row looking
      // like it silently did nothing.
      if (HARNESS_MODE === 'exportpptx' || HARNESS_MODE === 'exportfail' || HARNESS_MODE === 'exportvideo') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        // The video card's voices: a folder recorded by `say` (a manifest, so
        // offerable), your own take (no manifest, so not), and a piper bridge.
        if (HARNESS_MODE === 'exportvideo' && u.includes('/edit/tracks')) {
          return json({ ok: true, tracks: [
            { dir: 'voices/me', files: 3, segments: false, ext: 'wav', engine: null, voice: null, manifest: false },
            { dir: 'voiceover', files: 2, segments: false, ext: 'm4a', engine: 'say', voice: 'Samantha', manifest: true, stale: 0 },
            // voiced from notes the deck no longer has on two slides (#536): offered, marked
            { dir: 'voices/older', files: 4, segments: false, ext: 'm4a', engine: 'say', voice: 'Daniel', manifest: true, stale: 2 },
          ] });
        }
        if (HARNESS_MODE === 'exportvideo' && u.endsWith('/ping')) {
          return json({ ok: true, engine: 'piper', model: 'en_US-ryan-high', stylable: false, voices: [['en_US-ryan-high', 'local']] });
        }
        if (u.includes('/edit/export')) {
          const kind = JSON.parse(init?.body ?? '{}').kind;
          return HARNESS_MODE === 'exportfail'
            ? json({ ok: false, error: 'no Chrome found — install one, or point $CHROME at it' }, 503)
            : json({ ok: true, kind, file: kind === 'pptx' ? 'deck.pptx' : kind === 'video' ? 'deck.slides-2-3.mp4' : 'deck.handout.pdf', seconds: 6.2,
              ...(kind === 'video' ? { voiced: 'voices/en-us-ryan-high' } : {}) });
        }
      }
      // The Publish row (PRESENTING) is the one that reaches off the machine,
      // so it is two presses: the plan, shown, then the push. Both routes are
      // stood up here — and the plan is a GET on purpose, which is half of
      // what the assertions check.
      if (HARNESS_MODE === 'publish') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        // the longer path first: /edit/publish is a prefix of /edit/publish/plan
        if (u.includes('/edit/publish/plan')) {
          return json({ ok: true, remote: 'origin', branch: 'gh-pages', bundled: false,
            url: 'https://acme.github.io/talks/', signing: true, why: null });
        }
        if (u.includes('/edit/publish')) {
          return json({ ok: true, remote: 'origin', branch: 'gh-pages', commit: 'abc1234',
            url: 'https://acme.github.io/talks/' });
        }
      }
      // Insert-from-a-template (UNITS#REST): three routes, and the second one
      // is the interesting shape — a template read as a list of slides, each
      // saying what it points at that THIS deck will not have.
      if (HARNESS_MODE === 'sourcesedit') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/sources')) {
          const b = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, changed: true, undo: 1, redo: 0,
            dropped: b.links.filter((l) => /^javascript:/i.test(l.href ?? '')).map((l) => l.href) });
        }
      }
      if (HARNESS_MODE.startsWith('template')) {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/template/list')) {
          return json({ ok: true, cacheOnly: true, stale: [],
            installed: ['startup-pitch'],
            offered: [{ name: 'quarterly', qualified: 'quarterly@acme', marketplace: 'acme', description: 'a review deck' }] });
        }
        if (u.includes('/edit/template/slides')) {
          return json({ ok: true, name: 'startup-pitch', slides: [
            { n: 1, title: 'Startup pitch', hidden: false, needs: [], clashes: [] },
            { n: 2, title: 'Pricing', hidden: false, needs: ['assets/table.png'], clashes: [] },
            { n: 3, title: 'Backup', hidden: true, needs: [], clashes: ['.breaks'] },
          ] });
        }
        if (u.includes('/edit/template/apply')) {
          const b = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, to: b.to, from: b.slide, name: 'startup-pitch', fromTitle: 'Pricing',
            applied: { 'data-layout': 'split', class: 'tinted' }, replaced: { 'data-layout': 'centered' },
            undo: 1, redo: 0, styles: { carried: ['.tinted'], clashed: [], dangling: [] } });
        }
        if (u.includes('/edit/template/insert')) {
          const body = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, inserted: body.slides.length, after: body.after, name: 'startup-pitch',
            titles: ['Pricing'], needs: ['assets/table.png'], undo: 1, redo: 0,
            styles: { carried: ['.pricing'], clashed: ['.breaks'], dangling: ['--card-bg'] } });
        }
      }
      if (HARNESS_MODE === 'browse') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/theme/browse')) return json(FAKE_BROWSE);
        if (u.includes('/edit/theme/mark')) {
          const { ref, marked } = JSON.parse(init?.body ?? '{}');
          // The refusal is `theme add`'s own, verbatim — the picker is not
          // allowed to have a laxer opinion than the command line.
          return ref === 'broken@nord-pack'
            ? json({ error: 'broken fails the theme contract', problems: ['--fg is not defined'] }, 400)
            : json({ ok: true, ref, marked, changed: true, undo: 1 });
        }
      }
      // Element edit mode (E, then right-click a slide element — #112) needs
      // an author server to exist at all, same as every other author-mode
      // feature here: enough of /edit/ping for editAvailable, plus the four
      // /edit/element/* routes the menu's actions actually call.
      // Mouse editing (authoring.js): a double-click saves through the SOURCE
      // of the element and the content route, and the slide operations are one
      // POST each answering with the slide to land on.
      if (HARNESS_MODE === 'authoring') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/element/source')) return json({ ok: true, html: '<h1>One</h1>' });
        // Slow on purpose: a real save reads the source, then writes. Undo must
        // queue behind a write still in flight, and these markers say when each
        // one actually landed.
        if (u.includes('/edit/element/content')) {
          await new Promise((ok) => setTimeout(ok, 250));
          CALLS.post.push({ u: 'LANDED element content', body: {} });
          return json({ ok: true, changed: true, undo: 1, redo: 0 });
        }
        if (u.includes('/edit/slide')) {
          const b = JSON.parse(init?.body ?? '{}');
          await new Promise((ok) => setTimeout(ok, 250));
          CALLS.post.push({ u: 'LANDED slide op', body: {} });
          return json({ ok: true, slide: b.op === 'delete' ? b.slide : b.slide + 1, total: 5, undo: 1, redo: 0 });
        }
        if (u.includes('/edit/undo')) return json({ ok: true, undo: 0, redo: 1 });
      }
      if (HARNESS_MODE === 'editor') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        // a long element: eighty lines, one of them four hundred characters —
        // the shape whose painted layer fell out of step with the textarea (#529)
        if (u.includes('/edit/element/source')) {
          const lines = [];
          for (let i = 1; i <= 80; i++) lines.push(i === 7 ? `<text x="1" y="1">${'lorem ipsum '.repeat(34)}</text>` : `<rect x="${i}" y="${i}" width="10" height="10"/>`);
          return json({ ok: true, html: `<g>\n${lines.join('\n')}\n</g>` });
        }
        if (u.includes('/edit/element/content')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
      }
      if (HARNESS_MODE === 'typingdock') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true,
          agents: [{ name: 'claude', label: 'Claude Code', installed: true }] });
        if (u.includes('/edit/notes')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
      }
      if (HARNESS_MODE === 'codeedit') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/element/source')) {
          return json({ ok: true, html: '<pre data-lines="1|2"><code class="language-js">\nconst a = 1;\nconst b = 2;\n</code></pre>' });
        }
        if (u.includes('/edit/element/content')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
      }
      if (HARNESS_MODE === 'colors') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/element/style')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
      }
      if (HARNESS_MODE === 'contextmenu') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/element/source')) return json({ ok: true, html: '<h1>One</h1>' });
        if (u.includes('/edit/element/remove')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
        if (u.includes('/edit/element/content')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
        if (u.includes('/edit/element/effect')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
      }
      if (HARNESS_MODE === 'wizard') {
        if (u.includes('/edit/ping')) {
          return json({ ok: true, undo: 0, redo: 0, git: true, agents: [],
            wizards: [{ name: 'elevenlabs', qualified: 'elevenlabs@voices', title: 'ElevenLabs' }] });
        }
        if (u.includes('/edit/wizard')) {
          if (init?.method !== 'POST') {
            // an old or hostile server that hands over a schema with no
            // provenance — the player must refuse to prompt with it (#232)
            if (u.includes('bare')) return json({ ok: true, schema: FAKE_WIZARD_SCHEMA });
            return json({ ok: true, schema: FAKE_WIZARD_SCHEMA,
              from: 'elevenlabs@voices', provenance: FAKE_WIZARD_PROVENANCE });
          }
          // first answers rejected (the wrong-key path), second accepted
          return CALLS.post.filter((c) => c.u.includes('/edit/wizard')).length <= 1
            ? json({ ok: false, state: 'rejected', error: 'that key did not authenticate' }, 400)
            : json({ ok: true, state: 'configured', stored: { apiKey: 'set (13 chars)', voice: 'Rachel', cache: true } });
        }
      }
      return new Response('', { status: 404 });
    };
    // The deck opens an EventSource once the ping succeeds; there is no server
    // behind it here, and a pending connection would hold the virtual clock.
    // It REMEMBERS its listeners so a mode can push an event through it — the
    // export progress the server narrates arrives this way and nowhere else.
    window.EventSource = class {
      constructor() { this.readyState = 0; this._l = {}; window.__es = this; }
      addEventListener(type, fn) { (this._l[type] ??= []).push(fn); }
      emit(type, data) { for (const fn of this._l[type] ?? []) fn({ data: JSON.stringify(data) }); }
      close() {}
    };
  </script>

  <script src="../dist/decklight.js"></script>
  <script>
    const sink = document.getElementById('test-sink');
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') ?? 'themepicker';
    // `hidden`: slide 2 is hidden BEFORE init, the way an author would mark it
    if (mode === 'hidden') document.querySelectorAll('.decklight > section')[1].setAttribute('data-hidden', '');

    // This harness drives overlays and keys, not onboarding: mark the welcome
    // seen so the card never intercepts the first keystroke below (SPEC
    // PRESENTING), and tips off so no toast lands in the middle of a dump.
    try {
      localStorage.setItem('decklight-onboarded', '1');
      localStorage.setItem('decklight-tips-off', '1');
    } catch { /* ignore */ }

    // The `narration` mode needs a deck that HAS a voice — that is the whole
    // condition ⎵ branches on. A files track is enough and needs no bridge; the
    // clips themselves never load here, because what is under test is which key
    // does what, not whether audio decodes.
    // in-file chapters (#479): the markers must be on the sections BEFORE init,
    // because createPlaylist reads them once at setup
    // Line Draw (#522): one more slide, only for the mode that looks at it —
    // every other mode counts on four
    if (HARNESS_MODE === 'linedraw') {
      document.querySelector('.decklight').insertAdjacentHTML('beforeend', `<section><h2>Five</h2>
      <svg viewBox="0 0 800 200" width="800" data-build="draw">
        <defs><marker id="ld-arr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto"><polygon points="0 0, 6 2, 0 4" fill="currentColor"/></marker></defs>
        <line class="ld-stops" x1="20" y1="32" x2="767" y2="32" stroke="#c33" stroke-width="6" data-draw-stops="347 542 767" data-build-order="1" marker-end="url(#ld-arr)"/>
        <g class="ld-box" data-build="fade-up" data-build-self data-build-order="1"><rect x="20" y="60" width="300" height="30"/></g>
        <g class="ld-box" data-build="fade-up" data-build-self data-build-order="2"><rect x="340" y="60" width="180" height="30"/></g>
        <g class="ld-box" data-build="fade-up" data-build-self data-build-order="3"><rect x="540" y="60" width="220" height="30"/></g>
        <path class="ld-curve" d="M 40 180 C 200 60, 500 60, 760 180" fill="none" stroke="#36c" stroke-width="4" marker-end="url(#ld-arr)"/>
        <line class="ld-plain" x1="20" y1="120" x2="400" y2="120" stroke="#888" stroke-width="3"/>
      </svg>
    </section>`);
    }
    // Nested fills (#541): two panels of different slots, each holding boxes
    // authored with the same slot — only for the mode that looks at it
    if (HARNESS_MODE === 'nestedfills') {
      // this harness loads no theme: give the diagram tokens real colours so
      // the computed fills can be told apart (the Confluent slots of the
      // motivating slide, and its ink)
      const tokens = { '--d-text': '#f2ece4', '--d-fill-1': '#141c33', '--d-fill-2': '#1a2a44', '--d-fill-4': '#171a3d', '--d-fill-6': '#33201a' };
      for (const [k, v] of Object.entries(tokens)) document.querySelector('.decklight').style.setProperty(k, v);
      document.querySelector('.decklight').insertAdjacentHTML('beforeend', `<section><h2>Nested</h2>
        <svg viewBox="0 0 800 300" width="800" aria-label="two panels with two boxes each">
          <rect class="nf-panel-a" x="20" y="40" width="340" height="240" style="fill: var(--d-fill-6)"/>
          <rect class="nf-box-a1" x="50" y="70" width="120" height="40" style="fill: var(--d-fill-1)"/>
          <g transform="translate(0 60)"><rect class="nf-box-a2" x="50" y="70" width="120" height="40" fill="var(--d-fill-1)"/></g>
          <rect class="nf-deep" x="60" y="200" width="40" height="20" style="fill: var(--d-fill-in)"/>
          <rect class="nf-panel-b" x="440" y="40" width="340" height="240" style="fill: var(--d-fill-4)"/>
          <rect class="nf-box-b1" x="470" y="70" width="120" height="40" style="fill: var(--d-fill-1)"/>
          <rect class="nf-box-b2" x="470" y="130" width="120" height="40" style="fill: var(--d-fill-1)"/>
          <rect class="nf-concept" data-concept="tools" x="620" y="130" width="120" height="40" style="fill: var(--d-fill-1)"/>
          <rect class="nf-off" data-nest="off" x="620" y="200" width="120" height="40" style="fill: var(--d-fill-1)"/>
          <rect class="nf-outline" x="470" y="200" width="120" height="40" fill="none" stroke="var(--d-stroke)"/>
          <rect class="nf-overlay" x="10" y="10" width="780" height="20" style="fill: var(--d-fill-2)"/>
          <text class="nf-text" x="110" y="95" style="fill: var(--d-text)">label</text>
        </svg>
      </section>`);
    }
    // The colour picker: a diagram box with its label, a loose label, and an
    // HTML block — only for the mode that looks at it. No theme loads here, so
    // the palette's tokens are given inline (a secondary that IS one).
    if (HARNESS_MODE === 'colors') {
      const tokens = { '--accent': '#5ee6c0', '--accent-contrast': '#04261c', '--link': '#8ecbff', '--fg': '#eef0ff', '--bg': '#0d1b3d',
        '--d-text': '#f2ece4', '--d-fill-1': '#141c33', '--d-fill-2': '#1a2a44', '--d-fill-3': '#223355' };
      for (const [k, v] of Object.entries(tokens)) document.querySelector('.decklight').style.setProperty(k, v);
      document.querySelector('.decklight').insertAdjacentHTML('beforeend', `<section><h2>Colours</h2>
        <svg viewBox="0 0 800 200" width="800" aria-label="one labelled box">

        q('.cp-apply').click();
        await settle();
        const post = CALLS.post.find((c) => c.u.includes('/edit/element/style'));
        const edits = post?.body.edits ?? [];
        r.postsBoth = post?.body.slide === 5 && post?.body.index === 1 && edits.length === 2
          && edits[0].prop === 'fill' && edits[0].value === 'var(--accent)' && edits[0].tag === 'rect'
          && edits[1].prop === 'fill' && edits[1].value === '#0a0b0c' && edits[1].tag === 'text';
        // the engine's .draw-head sits before the group in the DOM: the path is still the file's [1, 0]
        r.pathIsTheFiles = JSON.stringify(edits[0]?.path) === '[1,0]' && JSON.stringify(edits[1]?.path) === '[1,1]';
        r.closesOnApply = !document.querySelector(C);

        // right-clicking the LABEL means the same pair
        openOn(label);
        r.labelFindsItsBox = !q('.cp-side [data-id="fill"]').disabled && !q('.cp-side [data-id="text"]').disabled;
        // Reset takes the colour off, and that is what is saved
        q('.cp-reset').click();
        q('.cp-apply').click();
        await settle();
        const reset = CALLS.post.filter((c) => c.u.includes('/edit/element/style'))[1];
        r.resetPostsNull = reset?.body.edits.length === 1 && reset.body.edits[0].value === null;

        // an HTML block, from the inline run inside it: background-color and color, on the block
        openOn(document.querySelector('.cp-quote strong'));
        q('.cp-swatch[data-token="--d-fill-2"]').click();
        q('.cp-apply').click();
        await settle();
        const html = CALLS.post.filter((c) => c.u.includes('/edit/element/style'))[2];
        r.htmlBlock = html?.body.index === 2 && html.body.edits.length === 1 && html.body.edits[0].tag === 'blockquote'
          && html.body.edits[0].prop === 'background-color' && JSON.stringify(html.body.edits[0].path) === '[]';

        r.PASS = r.opens && r.docks && r.themeTabFirst && r.primaryAndSecondaryNamed && r.fillsNumbered
          && r.undefinedTokensLeftOut && r.currentMarked && r.applyWaitsForAPick && r.previewsToken
          && r.escapeRestores && r.customHasRgb && r.customStartsFromTheTarget && r.customHasHsb
          && r.hsbPreviews && r.hexTyped && r.postsBoth && r.pathIsTheFiles && r.closesOnApply
          && r.labelFindsItsBox && r.resetPostsNull && r.htmlBlock;
      }

      if (mode === 'contextmenu') {
        // Element edit mode (#112): E only ARMS it — right-clicking a slide
        // element is the actual surface, and the menu it opens differs by
        // WHAT was right-clicked, not by a separate keystroke.
        const M = '.decklight-ctxmenu', ROW = '.cm-row', SEL = 'cm-selected';
        const rightClick = (el) => el.dispatchEvent(new MouseEvent('contextmenu',
          { bubbles: true, cancelable: true, clientX: 40, clientY: 40 }));
        const rowsText = () => [...document.querySelectorAll(`${M} ${ROW}`)].map((x) => x.textContent);
        const clickRow = (label) => [...document.querySelectorAll(`${M} ${ROW}`)].find((x) => x.textContent === label)?.click();
        await settle();                        // let /edit/ping resolve

        const sections = [...document.querySelectorAll('.decklight section')];
        const h1 = sections[0].querySelector('h1');

        // E arms the mode; it does not open anything by itself
        press('e');
        r.armingOpensNoMenu = !document.querySelector(M);

        // right-click ON an element → the full menu
        rightClick(h1);
        r.opensOnElement = !!document.querySelector(M);
        r.fullMenuRows = JSON.stringify(rowsText())
          === JSON.stringify(['Edit speaker notes', 'Remove element', 'Edit content (HTML)', 'Colors…', 'Add text effect ▸', 'Slide ▸']);
        const a = selectedIndex(M, ROW, SEL);
        r.hasSelection = a.i === 0;
        press('ArrowDown');
        r.downMoves = selectedIndex(M, ROW, SEL).i === 1;
        r.escapeCloses = escapeUntilClosed(M);

        // right-click the SECTION ITSELF (no descendant under the cursor) →
        // background only gets "Edit speaker notes", which is where notes
        // editing lives now that E means something else
        rightClick(sections[0]);
        r.opensOnBackground = !!document.querySelector(M);
        // the background has no element to act on, so the slide itself is what is offered
        r.backgroundOnlyNotes = JSON.stringify(rowsText()) === JSON.stringify(['Edit speaker notes', 'Slide ▸']);
        press('Escape');

        // "Add text effect ▸" drills into a submenu — the 7 SPEC entrance
        // styles, 'none' (a real, instant build step), "remove effect", and a
        // back row — and committing one posts { slide, index, effect }
        rightClick(h1);
        clickRow('Add text effect ▸');
        const fx = rowsText();
        r.submenuShape = fx[0] === '← back' && fx.includes('fade-up') && fx.includes('highlight')
          && fx.includes('none (instant)') && fx.includes('remove effect') && fx.length === 10;
        clickRow('fade-up');
        await settle();
        const fxPost = CALLS.post.find((c) => c.u.includes('/edit/element/effect'));
        r.postsEffect = fxPost?.body.slide === 1 && fxPost?.body.index === 0 && fxPost?.body.effect === 'fade-up';
        r.closesAfterEffect = !document.querySelector(M);

        // "Remove element" posts { slide, index }
        rightClick(h1);
        clickRow('Remove element');
        await settle();
        const rmPost = CALLS.post.find((c) => c.u.includes('/edit/element/remove'));
        r.postsRemove = rmPost?.body.slide === 1 && rmPost?.body.index === 0;

        // "Edit content (HTML)" reads the element's outerHTML fresh from the
        // FILE (the fake /edit/element/source above), never the live DOM, and
        // Save posts the edited value back
        rightClick(h1);
        clickRow('Edit content (HTML)');
        await settle();
        const W = '.decklight-editor';
        const ta = document.querySelector(`${W} textarea`);
        r.contentMounts = !!ta;
        r.contentLoadedFromSource = ta?.value === '<h1>One</h1>';
        ta.value = '<h1>Renamed</h1>';
        ta.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', metaKey: true, bubbles: true, cancelable: true }));
        await settle();
        const contentPost = CALLS.post.find((c) => c.u.includes('/edit/element/content'));
        r.postsContent = contentPost?.body.slide === 1 && contentPost?.body.index === 0
          && contentPost?.body.html === '<h1>Renamed</h1>';
        r.escapeClosesContentEditor = escapeUntilClosed(W);

        // A slide with no per-element source mapping (data-markdown-removed,
        // #112's stand-in for the notes editor's markdown guard — markdown
        // slides were removed in 0.3.0, so this repo has no real fixture)
        // declines the whole menu rather than opening one that lies about
        // what it can save.
        sections[1].setAttribute('data-markdown-removed', '');
        rightClick(sections[1].querySelector('h2'));
        r.declinesOnMarkdownSlide = !document.querySelector(M);

        // backdrop click closes
        rightClick(h1);
        document.querySelector(M)?.click();
        r.backdropCloses = !document.querySelector(M);

        // E again disarms — no more menu on right-click
        press('e');
        rightClick(h1);
        r.disarmedNoMenu = !document.querySelector(M);

        r.PASS = r.armingOpensNoMenu && r.opensOnElement && r.fullMenuRows && r.hasSelection && r.downMoves
          && r.escapeCloses && r.opensOnBackground && r.backgroundOnlyNotes
          && r.submenuShape && r.postsEffect && r.closesAfterEffect && r.postsRemove
          && r.contentMounts && r.contentLoadedFromSource && r.postsContent && r.escapeClosesContentEditor
          && r.declinesOnMarkdownSlide && r.backdropCloses && r.disarmedNoMenu;
      }
    } catch (e) {
      r.exception = String((e && e.stack) || e);
      r.PASS = false;
    }
    r.mode = mode;
    sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
    })();
  </script>
</body>
</html>
