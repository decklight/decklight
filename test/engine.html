<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decklight engine — overlay & keyboard-nav harness</title>
  <link rel="stylesheet" href="../dist/decklight.css">
</head>
<body>
  <!--
    The interaction the render harness can't see: the overlays (theme picker,
    command palette) and the keyboard that drives them — opening, wrap-around
    list navigation, Enter/Escape, backdrop-click-to-close, and the rule that
    only one overlay is up at a time. This is the safety net for splitting the
    overlay / theme / palette machinery out of engine.js: it exercises the
    behaviour, not just that the DOM mounts.

    Everything runs against the REAL bundled engine; only fetch is mocked, so a
    stray localhost probe (the edit server's /ping) can't leave a pending
    request that freezes Chrome's virtual clock and hangs the page.
  -->
  <div class="decklight">
    <section><h1>One</h1></section>
    <section><h2>Two</h2>

      </aside>
    </section>
    <section><h2>Three</h2></section>

        r.startsAtTheDeckRatio = size().join('x') === '1280x720' && !rootEl.hasAttribute('data-display-fill');
        const row = () => deck.settings.rows().find((x) => x.label === 'Display');
        r.rowSaysTheRatio = row()?.value === '16:9' && /⏎ switches/.test(row()?.hint ?? '');
        r.versionStaysFirst = deck.settings.rows()[0]?.label === 'Decklight version';
        deck.settings.open();
        press('ArrowDown');
        press('Enter');
        await settle(); await settle();
        const box = rootEl.getBoundingClientRect();
        const [w, h] = size();
        r.fillSize = `${w}x${h}`;
        r.fillKeepsTheWidth = w === 1280 && h > 720;
        r.fillMatchesTheScreen = near(w / h, Math.max(1, box.width / box.height), 0.01);
        const shown = stage.getBoundingClientRect();
        r.noBars = near(shown.width, box.width, 2) && near(shown.height, box.height, 2);
        r.slideFollowsTheStage = near(document.querySelector('.decklight-stage > section.active').offsetHeight, h, 1);
        r.saysItFills = /display: fills the screen/.test(toastSaid());
        r.remembered = localStorage.getItem(KEY) === 'fill' && rootEl.hasAttribute('data-display-fill');
        r.rowSaysFill = row()?.value === 'fill screen';
        // A knob switches in place: the panel is still open, on the same
        // row, and the row on screen reads the new value, so ⏎ again
        // switches back without reopening anything.
        const openRow = () => [...document.querySelectorAll(`${Q} .narr-row`)].find((n) => /Display/.test(n.textContent));
        r.staysOpen = !!document.querySelector(Q);
        r.sameRowSelected = openRow()?.classList.contains('narr-sel') === true;
        r.openRowReadsFill = /fill screen/.test(openRow()?.textContent ?? '');
        press('Enter');
        await settle(); await settle();
        r.backToTheDeckRatio = size().join('x') === '1280x720' && localStorage.getItem(KEY) === null
          && /display: 16:9/.test(toastSaid());
        r.openRowReadsTheRatio = /16:9/.test(openRow()?.textContent ?? '') && !!document.querySelector(Q);
        // a click on the knob row does the same as ⏎
        openRow().click();
        await settle(); await settle();
        r.clickSwitchesInPlace = /fill screen/.test(openRow()?.textContent ?? '') && rootEl.hasAttribute('data-display-fill');
        openRow().click();
        await settle(); await settle();
        r.clickSwitchesBack = !rootEl.hasAttribute('data-display-fill') && !!document.querySelector(Q);
        press('Escape');
        r.escapeCloses = !document.querySelector(Q);
        try { localStorage.removeItem(KEY); } catch {}
        r.PASS = Object.entries(r).every(([k, v]) => k === 'PASS' || k === 'fillSize' || v === true);
      }

      // PRESENTING: exporting to PowerPoint from inside the deck. The deck
      // cannot run Chrome, so the row asks the edit server — what this
      // asserts is the round trip: the row exists when a server does, it POSTs
      // to /deck/edit/export, and the ANSWER reaches the presenter as a message
      // naming the file (or saying why not). A row that fires and reports
      // nothing is indistinguishable from a broken one, which is the whole
      // reason the toast is part of the contract.
      // The video row asks WHICH slides before it renders anything — a range
      // from the rows, or typed; digits typed at the card land in its box. A
      // range that is not one stays in the box with its reason, and nothing is
      // posted until a real one is picked.
      if (mode === 'exportvideo') {
        const Q = '.decklight-palette', ROW = '.pal-row';
        await settle();
        // a pick the render cannot see on its own — a fresh browser (#547)
        deck.theme('eclipse');
        press('/');
        for (const ch of 'mp4') press(ch);
        r.rowIsThere = [...document.querySelectorAll(`${Q} ${ROW}`)].some((n) => /Export a video/.test(n.textContent));
        press('Enter');
        await settle();
        await settle();                       // the card waits on the tracks and the bridge
        const card = () => document.querySelector('.decklight-range .narr-card');
        const rows = () => [...document.querySelectorAll('.decklight-range .narr-row')].map((n) => n.textContent);
        r.asksWhichSlides = !!card() && /which slides/.test(card().textContent);
        r.offersRanges = rows().some((t) => /All slides/.test(t)) && rows().some((t) => /This slide/.test(t));
        // The voice row starts on what a render would have used anyway — the
        // voiceover/ folder, offers your own take as My voice one step back,
        // and ← → turn it to the live voice, which proposes a new folder
        // rather than the say one.
        // The settings sit above the ranges: ↑ reaches them from the slides, and
        // ← → turn the one under the selection.
        const settingRow = (name) => [...document.querySelectorAll('.decklight-range .range-setting')]
          .find((n) => n.querySelector('.range-setting-name')?.textContent === name)?.textContent ?? '';
        r.startsOnTheRecordedTrack = /Samantha · say — voiceover\//.test(settingRow('Voice'));
        r.ownTakeNotOffered = !/voices\/beatsonly/.test(card()?.textContent ?? '');
        r.defaultsAreMp4Standard = /MP4/.test(settingRow('Format')) && /Standard/.test(settingRow('Quality'))
          && /None/.test(settingRow('Subtitles'));
        press('ArrowRight');           // on a range row, ← → change nothing
        r.arrowsLeaveRangesAlone = /MP4/.test(settingRow('Format')) && /Samantha/.test(settingRow('Voice'));
        press('ArrowUp');              // Subtitles
        press('ArrowRight');           // → in the video
        press('ArrowUp');              // Quality
        press('ArrowUp');              // Format
        press('ArrowRight');           // → MOV
        press('ArrowUp');              // Voice
        press('ArrowLeft');            // ← your own voice, no manifest (rendered off the disk)
        r.offersMyVoice = /My voice — voices\/me\//.test(settingRow('Voice'));
        press('ArrowRight');           // → back to voiceover/
        press('ArrowRight');           // → the track voiced from older notes, offered marked (#536)
        // a machine-voiced track is re-voiced on those slides first (#553), and says so
        r.staleTrackMarked = /Daniel · say — voices\/older\/ · 2 slides from older notes, re-voiced first/.test(settingRow('Voice'));
        press('ArrowRight');           // → the live voice
        r.arrowsTurnTheSettings = /In the video/.test(settingRow('Subtitles')) && /MOV/.test(settingRow('Format'))
          && /Synthesize — en_US-ryan-high · piper → voices\/en-us-ryan-high\//.test(settingRow('Voice'));
        for (const ch of '9-99') press(ch);
        const box = () => document.querySelector('.decklight-range input');
        r.typingFillsTheBox = box()?.value === '9-99';
        const enterInBox = () => box().dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        enterInBox();
        await settle();
        r.badRangeStaysOpen = !!card() && /not a range of this deck/.test(card().textContent);
        r.nothingPostedYet = !CALLS.post.some((c) => c.u.includes('/deck/edit/export'));
        box().value = '2-3';
        enterInBox();
        // read BEFORE yielding: the stand-in server answers within one settle,
        // and its answer rewrites the very row being checked
        r.closesOnPick = !card();
        const said = () => [...document.querySelectorAll('.decklight-toast')].map((n) => n.textContent);
        r.saysWhatItRenders = said().some((t) => /voicing and rendering a video of slides 2–3/.test(t));
        window.__es.emit('export', { state: 'slide', kind: 'video', phase: 'voice', n: 1, of: 2 });
        r.saysWhereItIs = said().some((t) => /slides 2–3 — voicing slide 1 of 2/.test(t));
        window.__es.emit('export', { state: 'slide', kind: 'video', phase: 'render', n: 2, of: 2 });
        r.saysTheRenderPhase = said().some((t) => /slides 2–3 — slide 2 of 2/.test(t));
        await settle();
        await settle();
        const sent = CALLS.post.find((c) => c.u.includes('/deck/edit/export'))?.body;
        r.postsTheRange = sent?.kind === 'video' && sent.slides === '2-3' && !('narration' in sent)
          && sent.synthesize?.engine === 'piper' && sent.synthesize.model === 'en_US-ryan-high'
          && sent.synthesize.voice === 'en_US-ryan-high' && sent.synthesize.dir === 'voices/en-us-ryan-high'
          && sent.format === 'mov' && sent.quality === 'standard' && sent.subtitles === 'embed';
        r.toldTheTheme = sent?.theme === 'eclipse';
        r.remembersTheFormat = /"format":"mov"/.test(localStorage.getItem('decklight:video-export') ?? '');
        r.answered = said().some((t) => /wrote deck\.slides-2-3\.mp4/.test(t) && /its voice is in voices\/en-us-ryan-high\//.test(t));
        r.PASS = r.rowIsThere && r.asksWhichSlides && r.offersRanges && r.staleTrackMarked && r.offersMyVoice
          && r.startsOnTheRecordedTrack && r.ownTakeNotOffered && r.defaultsAreMp4Standard && r.arrowsLeaveRangesAlone
          && r.arrowsTurnTheSettings && r.remembersTheFormat && r.saysTheRenderPhase
          && r.typingFillsTheBox && r.badRangeStaysOpen && r.nothingPostedYet && r.closesOnPick
          && r.saysWhatItRenders && r.saysWhereItIs && r.postsTheRange && r.toldTheTheme && r.answered;
      }

      if (mode === 'exportpptx' || mode === 'exportfail') {
        const Q = '.decklight-palette', ROW = '.pal-row';
        await settle();                       // let /deck/ping settle: editAvailable
        press('/');
        for (const ch of 'powerpoint') press(ch);
        const rows = [...document.querySelectorAll(`${Q} ${ROW}`)].map((n) => n.textContent);
        r.rowIsThere = rows.some((t) => /Export to PowerPoint/.test(t));
        press('Enter');
        r.closesOnRun = !document.querySelector(Q);
        const said = () => [...document.querySelectorAll('.decklight-toast')].map((n) => n.textContent);
        r.saysItStarted = said().some((t) => /exporting to PowerPoint/.test(t));
        // The server narrates each slide on the SSE channel. The row already
        // on screen is REWRITTEN from it — one row that keeps telling the
        // truth, not one toast per slide burying everything else.
        const before = said().length;
        window.__es.emit('export', { state: 'slide', kind: 'pptx', n: 3, of: 5 });
        r.saysWhereItIs = said().some((t) => /slide 3 of 5/.test(t));
        r.oneRowNotMany = said().length === before;
        await settle();
        await settle();
        r.posted = CALLS.post.some((c) => c.u.includes('/deck/edit/export'));
        r.answered = mode === 'exportfail'
          ? said().some((t) => /could not export to PowerPoint — no Chrome found/.test(t))
          : said().some((t) => /wrote deck\.pptx/.test(t) && /6\.2s/.test(t));

        // The PDFs are rows too — the same door, a different file. Searched by
        // a word that is in the alias and not in the label, which is the half
        // of a row a reader never sees and nothing else checks.
        press('/');
        for (const ch of 'handout') press(ch);
        r.pdfRowIsThere = [...document.querySelectorAll(`${Q} ${ROW}`)].map((n) => n.textContent)
          .some((t) => /Export a PDF handout/.test(t));
        press('Escape');
        // told the theme on screen (#547) — aurora, the linked one
        r.toldTheTheme = CALLS.post.find((c) => c.u.includes('/deck/edit/export'))?.body.theme === 'aurora';

        let themedOk = true;
        if (mode === 'exportpptx') {
          // The bundle is a hand-over row like the others: found by what people
          // call it, posted with the theme on screen, and the file named. This
          // deck has a recorded voice, so the row first asks what the file
          // carries of it, each answer with the size the file comes out at.
          try { localStorage.removeItem('decklight:bundle-audio'); } catch { /* fine */ }
          const card = () => document.querySelector('.decklight-choice');
          const cardRows = () => [...(card()?.querySelectorAll('.narr-row') ?? [])];
          const selected = () => cardRows().find((n) => n.classList.contains('narr-sel'))?.textContent ?? '';
          const openBundle = async () => {
            if (document.querySelector(Q)) press('Escape');
            press('/');
            for (const ch of 'standalone') press(ch);
            press('Enter');
            await settle();
            await settle();
          };
          const lastPost = () => CALLS.post.filter((c) => c.u.includes('/deck/edit/export')).at(-1)?.body ?? {};
          if (document.querySelector(Q)) press('Escape');
          press('/');
          for (const ch of 'standalone') press(ch);
          r.bundleRowIsThere = [...document.querySelectorAll(`${Q} ${ROW}`)].filter((n) => /Bundle into one file/.test(n.textContent)).length === 1;
          press('Escape');
          await openBundle();
          r.estimatedInTheThemeOnScreen = CALLS.get.some((u) => u.includes('/deck/edit/export/estimate?kind=bundle&theme=aurora'));
          r.cardAsks = /and the narration audio\?/.test(card()?.textContent ?? '')
            && /12 recorded files, 10:00 of voice, 38\.1 MB in voices\/t\/ \(12\)/.test(card()?.textContent ?? '');
          const texts = cardRows().map((n) => n.textContent);
          r.eachWithItsSize = texts.length === 4
            && /Leave it beside the deck.*781 KB/.test(texts[0]) && /As recorded.*51\.3 MB/.test(texts[1])
            && /AAC, mono 32 kbps.*≈ 3\.8 MB/.test(texts[2]) && /Opus, mono 24 kbps.*needs ffmpeg with libopus/.test(texts[3]);
          r.opusShownBlocked = cardRows()[3]?.classList.contains('narr-blocked');
          r.startsOnAac = /AAC/.test(selected());
          r.nothingPostedYet = lastPost().kind !== 'bundle';
          press('ArrowDown');                       // past the blocked Opus, round to the top
          r.skipsTheBlockedRow = /Leave it beside/.test(selected());
          press('ArrowDown');
          press('Enter');
          // read BEFORE yielding: the stand-in server's answer rewrites the row
          r.saysWhatItCarries = said().some((t) => /exporting to one file, with the narration audio/.test(t));
          await settle();
          await settle();
          const original = lastPost();
          r.postsTheChoice = original.kind === 'bundle' && original.audio === 'original' && original.theme === 'aurora';
          r.bundleSaysWhereTheFileIs = said().some((t) => /wrote deck-standalone\.html/.test(t));
          await openBundle();
          r.remembersTheChoice = /As recorded/.test(selected());
          press('Escape');
          r.escPostsNothing = !card() && lastPost() === original;
          await openBundle();
          press('ArrowUp');
          press('Enter');
          await settle();
          await settle();
          r.leavingItBesidePostsNoAudio = lastPost().kind === 'bundle' && !('audio' in lastPost());
          themedOk = r.bundleRowIsThere && r.estimatedInTheThemeOnScreen && r.cardAsks && r.eachWithItsSize
            && r.opusShownBlocked && r.startsOnAac && r.nothingPostedYet && r.skipsTheBlockedRow
            && r.saysWhatItCarries && r.postsTheChoice && r.bundleSaysWhereTheFileIs && r.remembersTheChoice
            && r.escPostsNothing && r.leavingItBesidePostsNoAudio;
        }
        if (mode === 'exportfail') {
          // no recorded voice, no audio to carry: the row bundles straight
          // away, with no estimate to wait on and no card to answer
          if (document.querySelector(Q)) press('Escape');
          press('/');
          for (const ch of 'standalone') press(ch);
          press('Enter');
          await settle();
          await settle();
          r.noAudioRowWithoutAVoice = !document.querySelector('.decklight-choice')
            && !CALLS.get.some((u) => u.includes('/deck/edit/export/estimate'))
            && CALLS.post.filter((c) => c.u.includes('/deck/edit/export')).at(-1)?.body?.kind === 'bundle';
          themedOk = r.noAudioRowWithoutAVoice;
        }
        if (mode === 'exportpptx') {
          // A theme that lives only in this browser — a roll nobody saved — has
          // no name a fresh render would know, so it goes as its TOKENS, in the
          // `?gen=` form the picker's previews already load: the file comes out
          // in the theme on screen, not in the deck's own.
          if (document.querySelector(Q)) press('Escape');  // the first Esc above cleared the query
          press('t', { ctrlKey: true });   // ⌃T rolls a generated theme
          await settle();
          const posts = CALLS.post.filter((c) => c.u.includes('/deck/edit/export')).length;
          press('/');
          for (const ch of 'powerpoint') press(ch);
          press('Enter');
          await settle();
          await settle();
          const second = CALLS.post.filter((c) => c.u.includes('/deck/edit/export'));
          const body = second.at(-1)?.body ?? {};
          let rolled = null;
          try { rolled = JSON.parse(decodeURIComponent(escape(atob(body.gen.replace(/-/g, '+').replace(/_/g, '/'))))); } catch { /* reported below */ }
          r.localThemeSentAsTokens = second.length === posts + 1 && !('theme' in body)
            && /^gen-/.test(rolled?.name ?? '') && typeof rolled?.tokens?.['--bg'] === 'string';
          themedOk = themedOk && r.toldTheTheme && r.localThemeSentAsTokens;
        }

        r.PASS = r.rowIsThere && r.closesOnRun && r.saysItStarted && r.saysWhereItIs
          && r.oneRowNotMany && r.posted && r.answered && r.pdfRowIsThere && themedOk;
      }

      // One chapter of the deck (#840), what `decklight bundle --module` does,
      // from the bundle card: it lists the chapters with their slide counts
      // after the whole deck, opens on the chapter of the slide on screen (and
      // on the whole deck before the first one), sends the chapter's NUMBER,
      // sizes the audio card for that chapter, and says what the CLI says.
      if (mode === 'exportmodule') {
        const Q = '.decklight-palette';
        await settle();                       // let /deck/ping settle: editAvailable
        try { localStorage.setItem('decklight:bundle-audio', 'none'); } catch { /* fine */ }
        const card = () => document.querySelector('.decklight-choice');
        const cardRows = () => [...(card()?.querySelectorAll('.narr-row') ?? [])].map((n) => n.textContent);
        const selected = () => card()?.querySelector('.narr-row.narr-sel')?.textContent ?? '';
        const said = () => [...document.querySelectorAll('.decklight-toast')].map((n) => n.textContent);
        const lastPost = () => CALLS.post.filter((c) => c.u.includes('/deck/edit/export')).at(-1)?.body ?? {};
        const openBundle = async () => {
          if (document.querySelector(Q)) press('Escape');
          press('/');
          for (const ch of 'standalone') press(ch);
          press('Enter');
          await settle();
        };
        const total = deck.state.totalSlides;
        deck.goto(5, 0);
        await settle();
        await openBundle();
        r.asksWhatGoesIn = /the whole deck, or one module\?/.test(card()?.textContent ?? '');
        const rows = cardRows();
        // this deck is four slides: a title, two of Foundations, one of Operations
        r.listsTheChapters = total === 4 && rows.length === 3
          && rows[0] === 'Whole deckslides 1–44 slides'
          && rows[1] === 'Foundationsmodule 1 · slides 2–32 slides'
          && rows[2] === 'Operationsmodule 2 · slide 41 slide';
        r.opensOnTheChapterOnScreen = /^Operations/.test(selected());
        r.nothingAskedYet = !CALLS.get.some((u) => u.includes('/deck/edit/export/estimate'));
        press('Enter');
        await settle();
        await settle();
        r.sizesTheChapter = CALLS.get.some((u) => u.includes('/deck/edit/export/estimate?kind=bundle&theme=aurora&module=2'));
        r.audioCardNamesIt = /^bundle module 2 into one file — and the narration audio\?/.test(card()?.textContent ?? '');
        press('Enter');                       // leave it beside the deck, as last time
        r.saysWhatItBundles = said().some((t) => /exporting module 2 to one file/.test(t));
        await settle();
        await settle();
        r.postsTheNumber = lastPost().kind === 'bundle' && lastPost().module === 2 && !('audio' in lastPost());
        const done = said().find((t) => /wrote deck-operations\.html/.test(t)) ?? '';
        r.saysWhatTheCliSays = /module 2 of 2: Operations — slides 4–4 of the deck, 1–1 in the bundle/.test(done)
          && /narration audio: 1 file\(s\) stay beside the deck.*--audio/.test(done)
          && !/voice manifest/.test(done);

        // before the first chapter: the whole deck, and no module sent
        deck.goto(1, 0);
        await settle();
        await openBundle();
        r.wholeDeckBeforeTheFirst = /^Whole deck/.test(selected());
        press('Enter');
        await settle();
        await settle();
        press('Enter');
        await settle();
        await settle();
        r.wholeDeckSendsNoModule = lastPost().kind === 'bundle' && !('module' in lastPost());

        // a chapter the server will not bundle: its sentence on the card's row
        window.__refuseModule = true;
        deck.goto(2, 0);
        await settle();
        await openBundle();
        r.opensOnTheFirstChapter = /^Foundations/.test(selected());
        press('Enter');
        await settle();
        await settle();
        press('Enter');
        await settle();
        await settle();
        r.saysTheRefusal = said().some((t) => /could not export to one file — --module: no chapter "1" in this deck/.test(t));
        window.__refuseModule = false;
        r.PASS = r.asksWhatGoesIn && r.listsTheChapters && r.opensOnTheChapterOnScreen && r.nothingAskedYet
          && r.sizesTheChapter && r.audioCardNamesIt && r.saysWhatItBundles && r.postsTheNumber && r.saysWhatTheCliSays
          && r.wholeDeckBeforeTheFirst && r.wholeDeckSendsNoModule && r.opensOnTheFirstChapter && r.saysTheRefusal;
      }

      // PRESENTING: publishing from inside the deck. Everything else the
      // palette hands over writes a file beside the deck; this one puts a page
      // on the internet, and Z does not take that back — so what is asserted
      // is that the FIRST press only asks, and names the URL a person is about
      // to send somebody, and that the second one is what publishes.
      if (mode === 'publish') {
        const Q = '.decklight-palette', ROW = '.pal-row';
        await settle();                       // let /deck/ping settle: editAvailable
        const pick = () => {
          press('/');
          for (const ch of 'publish this deck') press(ch);
          const rows = [...document.querySelectorAll(`${Q} ${ROW}`)].map((n) => n.textContent);
          press('Enter');
          return rows;
        };
        const said = () => [...document.querySelectorAll('.decklight-toast')].map((n) => n.textContent);

        r.rowIsThere = pick().some((t) => /Publish this deck/.test(t));
        await settle();
        await settle();
        r.asksFirst = said().some((t) => /publish to origin gh-pages → https:\/\/acme\.github\.io\/talks\/\? — pick the row again/.test(t));
        r.askedWithAGet = CALLS.get.some((u) => u.includes('/deck/edit/publish/plan'));
        r.publishedNothingYet = !CALLS.post.some((c) => c.u.includes('/deck/edit/publish'));

        pick();
        await settle();
        await settle();
        r.secondPressPublishes = CALLS.post.some((c) => c.u.includes('/deck/edit/publish'));
        r.saysTheUrl = said().some((t) => /published — https:\/\/acme\.github\.io\/talks\//.test(t));

        r.PASS = r.rowIsThere && r.asksFirst && r.askedWithAGet && r.publishedNothingYet
          && r.secondPressPublishes && r.saysTheUrl;
      }

      // UNITS#REST: taking somebody else's slides. What matters is that the
      // panel is a CHOICE — the slides are ticked, not swallowed whole — and
      // that a slide needing a file this deck has not says so BEFORE it lands.
      // The inspector (I, PRESENTING): all about the slide, or the element
      // selected on it, docked beside the slide and following it.
      if (mode === 'inspector') {
        const P = '.decklight-inspector';
        await settle(); await settle();       // /deck/ping: editAvailable
        r.sourcesHiddenOnTheSlide = getComputedStyle(document.querySelector('aside.sources')).display === 'none';
        const facts = () => Object.fromEntries([...document.querySelectorAll(`${P} .ins-rows:first-of-type dd[data-key]`)]
          .map((dd) => [dd.dataset.key, dd]));
        const val = (k) => facts()[k]?.querySelector('.ins-value')?.textContent ?? '';
        const marked = (k, m) => !!facts()[k]?.querySelector(m === 'ok' ? '.ins-ok' : '.ins-warn');
        const title = () => document.querySelector(`${P} .ins-title`)?.textContent ?? '';
        const gutter = (side) => parseFloat(document.querySelector('.decklight').style.getPropertyValue('--dock-' + side)) || 0;

        deck.goto(1, 0);
        await settle();
        press('i');
        await settle(); await settle();
        r.opens = !!document.querySelector(P);
        r.docksRightByDefault = document.querySelector(P)?.dataset.dock === 'right' && gutter('right') > 100;
        r.titleNamesTheSlide = /slide 1 \/ 6 · One/.test(title());
        r.slideRows = ['title', 'layout', 'builds', 'notes', 'time', 'fit'].every((k) => k in facts());
        // the title row leads: the heading, with its level, and no mark
        r.titleRowLeads = [...document.querySelectorAll(`${P} .ins-rows:first-of-type dd[data-key]`)][0]?.dataset.key === 'title';
        r.titleRowNamesTheHeading = /^One/.test(val('title')) && /h[1-3]/.test(facts().title?.textContent ?? '') && !marked('title', 'warn');

        await settle();
        const viaCard = lastConceptWrite();
        r.cardDetaches = viaCard?.concept === null && viaCard.tag === 'rect' && JSON.stringify(viaCard.path) === '[2,0]' && viaCard.quiet === true;
        // in place: the three writes above changed this page's diagram; put it back for the list below
        q('.cc-group').setAttribute('data-concept', 'agent'); tools.setAttribute('data-concept', 'tools'); plain.removeAttribute('data-concept');
        // a plain shape's card is the palette it always was
        rightClick(plain);
        await settle();
        rowNamed('Colors…').click();
        await settle();
        r.plainCardUnchanged = !!q(`${C} .cp-swatch`) && !q(`${C} .cp-notice`);
        press('Escape');

        // the palette's Concept colors…: every concept, its slot, its shape count
        press('/');
        for (const ch of 'concept') press(ch);
        await settle();
        const palRows = [...document.querySelectorAll('.decklight-palette .pal-row')];
        const found = palRows.find((n) => /Concept colors…/.test(n.textContent));
        r.paletteRow = !!found;
        for (let i = 0; found && i < palRows.indexOf(found); i++) press('ArrowDown');
        press('Enter');
        await settle();
        const listRows = () => [...document.querySelectorAll(`${E} .cc-row:not(.cc-new)`)];
        r.listsEveryConcept = listRows().map((x) => x.dataset.name).join(',') === 'agent,tools'
          && /1 shape · slide 5 · fill \d by its name/.test(listRows()[0].textContent) && /1 shape · slide 5 · pinned to fill 4/.test(listRows()[1].textContent)
          && listRows()[1].querySelector('.cc-slot[data-slot="4"][aria-pressed="true"]') !== null;
        // a digit pins the selected concept: the deck repaints at once, and the write is quiet with this page named
        press('3');
        r.repaintsAtOnce = agent.style.fill === 'var(--d-fill-3)';
        await settle();
        const pinned = CALLS.post.filter((c) => c.u.includes('/deck/edit/concepts')).pop()?.body;
        r.pinPostsTheMap = JSON.stringify(pinned?.concepts) === JSON.stringify({ tools: 4, agent: 3 }) && pinned.quiet === true && typeof pinned.from === 'string' && pinned.from.length > 0;
        r.listFollows = /pinned to fill 3/.test(listRows()[0].textContent) && q(E) !== null;
        // the server refuses: the repaint goes back, the list with it
        press('6');
        r.refusedRepaintsFirst = agent.style.fill === 'var(--d-fill-6)';
        await settle(); await settle();
        r.refusedGoesBack = agent.style.fill === 'var(--d-fill-3)' && /pinned to fill 3/.test(listRows()[0].textContent);
        // 0 takes the pin off: back to the name's own slot
        press('ArrowDown'); press('0');
        await settle();
        const unpinned = CALLS.post.filter((c) => c.u.includes('/deck/edit/concepts')).pop()?.body;
        r.zeroUnpins = JSON.stringify(unpinned?.concepts) === JSON.stringify({ agent: 3 }) && /by its name/.test(listRows()[1].textContent);
        press('Escape');
        r.escapeCloses = !q(E);

        // a pin made on ANOTHER page: the event repaints here, no reload
        window.__es.emit('concepts', { concepts: { agent: 5, tools: 2 }, from: 'another-page' });
        await settle();
        r.eventRepaints = agent.style.fill === 'var(--d-fill-5)' && tools.style.fill === 'var(--d-fill-2)' && CALLS.post.filter((c) => c.u.includes('/deck/edit/concepts')).length === 3;

        r.PASS = r.paintedOnLoad && r.menuOffersConcept && r.submenu && r.detachPostsTheHolder && r.detachIsInPlace
          && r.editRowLast && r.editOpensTheList && r.editListCloses && r.plainSubmenu && r.inputRow
          && r.newNamePostsTheShape && r.fillIsANotice && r.strokeStillPicks && r.cardDetaches && r.plainCardUnchanged
          && r.paletteRow && r.listsEveryConcept && r.repaintsAtOnce && r.pinPostsTheMap && r.listFollows
          && r.refusedRepaintsFirst && r.refusedGoesBack && r.zeroUnpins && r.escapeCloses && r.eventRepaints;
      }

      if (mode === 'conceptsfind') {
        // Concepts, easy to find and to attach (SVG_DIAGRAMS): the Colors tab's
        // Concept row, the look-alikes offered after one, the list's slides and
        // its boxes, ←/→ to the slides it is on, pick mode, New concept…, and
        // Check deck… suggesting a label that recurs in two colours.
        const q = (s) => document.querySelector(s);
        const C = '.decklight-colorpicker', E = '.decklight-concepts', K = '.decklight-choice';
        const writes = () => CALLS.post.filter((c) => c.u.includes('/deck/edit/element/concepts')).map((c) => c.body);
        const rightClick = (el) => el.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 60, clientY: 60 }));
        const menuRow = (label) => [...document.querySelectorAll('.decklight-ctxmenu .cm-row')].find((x) => x.textContent === label);
        await settle();
        deck.goto(5);
        await settle();
        press('e');
        // 1 · the Colors tab offers a concept on a plain shape: no names yet, so + new
        rightClick(q('.fa1'));
        await settle();
        menuRow('Colors…').click();
        await settle();
        r.colorsTabHasConceptRow = !!q(`${C} .cp-concept-row`) && !!q(`${C} .cp-concept-row .cp-new`) && !q(`${C} .cp-concept-row .cp-on`);
        q(`${C} .cp-new`).click();
        const nameBox = q(`${C} .cp-concept-name`);
        r.newIsATextBox = !!nameBox && document.activeElement === nameBox;
        nameBox.value = 'agent';
        nameBox.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        await settle(); await settle();
        const first = writes()[0];
        r.attachWritesInPlace = first?.concept === 'agent' && first.items.length === 1 && first.items[0].slide === 5 && first.items[0].tag === 'rect' && first.quiet === true
          && q('.fa1').getAttribute('data-concept') === 'agent' && /var\(--d-fill-\d\)/.test(q('.fa1').style.fill);
        // 2 · the look-alike on slide 6 is offered: same words, other case, label beside the box
        r.lookAlikeOffered = !!q(K) && /the other “Agent” boxes/.test(q(`${K} .narr-head`)?.textContent ?? '')
          && /1 other shape on slide 6 says “Agent” too/.test(q(K).textContent);
        q(`${K} .narr-row`).click();
        await settle(); await settle();
        const second = writes()[1];
        r.lookAlikeAttached = second?.concept === 'agent' && second.items.length === 1 && second.items[0].slide === 6 && q('.fa2').getAttribute('data-concept') === 'agent';
        // the Colors tab follows: agent pressed, none offered
        r.chipPressed = q(`${C} .cp-concept-row .cp-on`)?.textContent === 'agent' && [...document.querySelectorAll(`${C} .cp-concept-chip`)].some((b) => b.textContent === 'none');
        // the Info tab names it
        q('.decklight-inspector .ins-tab[data-tab="info"]')?.click();
        await settle();
        r.infoNamesTheConcept = q('.decklight-inspector dd[data-key="concept"] .ins-value')?.textContent === 'agent';
        escapeUntilClosed('.decklight-inspector');

        // the palette row, found by what people call it
        press('/');
        for (const ch of 'colour by meaning') press(ch);
        r.paletteFindsIt = /^Concept colors…/.test(q('.decklight-palette .pal-row') ? palName(q('.decklight-palette .pal-row')) : '');
        press('Enter');
        await settle();
        // 4 · where it lives: its slides on the row, its shapes here boxed, → to the next slide it is on
        const row = () => q(`${E} .cc-row[data-name="agent"]`);
        r.rowNamesItsSlides = /2 shapes · slides 5, 6/.test(row()?.textContent ?? '');
        r.boxesItsShapesHere = document.querySelectorAll('.dl-concept-outline').length === 1;
        press('ArrowRight');
        await new Promise((ok) => setTimeout(ok, 550));
        r.arrowVisitsTheNextSlide = deck.state.slide === 6 && !!q(E) && document.querySelectorAll('.dl-concept-outline').length === 1;
        press('ArrowRight');
        await new Promise((ok) => setTimeout(ok, 550));
        r.arrowWrapsAround = deck.state.slide === 5;

        // 3 · pick mode: ⏎ on the row, a click puts a shape in, a second takes it out
        press('Enter');
        await settle();
        r.pickModeBar = q(E)?.classList.contains('cc-picking') && /picking shapes for agent/.test(q(`${E} .cc-pickbar`)?.textContent ?? '');
        q('.ft1').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
        await settle(); await settle();
        r.clickPutsItIn = writes()[2]?.concept === 'agent' && q('.ft1').getAttribute('data-concept') === 'agent' && /3 shapes/.test(q(`${E} .cc-pickbar`)?.textContent ?? '');
        q('.ft1').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
        await settle(); await settle();
        r.secondClickTakesItOut = writes()[3]?.concept === null && !q('.ft1').hasAttribute('data-concept');
        press('Escape');
        await settle();
        r.escBackToTheList = !!q(`${E} .cc-row`) && !q(E).classList.contains('cc-picking');
        // New concept…: N, a name, ⏎, and straight into picking it
        press('n');
        await settle();
        const newBox = q(`${E} .cc-new-name`);
        r.newConceptRow = !!newBox;
        newBox.value = 'tools';
        newBox.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        await settle();
        r.newConceptPicks = /picking shapes for tools/.test(q(`${E} .cc-pickbar`)?.textContent ?? '');
        press('Escape'); press('Escape');
        await settle();
        r.escapeCloses = !q(E);

        // 5 · Check deck… suggests "Other": two slides, two colours, no concept
        press('/');
        for (const ch of 'check deck') press(ch);
        press('Enter');
        await settle();
        const hint = [...document.querySelectorAll('.decklight-deckcheck .dc-row')].find((x) => x.dataset.rule === 'concept-suggestion');
        r.suggestsTheRecurringLabel = !!hint && hint.classList.contains('dc-hint')
          && /“Other” is on slides 5 and 6 in 2 colours: make it the “other” concept · ⏎ makes it/.test(hint.textContent)
          // every hint row is counted as a suggestion (a diagram with no build is a hint too)
          && new RegExp(` · ${document.querySelectorAll('.decklight-deckcheck .dc-hint').length} suggestions?$`).test(q('.decklight-deckcheck .narr-head')?.textContent ?? '');
        r.agentNoLongerSuggested = ![...document.querySelectorAll('.decklight-deckcheck .dc-row')].some((x) => /“Agent”/.test(x.textContent));
        hint.click();
        await settle(); await settle();
        const accepted = writes().at(-1);
        r.acceptingAttachesThemAll = accepted?.concept === 'other' && accepted.items.length === 2
          && q('.fo1').getAttribute('data-concept') === 'other' && q('.fo2').getAttribute('data-concept') === 'other' && !q(K);

        r.PASS = Object.values(r).every((v) => v === true);
        sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
        return;
      }

      if (mode === 'dscolors') {
        // A design system's palette on the Colors tab's Theme palette (SPEC DESIGN_SYSTEMS):
        // after the theme's groups, under its own names; a pick writes the
        // token WITH its hex now as the fallback; re-opened, the swatch is
        // marked by the token, even when the fallback has gone stale.
        const C = '.decklight-inspector';
        const q = (s) => document.querySelector(`${C} ${s}`);
        const openOn = (el) => {
          el.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 60, clientY: 60 }));
          [...document.querySelectorAll('.decklight-ctxmenu .cm-row')].find((x) => x.textContent === 'Colors…')?.click();
        };
        await settle();
        deck.goto(5);
        await settle();
        const box = document.querySelector('.cp-box');
        openOn(box);
        const groups = [...document.querySelectorAll(`${C} .cp-group`)].map((g) => g.textContent);
        r.groupsAfterTheTheme = JSON.stringify(groups.slice(-2)) === JSON.stringify(['Acme · Brand', 'Acme · Surfaces'])
          && groups.indexOf('Theme') === 0;
        const labels = [...document.querySelectorAll(`${C} .cp-swatch`)].map((b) => b.getAttribute('aria-label'));
        r.itsOwnNames = labels.includes('Acme blue (--acme-blue)') && labels.includes('Deep ink (--acme-ink)');
        r.undefinedLeftOut = !labels.some((l) => l.includes('--acme-gone'));
        q('.cp-swatch[data-token="--acme-blue"]').click();
        r.previews = box.style.fill === 'var(--acme-blue, #0056f9)' && getComputedStyle(box).fill === 'rgb(0, 86, 249)';
        await settle();
        const post = CALLS.post.find((c) => c.u.includes('/deck/edit/element/style'));
        r.writesTheFallback = post?.body.edits[0]?.value === 'var(--acme-blue, #0056f9)';
        // the file now says so, with a fallback gone stale since: still marked, by the token
        box.style.fill = 'var(--acme-blue, #123456)';
        openOn(box);
        r.markedByTheToken = q('.cp-swatch[aria-pressed="true"]')?.dataset.token === '--acme-blue';
        q('.cp-tabs [data-id="custom"]').click();
        r.customOpensOnWhatShows = q('.cp-hex').value === '#0056f9';
        press('Escape');
        // a theme pick is still the plain token
        openOn(box);
        q('.cp-swatch[data-token="--accent"]').click();
        await settle();
        r.themePickPlain = CALLS.post.filter((c) => c.u.includes('/deck/edit/element/style'))[1]?.body.edits[0]?.value === 'var(--accent)';
        r.PASS = r.groupsAfterTheTheme && r.itsOwnNames && r.undefinedLeftOut && r.previews && r.writesTheFallback
          && r.markedByTheToken && r.customOpensOnWhatShows && r.themePickPlain;
      }

      if (mode === 'contextmenu') {
        // Element edit mode (#112): E only ARMS it — right-clicking a slide
        // element is the actual surface, and the menu it opens differs by
        // WHAT was right-clicked, not by a separate keystroke.
        const M = '.decklight-ctxmenu', ROW = '.cm-row', SEL = 'cm-selected';
        const rightClick = (el) => el.dispatchEvent(new MouseEvent('contextmenu',
          { bubbles: true, cancelable: true, clientX: 40, clientY: 40 }));
        // the label, not the chord a row may carry beside it (Copy style ⌥⌘C)
        const rowsText = () => [...document.querySelectorAll(`${M} ${ROW}`)].map((x) => x.firstChild?.textContent ?? '');
        const clickRow = (label) => [...document.querySelectorAll(`${M} ${ROW}`)].find((x) => x.textContent === label)?.click();
        await settle();                        // let /deck/ping resolve

        const sections = [...document.querySelectorAll('.decklight section')];
        const h1 = sections[0].querySelector('h1');

        // editing is on from the ping; nothing opens a menu by itself
        r.armingOpensNoMenu = !document.querySelector(M);

        // right-click ON an element → the full menu
        rightClick(h1);
        r.opensOnElement = !!document.querySelector(M);
        r.fullMenuRows = JSON.stringify(rowsText())
          === JSON.stringify(['Inspect', 'Remove element', 'Edit content (HTML)', 'Colors…', 'Type…', 'Copy style', 'Add text effect ▸', 'Slide ▸']);
        const a = selectedIndex(M, ROW, SEL);
        r.hasSelection = a.i === 0;
        press('ArrowDown');
        r.downMoves = selectedIndex(M, ROW, SEL).i === 1;
        r.escapeCloses = escapeUntilClosed(M);

        // right-click the SECTION ITSELF (no descendant under the cursor) →
        // background only gets "Edit speaker notes", which is where notes
        // editing lives now that E means something else — and the ONLY place
        // the menu offers them: an element's menu is about the element
        rightClick(sections[0]);
        r.opensOnBackground = !!document.querySelector(M);
        // the background has no element to act on, so the slide itself is what is offered
        r.backgroundOnlyNotes = JSON.stringify(rowsText()) === JSON.stringify(['Edit speaker notes', 'Slide ▸']);
        press('Escape');

        // "Add text effect ▸" drills into a submenu — the 7 SPEC entrance
        // styles, 'none' (a real, instant build step), "remove effect", and a
        // back row — and committing one posts { slide, index, effect }
        rightClick(h1);
        clickRow('Add text effect ▸');
        const fx = rowsText();
        r.submenuShape = fx[0] === '← back' && fx.includes('fade-up') && fx.includes('highlight')
          && fx.includes('none (instant)') && fx.includes('remove effect') && fx.length === 10;
        clickRow('fade-up');
        await settle();
        const fxPost = CALLS.post.find((c) => c.u.includes('/deck/edit/element/effect'));
        r.postsEffect = fxPost?.body.slide === 1 && fxPost?.body.index === 0 && fxPost?.body.effect === 'fade-up';
        r.closesAfterEffect = !document.querySelector(M);

        // "Remove element" posts { slide, index }
        rightClick(h1);
        clickRow('Remove element');
        await settle();
        const rmPost = CALLS.post.find((c) => c.u.includes('/deck/edit/element/remove'));
        r.postsRemove = rmPost?.body.slide === 1 && rmPost?.body.index === 0;

        // "Edit content (HTML)" reads the element's outerHTML fresh from the
        // FILE (the fake /deck/edit/element/source above), never the live DOM, and
        // Save posts the edited value back
        rightClick(h1);
        clickRow('Edit content (HTML)');
        await settle();
        const W = '.decklight-editor';
        const ta = document.querySelector(`${W} textarea`);
        r.contentMounts = !!ta;
        r.contentLoadedFromSource = ta?.value === '<h1>One</h1>';
        ta.value = '<h1>Renamed</h1>';
        ta.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', metaKey: true, bubbles: true, cancelable: true }));
        await settle();
        const contentPost = CALLS.post.find((c) => c.u.includes('/deck/edit/element/content'));
        r.postsContent = contentPost?.body.slide === 1 && contentPost?.body.index === 0
          && contentPost?.body.html === '<h1>Renamed</h1>';
        r.escapeClosesContentEditor = escapeUntilClosed(W);

        // …and the same editor is the inspector's HTML tab: select the
        // element, open the inspector, HTML opens the editor in its slot, and
        // the editor's way back opens the inspector again
        h1.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
        await settle();
        press('i'); await settle();
        const htmlTab = document.querySelector('.decklight-inspector .ins-tab[data-tab="html"]');
        r.inspectorOffersHtml = !!htmlTab;
        htmlTab?.click(); await settle(); await settle();
        r.htmlTabOpensTheEditor = !!document.querySelector(`${W} textarea`) && !document.querySelector('.decklight-inspector');
        document.querySelector(`${W} .ed-to-inspector`)?.click(); await settle();
        r.editorGoesBackToTheInspector = !document.querySelector(W) && !!document.querySelector('.decklight-inspector');
        escapeUntilClosed('.decklight-inspector');

        // A slide with no per-element source mapping (data-markdown-removed,
        // #112's stand-in for the notes editor's markdown guard — markdown
        // slides were removed in 0.3.0, so this repo has no real fixture)
        // declines the whole menu rather than opening one that lies about
        // what it can save.
        sections[1].setAttribute('data-markdown-removed', '');
        rightClick(sections[1].querySelector('h2'));
        r.declinesOnMarkdownSlide = !document.querySelector(M);

        // backdrop click closes
        rightClick(h1);
        document.querySelector(M)?.click();
        r.backdropCloses = !document.querySelector(M);

        // locked, there is no menu on right-click
        window.__es.emit('lock', { locked: true });
        await settle();
        rightClick(h1);
        r.disarmedNoMenu = !document.querySelector(M);

        r.PASS = r.armingOpensNoMenu && r.opensOnElement && r.fullMenuRows && r.hasSelection && r.downMoves
          && r.escapeCloses && r.opensOnBackground && r.backgroundOnlyNotes
          && r.submenuShape && r.postsEffect && r.closesAfterEffect && r.postsRemove
          && r.contentMounts && r.contentLoadedFromSource && r.postsContent && r.escapeClosesContentEditor
          && r.inspectorOffersHtml && r.htmlTabOpensTheEditor && r.editorGoesBackToTheInspector
          && r.declinesOnMarkdownSlide && r.backdropCloses && r.disarmedNoMenu;
      }
    } catch (e) {
      r.exception = String((e && e.stack) || e);
      r.PASS = false;
    }
    r.mode = mode;
    sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
    })();
  </script>
</body>
</html>
