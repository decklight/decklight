<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decklight engine — overlay & keyboard-nav harness</title>
  <link rel="stylesheet" href="../dist/decklight.css">
</head>
<body>
  <!--
    The interaction the render harness can't see: the overlays (theme picker,
    command palette) and the keyboard that drives them — opening, wrap-around
    list navigation, Enter/Escape, backdrop-click-to-close, and the rule that
    only one overlay is up at a time. This is the safety net for splitting the
    overlay / theme / palette machinery out of engine.js: it exercises the
    behaviour, not just that the DOM mounts.

    Everything runs against the REAL bundled engine; only fetch is mocked, so a
    stray localhost probe (the edit server's /ping) can't leave a pending
    request that freezes Chrome's virtual clock and hangs the page.
  -->
  <div class="decklight">
    <section><h1>One</h1></section>
    <section><h2>Two</h2></section>
    <section><h2>Three</h2></section>
    <section><h2>Four</h2></section>
  </div>

  <pre id="test-sink">running…</pre>

  <script>
    // No network in a harness: answer everything fast so nothing stays pending.
    // The restore overlay (R) is the exception — it only exists when an edit
    // server does, so that mode stands one up in miniature: enough of /edit/ping
    // and /edit/history for the overlay to mount and list something real.
    const HARNESS_MODE = new URLSearchParams(location.search).get('mode') ?? 'themepicker';
    const FAKE_HISTORY = [
      { hash: 'aaaaaaa', when: '2 minutes ago', subject: 'tighten the closing slide' },
      { hash: 'bbbbbbb', when: '1 hour ago', subject: 'add the pros/cons split' },
      { hash: 'ccccccc', when: '3 days ago', subject: 'first draft' },
    ];
    // `decklight theme add` writes exactly this into a deck: the theme's own
    // CSS, marked, inert. The deck is put in LINK mode alongside it because
    // that is the combination that could go wrong — a deck whose themes come
    // from a <link> must not lose them the moment it gains an added block.
    if (HARNESS_MODE === 'added') {
      document.head.insertAdjacentHTML('beforeend',
        '<link rel="stylesheet" href="../themes/aurora.css">'
        + '<style data-theme="nord-deep" data-theme-added media="not all">'
        + '.decklight { --bg: #101018; --fg: #eeeeee; }</style>');
    }
    const json = (o) => new Response(JSON.stringify(o), { status: 200, headers: { 'content-type': 'application/json' } });
    window.fetch = async (url) => {
      const u = String(url);
      if (HARNESS_MODE === 'restore') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/history')) return json({ ok: true, entries: FAKE_HISTORY });
        if (u.includes('/edit/restore')) return json({ ok: true, changed: true, short: 'aaaaaaa', undo: 1, redo: 0 });
      }
      return new Response('', { status: 404 });
    };
    // the deck opens an EventSource once the ping succeeds; there is no server
    // behind it here, and a pending connection would hold the virtual clock
    window.EventSource = class { constructor() { this.readyState = 0; } addEventListener() {} close() {} };
  </script>

  <script src="../dist/decklight.js"></script>
  <script>
    const sink = document.getElementById('test-sink');
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') ?? 'themepicker';

    const deck = Decklight.init({});

    const press = (k, opts = {}) => document.body.dispatchEvent(
      new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...opts }));

    // index of the selected row within an overlay, by its selected-row class
    const selectedIndex = (rootSel, rowSel, selCls) => {
      const rows = [...document.querySelectorAll(`${rootSel} ${rowSel}`)];
      return { count: rows.length, i: rows.findIndex((r) => r.classList.contains(selCls)) };
    };

    // Escape backs out one level at a time (a filter, a drill-in view), so
    // "does Escape ultimately close it?" means pressing it until gone.
    const escapeUntilClosed = (sel) => {
      for (let n = 0; n < 5 && document.querySelector(sel); n++) press('Escape');
      return !document.querySelector(sel);
    };

    // The restore overlay is reached through two awaits (the ping, then the
    // history fetch), so the whole body runs async and writes the sink at the
    // end. The synchronous modes are unaffected by being awaited.
    const settle = () => new Promise((res) => setTimeout(res, 50));

    const r = {};
    (async () => {
    try {
      if (mode === 'added') {
        // `decklight theme add` put a third-party theme into a LINK-mode deck.
        // The deck must keep every theme it had, gain the new one in a pack of
        // its own, and actually apply it when picked.
        const P = '.decklight-theme-picker', ROW = '.tp-row';
        const rows = () => [...document.querySelectorAll(`${P} ${ROW}`)];
        const el = document.querySelector('style[data-theme="nord-deep"]');

        r.inertOnLoad = el.media === 'not all';   // adding a theme changes nothing until picked

        press('t');
        const packs = rows().map((x) => x.textContent);
        r.pickerOpens = packs.length > 0;
        // the deck did NOT collapse to inline mode: its own packs are still here
        r.keptItsOwnPacks = packs.filter((t) => /^▸ /.test(t)).length > 1;
        const addedRow = rows().find((x) => /▸ Added/.test(x.textContent));
        r.addedPackListed = !!addedRow;
        r.addedPackCount = addedRow?.querySelector('.tp-tag')?.textContent;

        addedRow?.click();                        // drill into the pack
        const inPack = rows().map((x) => x.textContent);
        r.listedInPack = inPack.some((t) => /nord-deep/.test(t));

        rows().find((x) => /nord-deep/.test(x.textContent))?.click();   // commit
        r.applied = el.media === 'all';
        r.picked = getComputedStyle(document.querySelector('.decklight'))
          .backgroundColor === 'rgb(16, 16, 24)';   // --bg: #101018, the added theme's

        r.PASS = r.inertOnLoad && r.pickerOpens && r.keptItsOwnPacks && r.addedPackListed
          && r.addedPackCount === '1' && r.listedInPack && r.applied && r.picked;
        sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
        return;
      }

      if (mode === 'themepicker') {
        const P = '.decklight-theme-picker', ROW = '.tp-row', SEL = 'tp-selected';
        press('t');
        r.opens = !!document.querySelector(P);
        const a = selectedIndex(P, ROW, SEL);
        r.hasRows = a.count > 2;
        r.hasSelection = a.i >= 0;

        // ArrowDown advances the selection by one (mod count)
        press('ArrowDown');
        const b = selectedIndex(P, ROW, SEL);
        r.downMoves = b.i === (a.i + 1) % a.count;

        // ArrowUp far enough to cross the top proves wrap-around: from index
        // (a.i+1), stepping up (a.i+2) times lands on the LAST row.
        for (let n = 0; n < a.i + 2; n++) press('ArrowUp');
        const c = selectedIndex(P, ROW, SEL);
        r.wrapsAround = c.i === a.count - 1;

        // Escape backs out and ultimately closes
        r.escapeCloses = escapeUntilClosed(P);

        // reopen → a click on the backdrop (the overlay element itself) closes
        press('t');
        r.reopens = !!document.querySelector(P);
        document.querySelector(P)?.click();
        r.backdropCloses = !document.querySelector(P);

        // reopen → typing filters to matching themes; Enter on one commits and
        // closes (the filter path skips the pack drill-in)
        press('t');
        for (const ch of 'aurora') press(ch);
        r.filtersToThemes = document.querySelectorAll(`${P} ${ROW}`).length > 0;
        press('Enter');
        r.enterCommitsAndCloses = !document.querySelector(P);

        r.PASS = r.opens && r.hasRows && r.hasSelection && r.downMoves && r.wrapsAround
          && r.escapeCloses && r.reopens && r.backdropCloses
          && r.filtersToThemes && r.enterCommitsAndCloses;
      }

      if (mode === 'palette') {
        const Q = '.decklight-palette', ROW = '.pal-row', SEL = 'narr-sel';
        press('/');
        r.opens = !!document.querySelector(Q);
        const a = selectedIndex(Q, ROW, SEL);
        r.hasRows = a.count > 2;
        r.hasSelection = a.i >= 0;

        press('ArrowDown');
        const b = selectedIndex(Q, ROW, SEL);
        r.downMoves = b.i === (a.i + 1) % a.count;

        // typing filters the command list down
        const before = document.querySelectorAll(`${Q} ${ROW}`).length;
        for (const ch of 'theme') press(ch);
        const after = document.querySelectorAll(`${Q} ${ROW}`).length;
        r.typingFilters = after > 0 && after < before;

        // Escape clears the query first, then closes
        r.escapeCloses = escapeUntilClosed(Q);

        r.PASS = r.opens && r.hasRows && r.hasSelection && r.downMoves
          && r.typingFilters && r.escapeCloses;
      }

      if (mode === 'exclusive') {
        // only one overlay at a time: opening the palette over the picker
        // dismisses the picker (and the finder over either, etc.)
        press('t');
        r.pickerUp = !!document.querySelector('.decklight-theme-picker');
        press('Escape');
        press('/');
        r.paletteUp = !!document.querySelector('.decklight-palette');
        r.pickerGone = !document.querySelector('.decklight-theme-picker');
        press('Escape');

        // finder (G) opens its own overlay
        press('g');
        r.finderUp = !!document.querySelector('.decklight-finder');
        press('Escape');
        r.finderGone = !document.querySelector('.decklight-finder');

        r.PASS = r.pickerUp && r.paletteUp && r.pickerGone && r.finderUp && r.finderGone;
      }
      if (mode === 'restore') {
        const O = '.decklight-restore', ROW = '.tp-row', SEL = 'tp-selected';
        await settle();                       // let /edit/ping resolve
        press('r');
        await settle();                       // let /edit/history resolve
        r.opens = !!document.querySelector(O);
        const a = selectedIndex(O, ROW, SEL);
        r.listsEveryCommit = a.count === 3;
        r.hasSelection = a.i === 0;           // newest first, newest selected

        // the subject is rendered as TEXT, never parsed as markup
        r.rowShowsSubject = /tighten the closing slide/.test(document.querySelector(`${O} ${ROW}`).textContent);

        press('ArrowDown');
        const b = selectedIndex(O, ROW, SEL);
        r.downMoves = b.i === 1;
        // wrap-around: from row 1, two ups crosses the top (1 → 0 → last)
        for (let n = 0; n < 2; n++) press('ArrowUp');
        r.wrapsAround = selectedIndex(O, ROW, SEL).i === a.count - 1;

        r.escapeCloses = escapeUntilClosed(O);

        // reopen → backdrop click closes
        press('r');
        await settle();
        r.reopens = !!document.querySelector(O);
        document.querySelector(O)?.click();
        r.backdropCloses = !document.querySelector(O);

        // Only one overlay at a time. An OPEN overlay swallows stray keys here
        // (the picker and finder behave the same way), so the contract worth
        // proving is the one the openers implement: opening restore over the
        // palette dismisses the palette. Driven through the public API, which
        // is also how a headless driver would reach it.
        press('/');
        r.paletteUp = !!document.querySelector('.decklight-palette');
        await deck.restore.open();
        await settle();
        r.restoreUp = !!document.querySelector(O);
        r.paletteGone = !document.querySelector('.decklight-palette');
        r.apiLists = deck.restore.list().length === 3;
        deck.restore.close();
        r.apiCloses = !document.querySelector(O);

        // and it is exposed for drivers that cannot press keys
        r.hasApi = typeof deck?.restore?.open === 'function'
          && typeof deck?.restore?.list === 'function';

        r.PASS = r.opens && r.listsEveryCommit && r.hasSelection && r.rowShowsSubject
          && r.downMoves && r.wrapsAround && r.escapeCloses && r.reopens
          && r.backdropCloses && r.paletteUp && r.restoreUp && r.paletteGone
          && r.hasApi && r.apiLists && r.apiCloses;
      }
    } catch (e) {
      r.exception = String((e && e.stack) || e);
      r.PASS = false;
    }
    r.mode = mode;
    sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
    })();
  </script>
</body>
</html>
