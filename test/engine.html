<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decklight engine — overlay & keyboard-nav harness</title>
  <link rel="stylesheet" href="../dist/decklight.css">
</head>
<body>
  <!--
    The interaction the render harness can't see: the overlays (theme picker,
    command palette) and the keyboard that drives them — opening, wrap-around
    list navigation, Enter/Escape, backdrop-click-to-close, and the rule that
    only one overlay is up at a time. This is the safety net for splitting the
    overlay / theme / palette machinery out of engine.js: it exercises the
    behaviour, not just that the DOM mounts.

    Everything runs against the REAL bundled engine; only fetch is mocked, so a
    stray localhost probe (the edit server's /ping) can't leave a pending
    request that freezes Chrome's virtual clock and hangs the page.
  -->
  <div class="decklight">
    <section><h1>One</h1></section>
    <section><h2>Two</h2>
      <aside class="sources">
        <dl><dt>owner</dt><dd>platform-team</dd><dt>reviewed</dt><dd>2026-08-14</dd></dl>
        <ul>
          <li><a href="https://example.invalid/kip-98">KIP-98</a> — the original proposal</li>
          <li><a href="https://example.invalid/txn">Transactions guide</a></li>
        </ul>
      </aside>
    </section>
    <section><h2>Three</h2></section>
    <section><h2>Four</h2></section>
  </div>

  <pre id="test-sink">running…</pre>

  <script>
    // No network in a harness: answer everything fast so nothing stays pending.
    // The restore overlay (R) is the exception — it only exists when an edit
    // server does, so that mode stands one up in miniature: enough of /deck/ping
    // and /deck/edit/history for the overlay to mount and list something real.
    const HARNESS_MODE = new URLSearchParams(location.search).get('mode') ?? 'themepicker';
    const FAKE_HISTORY = [
      { hash: 'aaaaaaa', when: '2 minutes ago', subject: 'tighten the closing slide' },
      { hash: 'bbbbbbb', when: '1 hour ago', subject: 'add the pros/cons split' },
      { hash: 'ccccccc', when: '3 days ago', subject: 'first draft' },
    ];
    // The two shapes an added theme reaches a page in. A theme the deck MARKS
    // is linked by the server — inert, under its marketplace — and an older
    // `theme add` pasted a block into the deck, which still has to work. The
    // deck is put in LINK mode alongside them because that is the combination
    // that could go wrong — a deck whose themes come from a <link> must not
    // lose them the moment it gains an added one.
    // The exports are told the theme on screen (#547), so they run on a deck
    // that HAS one — linked, the way a data-only deck is served.
    if (HARNESS_MODE === 'exportvideo' || HARNESS_MODE === 'exportpptx' || HARNESS_MODE === 'restore' || HARNESS_MODE === 'dslook'
        || HARNESS_MODE === 'historycaptions') {
      document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="../themes/aurora.css">');
    }
    if (HARNESS_MODE === 'added') {
      document.head.insertAdjacentHTML('beforeend',
        '<link rel="stylesheet" href="../themes/aurora.css">'
        + '<style data-theme="nord-deep" data-theme-added media="not all">'
        + '.decklight { --bg: #101018; --fg: #eeeeee; }</style>'
        + '<link rel="stylesheet" href="data:text/css,.decklight%7B--bg:%23203040;--fg:%23eeeeee%7D"'
        + ' data-theme="acme-blue" data-theme-added data-theme-marketplace="acme" data-theme-source="Acme"'
        + ' media="not all">');
    }
    // Marketplace themes in the overlay (MARKETPLACE.md THEME_BROWSE#UI) need
    // an edit server to exist at all, so `browse` stands one up in
    // miniature — enough of /deck/ping, /deck/edit/theme/browse and /deck/edit/theme/mark
    // to drive them. `nobrowse` is the same deck with NO server, which is where
    // they must be absent.
    // …and a theme the deck already MARKS, linked by the server the way
    // linkAddedThemes writes it, so unmarking and re-marking one is covered
    if (HARNESS_MODE === 'browse') {
      document.head.insertAdjacentHTML('beforeend',
        '<link rel="stylesheet" href="data:text/css,.decklight%7B--bg:%23102030%7D" data-theme="dusk" data-theme-added'
        + ' data-theme-marketplace="nord-pack" data-theme-source="Nord Pack" media="not all">');
    }
    const FAKE_BROWSE = {
      ok: true,
      cacheOnly: true,
      stale: ['decklight'],
      themes: [
        { name: 'nord-deep', marketplace: 'nord-pack', qualified: 'nord-deep@nord-pack', title: 'Nord Pack', description: 'deep blues', marked: false },
        { name: 'broken', marketplace: 'nord-pack', qualified: 'broken@nord-pack', title: 'Nord Pack', marked: false },
        { name: 'dusk', marketplace: 'nord-pack', qualified: 'dusk@nord-pack', title: 'Nord Pack', marked: true },
      ],
    };
    // The wizard (MARKETPLACE.md ENGINES#WIZARD) also needs an edit server to
    // exist, so `wizard` stands one up in miniature: a ping that advertises one
    // configurable engine, a GET that hands over a vetted schema covering every
    // renderable field type, and a POST that rejects the first answers so the
    // failure surface is exercised before the success one.
    const FAKE_WIZARD_SCHEMA = {
      engine: 'elevenlabs', title: 'ElevenLabs',
      fields: [
        { name: 'apiKey', label: 'API key', type: 'secret', required: true },
        { name: 'voice', label: 'Voice', type: 'choice', options: ['Rachel', 'Adam'], required: false },
        { name: 'cache', label: 'Cache audio', type: 'boolean', default: true, required: false },
        { name: 'note', label: 'Note', type: 'text', required: false },
      ],
      validate: '/validate',
    };
    // What cli/wizard.mjs's provenance() derives for that schema (#232) — the
    // asker in the registry's words and where the answers go. `bare@voices`
    // below deliberately arrives WITHOUT this pair, to prove the refusal.
    const FAKE_WIZARD_PROVENANCE = {
      askedBy: 'asked by elevenlabs@voices',
      sentTo: 'answers go to its own bridge on this machine (127.0.0.1:8787/validate), then ~/.decklight/credentials.json (0600)',
    };
    const CALLS = { get: [], post: [] };
    const json = (o, status = 200) => new Response(JSON.stringify(o), { status, headers: { 'content-type': 'application/json' } });
    window.fetch = async (url, init) => {
      const u = String(url);
      if (init?.method === 'POST') CALLS.post.push({ u, body: JSON.parse(init.body ?? '{}') });
      else CALLS.get.push(u);
      if (HARNESS_MODE === 'restore' || HARNESS_MODE === 'historycaptions') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/history')) return json({ ok: true, entries: FAKE_HISTORY });
        if (u.includes('/deck/edit/restore')) return json({ ok: true, changed: true, short: 'aaaaaaa', undo: 1, redo: 0 });
      }
      // The commit window (K, and its ⌘K/⌃K alias) needs an edit server for
      // editAvailable, plus the two routes it actually calls. `messages:false`
      // so no agent is asked to draft a subject — the shortcut is what is under
      // test here, not the drafting.
      // the lock route answers in every write-mode harness: the bar's Lock
      // button and the chip post to it wherever the bar is on screen
      if (u.includes('/deck/edit/lock') && init?.method === 'POST') { const b = JSON.parse(init?.body ?? '{}'); return json({ ok: true, locked: b.locked === true }); }
      // the lock (lockmode): write mode, unlocked
      if (HARNESS_MODE === 'lockmode') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [], noTrust: false, locked: false });
        if (u.includes('/deck/edit/lock')) { const b = JSON.parse(init?.body ?? '{}'); return json({ ok: true, locked: b.locked === true }); }
        if (u.includes('/deck/edit/element/source')) return json({ ok: true, html: '<h1>One</h1>' });
      }
      // no-trust mode (notrustmode): the one probe says so, and nothing edits
      if (HARNESS_MODE === 'notrustmode') {
        if (u.includes('/deck/ping')) return json({ ok: true, name: 'engine.html', noTrust: true, locked: true, phone: false, container: false });
      }
      if (HARNESS_MODE === 'commit') {
        if (u.includes('/deck/ping')) {
          return json({ ok: true, undo: 0, redo: 0, git: true, agents: [],
            commit: { dirty: true, lines: 7, sinceMs: 0, nag: false, canWrite: true, messages: false } });
        }
        // The agent's draft, held for a second so the wait can be watched.
        if (u.includes('/deck/edit/commit/subject')) {
          await new Promise((ok) => setTimeout(ok, 1500));
          return json({ ok: true, subject: 'split the crowded video slides' });
        }
        if (u.includes('/deck/edit/commit') && (init?.method ?? 'GET') === 'GET') {
          return json({ ok: true, dirty: true, lines: 7, sinceMs: 0, nag: false,
            canWrite: true, messages: window.__commitMessages === true, deck: 'engine.html',
            describer: window.__describer === undefined ? { name: 'claude', label: 'Claude Code' } : window.__describer,
            subjectsOff: window.__subjectsOff === true });
        }
        if (u.includes('/deck/edit/commit')) {
          window.__committed = JSON.parse(init?.body ?? '{}').message;
          return json({ ok: true, committed: true, subject: window.__committed,
            undo: 0, redo: 0, dirty: false, lines: 0, sinceMs: 0, nag: false, canWrite: true });
        }
      }
      // The hand-over rows (PRESENTING) are write-mode only, so this mode
      // stands up the two routes they use: a ping so editAvailable is true,
      // and the export itself. `exportfail` is the same deck with a server
      // that refuses, which is the branch that must not leave the row looking
      // like it silently did nothing.
      if (HARNESS_MODE === 'exportpptx' || HARNESS_MODE === 'exportfail' || HARNESS_MODE === 'exportvideo') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        // The video card's voices: a folder recorded by `say` (a manifest, so
        // offerable), your own take (no manifest, so not), and a piper bridge.
        if (HARNESS_MODE === 'exportvideo' && u.includes('/deck/edit/narration/tracks')) {
          return json({ ok: true, tracks: [
            { dir: 'voices/me', files: 3, segments: false, ext: 'wav', engine: null, voice: null, manifest: false },
            { dir: 'voiceover', files: 2, segments: false, ext: 'm4a', engine: 'say', voice: 'Samantha', manifest: true, stale: 0 },
            // voiced from notes the deck no longer has on two slides (#536): offered, marked
            { dir: 'voices/older', files: 4, segments: false, ext: 'm4a', engine: 'say', voice: 'Daniel', manifest: true, stale: 2 },
          ] });
        }
        if (HARNESS_MODE === 'exportvideo' && u.endsWith('/ping')) {
          return json({ ok: true, engine: 'piper', model: 'en_US-ryan-high', stylable: false, voices: [['en_US-ryan-high', 'local']] });
        }
        // the bundle card's figures: 12 files, ten minutes of voice; this
        // machine's ffmpeg has AAC and no Opus, so Opus is shown blocked
        if (u.includes('/deck/edit/export/estimate')) {
          return json({ ok: true, base: 800000, audio: {
            files: 12, bytes: 40e6, seconds: 600, folders: 'voices/t/ (12)',
            original: 53e6, aac: 3.2e6, opus: null, why: { opus: 'needs ffmpeg with libopus' } } });
        }
        if (u.includes('/deck/edit/export')) {
          const kind = JSON.parse(init?.body ?? '{}').kind;
          return HARNESS_MODE === 'exportfail'
            ? json({ ok: false, error: 'no Chrome found — install one, or point $CHROME at it' }, 503)
            : json({ ok: true, kind, file: kind === 'pptx' ? 'deck.pptx' : kind === 'video' ? 'deck.slides-2-3.mp4'
              : kind === 'bundle' ? 'deck-standalone.html' : 'deck.handout.pdf', seconds: 6.2,
              ...(kind === 'video' ? { voiced: 'voices/en-us-ryan-high' } : {}) });
        }
      }
      // The agent card's log (A, docked): the server keeps the session's asks
      // and /deck/ping hands them back, so a reload still shows them.
      if (HARNESS_MODE === 'agentlog') {
        if (u.includes('/deck/ping')) {
          return json({ ok: true, undo: 0, redo: 0, git: true, agents: [{ name: 'claude', label: 'Claude Code' }],
            agentAsks: [{ id: 1, agent: 'claude', prompt: 'make the title shorter', slide: 1, startedAt: Date.now() - 60000,
              state: 'done', ok: true, changed: true, tail: 'Shortened the title.' }] });
        }
        if (u.includes('/deck/edit/agent')) return json({ ok: true, agent: 'claude', label: 'Claude Code' });
      }
      // Design systems… (SPEC DESIGN_SYSTEMS): the edit server lists what the
      // registered marketplaces offer and what the deck uses; marking toggles it
      if (HARNESS_MODE === 'designsystems') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/design-system/browse')) {
          return json({ ok: true, cacheOnly: true, unfetched: ['decklight'], stale: ['old-mkt'], systems: [
            { name: 'acme', marketplace: 'acme-mkt', qualified: 'acme@acme-mkt', group: 'Acme', version: '1.2.0', description: 'Acme Brand', used: false },
            { name: 'globex', marketplace: 'acme-mkt', qualified: 'globex@acme-mkt', group: 'Acme', version: '2.0.0', description: 'Globex', used: true },
            { name: 'future', marketplace: 'acme-mkt', qualified: 'future@acme-mkt', group: 'Acme', missing: 'future@acme-mkt needs a newer decklight', used: false },
          ] });
        }
        if (u.includes('/deck/edit/design-system/mark')) {
          const body = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, ref: body.ref, used: body.used, changed: true, undo: 1, redo: 0 });
        }
      }
      // Enhance the voiceover script (cli/enhance.mjs): the route answers how many
      // slides it will ask about; the rest arrives as 'enhance' events.
      if (HARNESS_MODE === 'enhance') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [{ name: 'claude', label: 'Claude Code' }] });
        if (u.includes('/deck/edit/enhance/text')) {
          const { text } = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, changed: true, text: `[warm] ${text}`, agent: 'claude', label: 'Claude Code' });
        }
        if (u.includes('/deck/edit/enhance')) {
          const body = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, of: body.slides === 'all' ? 3 : 1, agent: 'claude', label: 'Claude Code' });
        }
      }
      // S opens the notes editor, which needs an edit server behind it
      if (HARNESS_MODE === 'skeys' && !new URLSearchParams(location.search).has('nosrv') && u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
      // The Publish row (PRESENTING) is the one that reaches off the machine,
      // so it is two presses: the plan, shown, then the push. Both routes are
      // stood up here — and the plan is a GET on purpose, which is half of
      // what the assertions check.
      if (HARNESS_MODE === 'publish') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        // the longer path first: /deck/edit/publish is a prefix of /deck/edit/publish/plan
        if (u.includes('/deck/edit/publish/plan')) {
          return json({ ok: true, remote: 'origin', branch: 'gh-pages', bundled: false,
            url: 'https://acme.github.io/talks/', signing: true, why: null });
        }
        if (u.includes('/deck/edit/publish')) {
          return json({ ok: true, remote: 'origin', branch: 'gh-pages', commit: 'abc1234',
            url: 'https://acme.github.io/talks/' });
        }
      }
      // Insert-from-a-template (UNITS#REST): three routes, and the second one
      // is the interesting shape — a template read as a list of slides, each
      // saying what it points at that THIS deck will not have.
      if (HARNESS_MODE === 'sourcesedit') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/slide/sources')) {
          const b = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, changed: true, undo: 1, redo: 0,
            dropped: b.links.filter((l) => /^javascript:/i.test(l.href ?? '')).map((l) => l.href) });
        }
      }
      if (HARNESS_MODE.startsWith('template')) {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/template/browse')) {
          return json({ ok: true, cacheOnly: true, stale: [],
            installed: ['startup-pitch'],
            offered: [{ name: 'quarterly', qualified: 'quarterly@acme', marketplace: 'acme', description: 'a review deck' }] });
        }
        if (u.includes('/deck/edit/template/slides')) {
          return json({ ok: true, name: 'startup-pitch', slides: [
            { n: 1, title: 'Startup pitch', hidden: false, needs: [], clashes: [] },
            { n: 2, title: 'Pricing', hidden: false, needs: ['assets/table.png'], clashes: [] },
            { n: 3, title: 'Backup', hidden: true, needs: [], clashes: ['.breaks'] },
          ] });
        }
        if (u.includes('/deck/edit/template/apply')) {
          const b = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, to: b.to, from: b.slide, name: 'startup-pitch', fromTitle: 'Pricing',
            applied: { 'data-layout': 'split', class: 'tinted' }, replaced: { 'data-layout': 'centered' },
            undo: 1, redo: 0, styles: { carried: ['.tinted'], clashed: [], dangling: [] } });
        }
        if (u.includes('/deck/edit/template/insert')) {
          const body = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, inserted: body.slides.length, after: body.after, name: 'startup-pitch',
            titles: ['Pricing'], needs: ['assets/table.png'], undo: 1, redo: 0,
            styles: { carried: ['.pricing'], clashed: ['.breaks'], dangling: ['--card-bg'] } });
        }
      }
      if (HARNESS_MODE === 'browse') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/theme/browse')) return json(FAKE_BROWSE);
        if (u.includes('/deck/edit/theme/mark')) {
          const { ref, marked } = JSON.parse(init?.body ?? '{}');
          // The refusal is `theme add`'s own, verbatim — the picker is not
          // allowed to have a laxer opinion than the command line.
          return ref === 'broken@nord-pack'
            ? json({ error: 'broken fails the theme contract', problems: ['--fg is not defined'] }, 400)
            : json({ ok: true, ref, marked, changed: true, undo: 1 });
        }
      }
      // Element edit mode (E, then right-click a slide element — #112) needs
      // an edit server to exist at all, same as every other write-mode
      // feature here: enough of /deck/ping for editAvailable, plus the four
      // /deck/edit/element/* routes the menu's actions actually call.
      // Mouse editing (authoring.js): a double-click saves through the SOURCE
      // of the element and the content route, and the slide operations are one
      // POST each answering with the slide to land on.
      // the overview rearranging slides (overviewedit): the slide route, answering where to land
      if (HARNESS_MODE === 'overviewedit') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/slide')) {
          const b = JSON.parse(init?.body ?? '{}');
          return json({ ok: true, slide: b.op === 'move' ? b.to : b.op === 'delete' ? b.slide : b.slide + 1, total: 5, undo: 1, redo: 0 });
        }
      }
      // `editbar` is the same server, driven from the bar and the selection
      if (HARNESS_MODE === 'authoring' || HARNESS_MODE === 'emphasis' || HARNESS_MODE === 'editbar' || HARNESS_MODE === 'palettegroups' || HARNESS_MODE === 'editingtour' || HARNESS_MODE === 'editingtourwelcome') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/element/source')) return json({ ok: true, html: '<h1>One</h1>' });
        if (u.includes('/deck/edit/element/remove')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
        if (u.includes('/deck/edit/slide/layout')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
        // Slow on purpose: a real save reads the source, then writes. Undo must
        // queue behind a write still in flight, and these markers say when each
        // one actually landed.
        if (u.includes('/deck/edit/element/content')) {
          await new Promise((ok) => setTimeout(ok, 250));
          CALLS.post.push({ u: 'LANDED element content', body: {} });
          return json({ ok: true, changed: true, undo: 1, redo: 0 });
        }
        if (u.includes('/deck/edit/slide')) {
          const b = JSON.parse(init?.body ?? '{}');
          await new Promise((ok) => setTimeout(ok, 250));
          CALLS.post.push({ u: 'LANDED slide op', body: {} });
          return json({ ok: true, slide: b.op === 'delete' ? b.slide : b.slide + 1, total: 5, undo: 1, redo: 0 });
        }
        if (u.includes('/deck/edit/undo')) return json({ ok: true, undo: 0, redo: 1 });
        if (u.includes('/deck/edit/redo')) return json({ ok: true, undo: 1, redo: 0 });
      }
      if (HARNESS_MODE === 'editor') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        // a long element: eighty lines, one of them four hundred characters —
        // the shape whose painted layer fell out of step with the textarea (#529)
        if (u.includes('/deck/edit/element/source')) {
          const lines = [];
          for (let i = 1; i <= 80; i++) lines.push(i === 7 ? `<text x="1" y="1">${'lorem ipsum '.repeat(34)}</text>` : `<rect x="${i}" y="${i}" width="10" height="10"/>`);
          return json({ ok: true, html: `<g>\n${lines.join('\n')}\n</g>` });
        }
        if (u.includes('/deck/edit/element/content')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
      }
      // ⌘⏎ saves the notes card from anywhere (#646): an edit server whose
      // notes route answers `changed` — false when the box matches the file
      // the card back open after a save's reload (#646): a slow save, so the
      // "saving…" mark can be seen, and the same no-op answer as notessave
      if (HARNESS_MODE === 'notesreopen' || HARNESS_MODE === 'notesreopenstale') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/slide/notes')) {
          const text = JSON.parse(init?.body ?? '{}').text;
          await new Promise((ok) => setTimeout(ok, 300));
          return json({ ok: true, changed: text !== 'Same as the file.', undo: 1, redo: 0 });
        }
      }
      // notes saved IN PLACE: no reload; every page is sent the new notes
      if (HARNESS_MODE === 'notesinplace' || HARNESS_MODE === 'notesauto') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/slide/notes')) return json({ ok: true, changed: true, inPlace: true, undo: 1, redo: 0 });
      }
      // a save that fails: the drawer must keep what was typed rather than close on it
      if (HARNESS_MODE === 'notesautofail') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/slide/notes')) return json({ ok: false, error: 'disk full' }, 500);
      }
      if (HARNESS_MODE === 'notessave') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/slide/notes')) {
          const text = JSON.parse(init?.body ?? '{}').text;
          return json({ ok: true, changed: text !== 'Same as the file.', undo: 1, redo: 0 });
        }
      }
      if (HARNESS_MODE === 'typingdock') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true,
          agents: [{ name: 'claude', label: 'Claude Code', installed: true }] });
        if (u.includes('/deck/edit/slide/notes')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
      }
      if (HARNESS_MODE === 'codeedit') {
        if (u.includes('/deck/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/deck/edit/element/source')) {

      // PRESENTING: publishing from inside the deck. Everything else the

        await settle();                       // /deck/ping: editAvailable

        const fx = rowsText();
        r.submenuShape = fx[0] === '← back' && fx.includes('fade-up') && fx.includes('highlight')
          && fx.includes('none (instant)') && fx.includes('remove effect') && fx.length === 10;
        clickRow('fade-up');
        await settle();
        const fxPost = CALLS.post.find((c) => c.u.includes('/deck/edit/element/effect'));
        r.postsEffect = fxPost?.body.slide === 1 && fxPost?.body.index === 0 && fxPost?.body.effect === 'fade-up';
        r.closesAfterEffect = !document.querySelector(M);

        // "Remove element" posts { slide, index }
        rightClick(h1);
        clickRow('Remove element');
        await settle();
        const rmPost = CALLS.post.find((c) => c.u.includes('/deck/edit/element/remove'));
        r.postsRemove = rmPost?.body.slide === 1 && rmPost?.body.index === 0;

        // "Edit content (HTML)" reads the element's outerHTML fresh from the
        // FILE (the fake /deck/edit/element/source above), never the live DOM, and
        // Save posts the edited value back
        rightClick(h1);
        clickRow('Edit content (HTML)');
        await settle();
        const W = '.decklight-editor';
        const ta = document.querySelector(`${W} textarea`);
        r.contentMounts = !!ta;
        r.contentLoadedFromSource = ta?.value === '<h1>One</h1>';
        ta.value = '<h1>Renamed</h1>';
        ta.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', metaKey: true, bubbles: true, cancelable: true }));
        await settle();
        const contentPost = CALLS.post.find((c) => c.u.includes('/deck/edit/element/content'));
        r.postsContent = contentPost?.body.slide === 1 && contentPost?.body.index === 0
          && contentPost?.body.html === '<h1>Renamed</h1>';
        r.escapeClosesContentEditor = escapeUntilClosed(W);

        // A slide with no per-element source mapping (data-markdown-removed,
        // #112's stand-in for the notes editor's markdown guard — markdown
        // slides were removed in 0.3.0, so this repo has no real fixture)
        // declines the whole menu rather than opening one that lies about
        // what it can save.
        sections[1].setAttribute('data-markdown-removed', '');
        rightClick(sections[1].querySelector('h2'));
        r.declinesOnMarkdownSlide = !document.querySelector(M);

        // backdrop click closes
        rightClick(h1);
        document.querySelector(M)?.click();
        r.backdropCloses = !document.querySelector(M);

        // locked, there is no menu on right-click
        window.__es.emit('lock', { locked: true });
        await settle();
        rightClick(h1);
        r.disarmedNoMenu = !document.querySelector(M);

        r.PASS = r.armingOpensNoMenu && r.opensOnElement && r.fullMenuRows && r.hasSelection && r.downMoves
          && r.escapeCloses && r.opensOnBackground && r.backgroundOnlyNotes
          && r.submenuShape && r.postsEffect && r.closesAfterEffect && r.postsRemove
          && r.contentMounts && r.contentLoadedFromSource && r.postsContent && r.escapeClosesContentEditor
          && r.declinesOnMarkdownSlide && r.backdropCloses && r.disarmedNoMenu;
      }
    } catch (e) {
      r.exception = String((e && e.stack) || e);
      r.PASS = false;
    }
    r.mode = mode;
    sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
    })();
  </script>
</body>
</html>
