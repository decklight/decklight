<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decklight engine — overlay & keyboard-nav harness</title>
  <link rel="stylesheet" href="../dist/decklight.css">
</head>
<body>
  <!--
    The interaction the render harness can't see: the overlays (theme picker,
    command palette) and the keyboard that drives them — opening, wrap-around
    list navigation, Enter/Escape, backdrop-click-to-close, and the rule that
    only one overlay is up at a time. This is the safety net for splitting the
    overlay / theme / palette machinery out of engine.js: it exercises the
    behaviour, not just that the DOM mounts.

    Everything runs against the REAL bundled engine; only fetch is mocked, so a
    stray localhost probe (the edit server's /ping) can't leave a pending
    request that freezes Chrome's virtual clock and hangs the page.
  -->
  <div class="decklight">
    <section><h1>One</h1></section>
    <section><h2>Two</h2></section>
    <section><h2>Three</h2></section>
    <section><h2>Four</h2></section>
  </div>

  <pre id="test-sink">running…</pre>

  <script>
    // No network in a harness: answer everything fast so nothing stays pending.
    // The restore overlay (R) is the exception — it only exists when an edit
    // server does, so that mode stands one up in miniature: enough of /edit/ping
    // and /edit/history for the overlay to mount and list something real.
    const HARNESS_MODE = new URLSearchParams(location.search).get('mode') ?? 'themepicker';
    const FAKE_HISTORY = [
      { hash: 'aaaaaaa', when: '2 minutes ago', subject: 'tighten the closing slide' },
      { hash: 'bbbbbbb', when: '1 hour ago', subject: 'add the pros/cons split' },
      { hash: 'ccccccc', when: '3 days ago', subject: 'first draft' },
    ];
    // `decklight theme add` writes exactly this into a deck: the theme's own
    // CSS, marked, inert. The deck is put in LINK mode alongside it because
    // that is the combination that could go wrong — a deck whose themes come
    // from a <link> must not lose them the moment it gains an added block.
    if (HARNESS_MODE === 'added') {
      document.head.insertAdjacentHTML('beforeend',
        '<link rel="stylesheet" href="../themes/aurora.css">'
        + '<style data-theme="nord-deep" data-theme-added media="not all">'
        + '.decklight { --bg: #101018; --fg: #eeeeee; }</style>');
    }
    // Browse (MARKETPLACE.md THEME_BROWSE#UI) needs an author server to exist
    // at all, so `browse` stands one up in miniature — enough of /edit/ping,
    // /edit/theme/browse and /edit/theme/add to drive the whole pane. `nobrowse`
    // is the same deck with NO server, which is where the entry must be absent.
    const FAKE_BROWSE = {
      ok: true,
      cacheOnly: true,
      stale: ['decklight'],
      themes: [
        { name: 'nord-deep', marketplace: 'nord-pack', qualified: 'nord-deep@nord-pack', description: 'deep blues' },
        { name: 'broken', marketplace: 'nord-pack', qualified: 'broken@nord-pack' },
      ],
    };
    // The wizard (MARKETPLACE.md ENGINES#WIZARD) also needs an author server to
    // exist, so `wizard` stands one up in miniature: a ping that advertises one
    // configurable engine, a GET that hands over a vetted schema covering every
    // renderable field type, and a POST that rejects the first answers so the
    // failure surface is exercised before the success one.
    const FAKE_WIZARD_SCHEMA = {
      engine: 'elevenlabs', title: 'ElevenLabs',
      fields: [
        { name: 'apiKey', label: 'API key', type: 'secret', required: true },
        { name: 'voice', label: 'Voice', type: 'choice', options: ['Rachel', 'Adam'], required: false },
        { name: 'cache', label: 'Cache audio', type: 'boolean', default: true, required: false },
        { name: 'note', label: 'Note', type: 'text', required: false },
      ],
      validate: '/validate',
    };
    // What cli/wizard.mjs's provenance() derives for that schema (#232) — the
    // asker in the registry's words and where the answers go. `bare@voices`
    // below deliberately arrives WITHOUT this pair, to prove the refusal.
    const FAKE_WIZARD_PROVENANCE = {
      askedBy: 'asked by elevenlabs@voices',
      sentTo: 'answers go to its own bridge on this machine (127.0.0.1:8787/validate), then ~/.decklight/credentials.json (0600)',
    };
    const CALLS = { get: [], post: [] };
    const json = (o, status = 200) => new Response(JSON.stringify(o), { status, headers: { 'content-type': 'application/json' } });
    window.fetch = async (url, init) => {
      const u = String(url);
      if (init?.method === 'POST') CALLS.post.push({ u, body: JSON.parse(init.body ?? '{}') });
      else CALLS.get.push(u);
      if (HARNESS_MODE === 'restore') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/history')) return json({ ok: true, entries: FAKE_HISTORY });
        if (u.includes('/edit/restore')) return json({ ok: true, changed: true, short: 'aaaaaaa', undo: 1, redo: 0 });
      }
      // The commit window (K, and its ⌘K/⌃K alias) needs an author server for
      // editAvailable, plus the two routes it actually calls. `messages:false`
      // so no agent is asked to draft a subject — the shortcut is what is under
      // test here, not the drafting.
      if (HARNESS_MODE === 'commit') {
        if (u.includes('/edit/ping')) {
          return json({ ok: true, undo: 0, redo: 0, git: true, agents: [],
            commit: { dirty: true, lines: 7, sinceMs: 0, nag: false, canWrite: true, messages: false } });
        }
        if (u.includes('/edit/commit') && (init?.method ?? 'GET') === 'GET') {
          return json({ ok: true, dirty: true, lines: 7, sinceMs: 0, nag: false,
            canWrite: true, messages: false, deck: 'engine.html' });
        }
        if (u.includes('/edit/commit')) {
          window.__committed = JSON.parse(init?.body ?? '{}').message;
          return json({ ok: true, committed: true, subject: window.__committed,
            undo: 0, redo: 0, dirty: false, lines: 0, sinceMs: 0, nag: false, canWrite: true });
        }
      }
      if (HARNESS_MODE === 'browse') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/theme/browse')) return json(FAKE_BROWSE);
        if (u.includes('/edit/theme/add')) {
          const ref = JSON.parse(init?.body ?? '{}').ref;
          // The refusal is `theme add`'s own, verbatim — the picker is not
          // allowed to have a laxer opinion than the command line.
          return ref === 'broken@nord-pack'
            ? json({ error: 'broken fails the theme contract', problems: ['--fg is not defined'] }, 400)
            : json({ ok: true, name: 'nord-deep', from: ref, replaced: false, undo: 1 });
        }
      }
      // Element edit mode (E, then right-click a slide element — #112) needs
      // an author server to exist at all, same as every other author-mode
      // feature here: enough of /edit/ping for editAvailable, plus the four
      // /edit/element/* routes the menu's actions actually call.
      if (HARNESS_MODE === 'contextmenu') {
        if (u.includes('/edit/ping')) return json({ ok: true, undo: 0, redo: 0, git: true, agents: [] });
        if (u.includes('/edit/element/source')) return json({ ok: true, html: '<h1>One</h1>' });
        if (u.includes('/edit/element/remove')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
        if (u.includes('/edit/element/content')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
        if (u.includes('/edit/element/effect')) return json({ ok: true, changed: true, undo: 1, redo: 0 });
      }
      if (HARNESS_MODE === 'wizard') {
        if (u.includes('/edit/ping')) {
          return json({ ok: true, undo: 0, redo: 0, git: true, agents: [],
            wizards: [{ name: 'elevenlabs', qualified: 'elevenlabs@voices', title: 'ElevenLabs' }] });
        }
        if (u.includes('/edit/wizard')) {
          if (init?.method !== 'POST') {
            // an old or hostile server that hands over a schema with no
            // provenance — the player must refuse to prompt with it (#232)
            if (u.includes('bare')) return json({ ok: true, schema: FAKE_WIZARD_SCHEMA });
            return json({ ok: true, schema: FAKE_WIZARD_SCHEMA,
              from: 'elevenlabs@voices', provenance: FAKE_WIZARD_PROVENANCE });
          }
          // first answers rejected (the wrong-key path), second accepted
          return CALLS.post.filter((c) => c.u.includes('/edit/wizard')).length <= 1
            ? json({ ok: false, state: 'rejected', error: 'that key did not authenticate' }, 400)
            : json({ ok: true, state: 'configured', stored: { apiKey: 'set (13 chars)', voice: 'Rachel', cache: true } });
        }
      }
      return new Response('', { status: 404 });
    };
    // the deck opens an EventSource once the ping succeeds; there is no server
    // behind it here, and a pending connection would hold the virtual clock
    window.EventSource = class { constructor() { this.readyState = 0; } addEventListener() {} close() {} };
  </script>

  <script src="../dist/decklight.js"></script>
  <script>
    const sink = document.getElementById('test-sink');
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') ?? 'themepicker';

    // This harness drives overlays and keys, not onboarding: mark the welcome
    // seen so the card never intercepts the first keystroke below (SPEC
    // PRESENTING), and tips off so no toast lands in the middle of a dump.
    try {
      localStorage.setItem('decklight-onboarded', '1');
      localStorage.setItem('decklight-tips-off', '1');
    } catch { /* ignore */ }

    const deck = Decklight.init({});

    const press = (k, opts = {}) => document.body.dispatchEvent(
      new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...opts }));

    // index of the selected row within an overlay, by its selected-row class
    const selectedIndex = (rootSel, rowSel, selCls) => {
      const rows = [...document.querySelectorAll(`${rootSel} ${rowSel}`)];
      return { count: rows.length, i: rows.findIndex((r) => r.classList.contains(selCls)) };
    };

    // Escape backs out one level at a time (a filter, a drill-in view), so
    // "does Escape ultimately close it?" means pressing it until gone.
    const escapeUntilClosed = (sel) => {
      for (let n = 0; n < 5 && document.querySelector(sel); n++) press('Escape');
      return !document.querySelector(sel);
    };

    // The restore overlay is reached through two awaits (the ping, then the
    // history fetch), so the whole body runs async and writes the sink at the
    // end. The synchronous modes are unaffected by being awaited.
    const settle = () => new Promise((res) => setTimeout(res, 50));

    const r = {};
    // A screenshot driver (shots/*.mjs, via tools/shot.mjs --drive) wants the
    // mocked bridge below with NOTHING else racing it — no automated sequence
    // fighting the driver's own keypresses and clicks for the same overlay.
    if (params.has('shot')) { sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify({ shot: true }); }
    else (async () => {
    try {
      if (mode === 'added') {
        // `decklight theme add` put a third-party theme into a LINK-mode deck.
        // The deck must keep every theme it had, gain the new one in a pack of
        // its own, and actually apply it when picked.
        const P = '.decklight-theme-picker', ROW = '.tp-row';
        const rows = () => [...document.querySelectorAll(`${P} ${ROW}`)];
        const el = document.querySelector('style[data-theme="nord-deep"]');

        r.inertOnLoad = el.media === 'not all';   // adding a theme changes nothing until picked

        press('t');
        const packs = rows().map((x) => x.textContent);
        r.pickerOpens = packs.length > 0;
        // the deck did NOT collapse to inline mode: its own packs are still here
        r.keptItsOwnPacks = packs.filter((t) => /^▸ /.test(t)).length > 1;
        const addedRow = rows().find((x) => /▸ Added/.test(x.textContent));
        r.addedPackListed = !!addedRow;
        r.addedPackCount = addedRow?.querySelector('.tp-tag')?.textContent;

        addedRow?.click();                        // drill into the pack
        const inPack = rows().map((x) => x.textContent);
        r.listedInPack = inPack.some((t) => /nord-deep/.test(t));

        rows().find((x) => /nord-deep/.test(x.textContent))?.click();   // commit
        r.applied = el.media === 'all';
        r.picked = getComputedStyle(document.querySelector('.decklight'))
          .backgroundColor === 'rgb(16, 16, 24)';   // --bg: #101018, the added theme's

        r.PASS = r.inertOnLoad && r.pickerOpens && r.keptItsOwnPacks && r.addedPackListed
          && r.addedPackCount === '1' && r.listedInPack && r.applied && r.picked;
        sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
        return;
      }

      if (mode === 'browse' || mode === 'nobrowse') {
        // Browse in the theme picker (MARKETPLACE.md THEME_BROWSE#UI). Both
        // modes run the same deck; the only difference is whether an author
        // server answered the ping.
        const P = '.decklight-theme-picker', ROW = '.tp-row';
        const rows = () => [...document.querySelectorAll(`${P} ${ROW}`)];
        const find = (re) => rows().find((x) => re.test(x.textContent));
        const note = () => document.querySelector(`${P} .tp-none`)?.textContent ?? '';
        const caption = () => document.querySelector(`${P} .tp-caption`)?.textContent ?? '';
        await settle();                       // let /edit/ping settle either way

        // the palette's contextual route to the same view
        const palRow = () => [...document.querySelectorAll('.decklight-palette .pal-row')]
          .find((x) => /Browse marketplace/.test(x.textContent));
        press('/');
        r.paletteRow = !!palRow();

        if (mode === 'nobrowse') {
          // ENGINES#WIZARD rides the same absence: no author server means no
          // Configure row — a credential prompt with nowhere to post is a
          // phishing form with a deck around it…
          r.noConfigureRow = ![...document.querySelectorAll('.decklight-palette .pal-row')]
            .some((x) => /Configure/.test(x.textContent));
          escapeUntilClosed('.decklight-palette');
          // …and the programmatic door refuses before building a single input
          await deck.wizard('elevenlabs');
          r.wizardRefusesWithoutServer = !document.querySelector('.decklight-editor');
          press('t');
          r.pickerOpens = rows().length > 0;
          // ABSENT, not disabled: there is no server to install through, and a
          // presented deck must not reach the network for a theme at all.
          r.absentInPacks = !find(/Browse/);
          find(/all themes/)?.click();        // …and absent from the flat view too
          r.absentInAll = !find(/Browse/);
          r.stillHasThemes = rows().length > 2;
          r.PASS = r.pickerOpens && !r.paletteRow && r.absentInPacks && r.absentInAll && r.stillHasThemes
            && r.noConfigureRow && r.wizardRefusesWithoutServer;
          sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
          return;
        }

        // Browse is a VIEW of the picker, so the palette route must land in the
        // picker rather than opening a dialog of its own.
        palRow().click();
        await settle();
        r.paletteRouteOpensThePicker = !!document.querySelector(P)
          && rows().some((x) => /nord-deep/.test(x.textContent));
        escapeUntilClosed(P);

        press('t');
        r.pickerOpens = rows().length > 0;
        const browseRow = find(/Browse/);
        r.browseListed = !!browseRow;
        browseRow.click();
        await settle();                       // let /edit/theme/browse settle
        const listed = rows().map((x) => x.textContent);
        r.listsMarketplaceThemes = listed.some((t) => /nord-deep/.test(t)) && listed.some((t) => /broken/.test(t));
        r.tagsTheMarketplace = !!find(/nord-deep/).querySelector('.tp-tag');
        // offline honesty: an empty-looking list must never hide a catalog that
        // could not be read, and listing itself never went to the network
        r.namesUnfetchedCatalogs = /never fetched: decklight/.test(note());
        r.saysItIsCached = /cache/.test(note());
        r.listingWasAGet = CALLS.get.some((u) => u.includes('/edit/theme/browse'))
          && !CALLS.post.some((c) => c.u.includes('/edit/theme/browse'));
        find(/nord-deep/).dispatchEvent(new MouseEvent('mouseenter'));
        r.captionDescribes = /deep blues/.test(caption());

        // a theme the command line would refuse is refused here, and the picker
        // stays up saying why rather than closing on a failure
        find(/broken/).click();
        await settle();
        r.refusalKeepsPickerOpen = !!document.querySelector(P);
        r.refusalNamesProblems = /--fg is not defined/.test(caption());

        // and the install that works goes out as `theme add`'s own qualified ref
        find(/nord-deep/).click();
        await settle();
        const add = CALLS.post.filter((c) => c.u.includes('/edit/theme/add'));
        r.installsByQualifiedRef = add.length === 2 && add[1].body.ref === 'nord-deep@nord-pack';
        r.closesOnInstall = !document.querySelector(P);
        // nothing in the player fetched the stylesheet itself: the install is a
        // write on the SERVER, and the watcher's reload is what brings it back
        r.playerNeverFetchedCss = !CALLS.get.some((u) => /\.css/.test(u));

        r.PASS = r.pickerOpens && r.paletteRow && r.paletteRouteOpensThePicker
          && r.browseListed && r.listsMarketplaceThemes && r.tagsTheMarketplace
          && r.namesUnfetchedCatalogs && r.saysItIsCached && r.listingWasAGet && r.captionDescribes
          && r.refusalKeepsPickerOpen && r.refusalNamesProblems
          && r.installsByQualifiedRef && r.closesOnInstall && r.playerNeverFetchedCss;
        sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
        return;
      }

      if (mode === 'themepicker') {
        const P = '.decklight-theme-picker', ROW = '.tp-row', SEL = 'tp-selected';
        press('t');
        r.opens = !!document.querySelector(P);
        const a = selectedIndex(P, ROW, SEL);
        r.hasRows = a.count > 2;
        r.hasSelection = a.i >= 0;

        // ArrowDown advances the selection by one (mod count)
        press('ArrowDown');
        const b = selectedIndex(P, ROW, SEL);
        r.downMoves = b.i === (a.i + 1) % a.count;

        // ArrowUp far enough to cross the top proves wrap-around: from index
        // (a.i+1), stepping up (a.i+2) times lands on the LAST row.
        for (let n = 0; n < a.i + 2; n++) press('ArrowUp');
        const c = selectedIndex(P, ROW, SEL);
        r.wrapsAround = c.i === a.count - 1;

        // Escape backs out and ultimately closes
        r.escapeCloses = escapeUntilClosed(P);

        // reopen → a click on the backdrop (the overlay element itself) closes
        press('t');
        r.reopens = !!document.querySelector(P);
        document.querySelector(P)?.click();
        r.backdropCloses = !document.querySelector(P);

        // reopen → typing filters to matching themes; Enter on one commits and
        // closes (the filter path skips the pack drill-in)
        press('t');
        for (const ch of 'aurora') press(ch);
        r.filtersToThemes = document.querySelectorAll(`${P} ${ROW}`).length > 0;
        press('Enter');
        r.enterCommitsAndCloses = !document.querySelector(P);

        r.PASS = r.opens && r.hasRows && r.hasSelection && r.downMoves && r.wrapsAround
          && r.escapeCloses && r.reopens && r.backdropCloses
          && r.filtersToThemes && r.enterCommitsAndCloses;
      }

      if (mode === 'palette') {
        const Q = '.decklight-palette', ROW = '.pal-row', SEL = 'narr-sel';
        press('/');
        r.opens = !!document.querySelector(Q);
        const a = selectedIndex(Q, ROW, SEL);
        r.hasRows = a.count > 2;
        r.hasSelection = a.i >= 0;

        press('ArrowDown');
        const b = selectedIndex(Q, ROW, SEL);
        r.downMoves = b.i === (a.i + 1) % a.count;

        // typing filters the command list down
        const before = document.querySelectorAll(`${Q} ${ROW}`).length;
        for (const ch of 'theme') press(ch);
        const after = document.querySelectorAll(`${Q} ${ROW}`).length;
        r.typingFilters = after > 0 && after < before;

        // Escape clears the query first, then closes
        r.escapeCloses = escapeUntilClosed(Q);

        // Onboarding's settings surface is palette rows, not an overlay of its
        // own (SPEC PRESENTING): the welcome reopens from here, and tips are
        // turned off from here. "Reset tips" is contextual — this harness has
        // read no tip, so there is nothing to reset back to.
        press('/');
        const labels = (q) => {
          for (const ch of q) press(ch);
          const out = [...document.querySelectorAll(`${Q} ${ROW}`)].map((n) => n.textContent);
          escapeUntilClosed(Q);
          press('/');
          return out;
        };
        r.paletteReopensWelcome = labels('welcome').some((t) => /Welcome to Decklight/.test(t));
        const tipRows = labels('tips');
        r.paletteTogglesTips = tipRows.some((t) => /Tips on/.test(t));
        r.paletteHidesEmptyReset = !tipRows.some((t) => /Reset tips/.test(t));
        escapeUntilClosed(Q);

        r.PASS = r.opens && r.hasRows && r.hasSelection && r.downMoves
          && r.typingFilters && r.escapeCloses
          && r.paletteReopensWelcome && r.paletteTogglesTips && r.paletteHidesEmptyReset;
      }

      if (mode === 'exclusive') {
        // only one overlay at a time: opening the palette over the picker
        // dismisses the picker (and the finder over either, etc.)
        press('t');
        r.pickerUp = !!document.querySelector('.decklight-theme-picker');
        press('Escape');
        press('/');
        r.paletteUp = !!document.querySelector('.decklight-palette');
        r.pickerGone = !document.querySelector('.decklight-theme-picker');
        press('Escape');

        // finder (G) opens its own overlay
        press('g');
        r.finderUp = !!document.querySelector('.decklight-finder');
        press('Escape');
        r.finderGone = !document.querySelector('.decklight-finder');

        r.PASS = r.pickerUp && r.paletteUp && r.pickerGone && r.finderUp && r.finderGone;
      }
      if (mode === 'commit') {
        // K opens the commit window; ⌘K and ⌃K are aliases for it, and ⌘⏎ / ⌃⏎
        // commit the message. The two conventions this borrows from: ⌘K is what
        // JetBrains has meant by "commit" for twenty years, ⌘⏎ is what VS Code
        // and every GUI client mean by "send this".
        const O = '.decklight-commit';
        await settle();                       // let /edit/ping resolve
        press('k');
        await settle();
        r.bareKopens = !!document.querySelector(`${O} .narr-card`);
        r.bareKtoggles = (press('k'), await settle(), !document.querySelector(O));

        // ⌘K — the alias, from closed
        press('k', { metaKey: true });
        await settle();
        r.metaKopens = !!document.querySelector(`${O} .narr-card`);
        // …and it reaches the deck FROM INSIDE the message box, so the shortcut
        // that opened the window also closes it. The box stops every other key
        // (the deck must not advance while you type), which is exactly the trap
        // this asserts against.
        document.querySelector('.cm-input')?.focus();
        document.querySelector('.cm-input')
          ?.dispatchEvent(new KeyboardEvent('keydown', { key: 'k', metaKey: true, bubbles: true, cancelable: true }));
        await settle();
        r.metaKclosesFromTheBox = !document.querySelector(O);

        // ⌃K — the same alias for Windows and Linux
        press('k', { ctrlKey: true });
        await settle();
        r.ctrlKopens = !!document.querySelector(`${O} .narr-card`);

        // ⌘⏎ commits what is typed, and the message is the author's own
        const box = document.querySelector('.cm-input');
        box.value = 'tighten the closing slide';
        box.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', metaKey: true, bubbles: true, cancelable: true }));
        await settle();
        r.cmdEnterCommits = window.__committed === 'tighten the closing slide';
        r.closesAfterCommitting = !document.querySelector(O);

        r.PASS = r.bareKopens && r.bareKtoggles && r.metaKopens && r.metaKclosesFromTheBox
          && r.ctrlKopens && r.cmdEnterCommits && r.closesAfterCommitting;
        sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
        return;
      }

      if (mode === 'restore') {
        const O = '.decklight-restore', ROW = '.tp-row', SEL = 'tp-selected';
        await settle();                       // let /edit/ping resolve
        press('r');
        await settle();                       // let /edit/history resolve
        r.opens = !!document.querySelector(O);
        const a = selectedIndex(O, ROW, SEL);
        r.listsEveryCommit = a.count === 3;
        r.hasSelection = a.i === 0;           // newest first, newest selected

        // the subject is rendered as TEXT, never parsed as markup
        r.rowShowsSubject = /tighten the closing slide/.test(document.querySelector(`${O} ${ROW}`).textContent);

        press('ArrowDown');
        const b = selectedIndex(O, ROW, SEL);
        r.downMoves = b.i === 1;
        // wrap-around: from row 1, two ups crosses the top (1 → 0 → last)
        for (let n = 0; n < 2; n++) press('ArrowUp');
        r.wrapsAround = selectedIndex(O, ROW, SEL).i === a.count - 1;

        r.escapeCloses = escapeUntilClosed(O);

        // reopen → backdrop click closes
        press('r');
        await settle();
        r.reopens = !!document.querySelector(O);
        document.querySelector(O)?.click();
        r.backdropCloses = !document.querySelector(O);

        // Only one overlay at a time. An OPEN overlay swallows stray keys here
        // (the picker and finder behave the same way), so the contract worth
        // proving is the one the openers implement: opening restore over the
        // palette dismisses the palette. Driven through the public API, which
        // is also how a headless driver would reach it.
        press('/');
        r.paletteUp = !!document.querySelector('.decklight-palette');
        await deck.restore.open();
        await settle();
        r.restoreUp = !!document.querySelector(O);
        r.paletteGone = !document.querySelector('.decklight-palette');
        r.apiLists = deck.restore.list().length === 3;
        deck.restore.close();
        r.apiCloses = !document.querySelector(O);

        // and it is exposed for drivers that cannot press keys
        r.hasApi = typeof deck?.restore?.open === 'function'
          && typeof deck?.restore?.list === 'function';

        r.PASS = r.opens && r.listsEveryCommit && r.hasSelection && r.rowShowsSubject
          && r.downMoves && r.wrapsAround && r.escapeCloses && r.reopens
          && r.backdropCloses && r.paletteUp && r.restoreUp && r.paletteGone
          && r.hasApi && r.apiLists && r.apiCloses;
      }

      if (mode === 'wizard') {
        // The engine wizard (MARKETPLACE.md ENGINES#WIZARD) reached the way a
        // presenter reaches it: the palette's contextual Configure row. The
        // form is the REAL renderer mounting a server-vetted schema — the
        // regex tests in test/wizard.test.mjs prove the gate order in source;
        // this proves the thing actually comes up and round-trips answers.
        const W = '.decklight-editor';
        const statusLine = () => [...document.querySelectorAll(`${W} .narr-head`)].pop()?.textContent ?? '';
        await settle();                       // let /edit/ping resolve

        press('/');
        const row = [...document.querySelectorAll('.decklight-palette .pal-row')]
          .find((x) => /Configure ElevenLabs/.test(x.textContent));
        r.paletteRow = !!row;
        row?.click();
        await settle();                       // let the schema fetch resolve
        r.mounts = !!document.querySelector(W);
        r.paletteGone = !document.querySelector('.decklight-palette');
        // asked by QUALIFIED name, so two marketplaces sharing a bare name
        // cannot silently resolve to whichever answered first
        r.asksByQualifiedName = CALLS.get.some((u) => u.includes('/edit/wizard?engine=elevenlabs%40voices'));

        // the provenance line (#232): who is asking (the registry's qualified
        // name, not the schema's own title) and where the answers go, standing
        // ABOVE the first input so it is read before anything can be typed
        const src = document.querySelector(`${W} .wiz-src`);
        r.provenanceShown = !!src && src.textContent.includes(FAKE_WIZARD_PROVENANCE.askedBy)
          && src.textContent.includes(FAKE_WIZARD_PROVENANCE.sentTo);
        r.provenanceAboveInputs = !!src && !!(src.compareDocumentPosition(
          document.querySelector(`${W} input, ${W} select`)) & Node.DOCUMENT_POSITION_FOLLOWING);

        // core rendered the schema: one typed control per field
        r.titleShown = /ElevenLabs/.test(document.querySelector(`${W} .narr-head`)?.textContent ?? '');
        const secret = document.querySelector(`${W} input[type="password"]`);
        r.secretIsPassword = !!secret;
        const sel = document.querySelector(`${W} select`);
        r.choiceIsSelect = !!sel && [...sel.options].map((o) => o.value).join(',') === 'Rachel,Adam';
        const box = document.querySelector(`${W} input[type="checkbox"]`);
        r.booleanIsCheckboxWithDefault = !!box && box.checked === true;
        r.requiredIsMarked = [...document.querySelectorAll(`${W} label span`)]
          .some((s) => s.textContent === 'API key *');

        // a rejection is SAID, distinctly from unreachable, and the form stays
        // up for a second try instead of eating the answers
        secret.value = 'sk-live-wrong';
        [...document.querySelectorAll(`${W} button`)].find((b) => b.textContent === 'save')?.click();
        await settle();
        r.rejectionSaid = /not accepted — that key did not authenticate/.test(statusLine());
        r.staysUpOnRejection = !!document.querySelector(W);

        // fix the key, submit by the advertised chord this time
        secret.value = 'sk-live-right';
        secret.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', metaKey: true, bubbles: true, cancelable: true }));
        await settle();
        const posts = CALLS.post.filter((c) => c.u.includes('/edit/wizard'));
        r.postsTypedAnswers = posts.length === 2 && posts[1].body.engine === 'elevenlabs'
          && posts[1].body.answers.apiKey === 'sk-live-right'
          && posts[1].body.answers.voice === 'Rachel'
          && posts[1].body.answers.cache === true;
        r.closesOnSuccess = !document.querySelector(W);

        // and the programmatic door, for drivers that cannot click a palette
        r.hasApi = typeof deck.wizard === 'function';
        await deck.wizard('elevenlabs@voices');
        await settle();
        r.apiMounts = !!document.querySelector(W);
        r.escapeCloses = escapeUntilClosed(W);

        // a schema that arrives WITHOUT provenance is refused, not rendered
        // bare (#232) — the stub answers `bare@voices` with the schema alone
        await deck.wizard('bare@voices');
        await settle();
        r.refusesWithoutProvenance = !document.querySelector(W);

        r.PASS = r.paletteRow && r.mounts && r.paletteGone && r.asksByQualifiedName
          && r.provenanceShown && r.provenanceAboveInputs
          && r.titleShown && r.secretIsPassword && r.choiceIsSelect
          && r.booleanIsCheckboxWithDefault && r.requiredIsMarked
          && r.rejectionSaid && r.staysUpOnRejection
          && r.postsTypedAnswers && r.closesOnSuccess
          && r.hasApi && r.apiMounts && r.escapeCloses
          && r.refusesWithoutProvenance;
      }

      if (mode === 'contextmenu') {
        // Element edit mode (#112): E only ARMS it — right-clicking a slide
        // element is the actual surface, and the menu it opens differs by
        // WHAT was right-clicked, not by a separate keystroke.
        const M = '.decklight-ctxmenu', ROW = '.cm-row', SEL = 'cm-selected';
        const rightClick = (el) => el.dispatchEvent(new MouseEvent('contextmenu',
          { bubbles: true, cancelable: true, clientX: 40, clientY: 40 }));
        const rowsText = () => [...document.querySelectorAll(`${M} ${ROW}`)].map((x) => x.textContent);
        const clickRow = (label) => [...document.querySelectorAll(`${M} ${ROW}`)].find((x) => x.textContent === label)?.click();
        await settle();                        // let /edit/ping resolve

        const sections = [...document.querySelectorAll('.decklight section')];
        const h1 = sections[0].querySelector('h1');

        // E arms the mode; it does not open anything by itself
        press('e');
        r.armingOpensNoMenu = !document.querySelector(M);

        // right-click ON an element → the full menu
        rightClick(h1);
        r.opensOnElement = !!document.querySelector(M);
        r.fullMenuRows = JSON.stringify(rowsText())
          === JSON.stringify(['Edit speaker notes', 'Remove element', 'Edit content (HTML)', 'Add text effect ▸']);
        const a = selectedIndex(M, ROW, SEL);
        r.hasSelection = a.i === 0;
        press('ArrowDown');
        r.downMoves = selectedIndex(M, ROW, SEL).i === 1;
        r.escapeCloses = escapeUntilClosed(M);

        // right-click the SECTION ITSELF (no descendant under the cursor) →
        // background only gets "Edit speaker notes", which is where notes
        // editing lives now that E means something else
        rightClick(sections[0]);
        r.opensOnBackground = !!document.querySelector(M);
        r.backgroundOnlyNotes = JSON.stringify(rowsText()) === JSON.stringify(['Edit speaker notes']);
        press('Escape');

        // "Add text effect ▸" drills into a submenu — the 7 SPEC entrance
        // styles, 'none' (a real, instant build step), "remove effect", and a
        // back row — and committing one posts { slide, index, effect }
        rightClick(h1);
        clickRow('Add text effect ▸');
        const fx = rowsText();
        r.submenuShape = fx[0] === '← back' && fx.includes('fade-up') && fx.includes('highlight')
          && fx.includes('none (instant)') && fx.includes('remove effect') && fx.length === 10;
        clickRow('fade-up');
        await settle();
        const fxPost = CALLS.post.find((c) => c.u.includes('/edit/element/effect'));
        r.postsEffect = fxPost?.body.slide === 1 && fxPost?.body.index === 0 && fxPost?.body.effect === 'fade-up';
        r.closesAfterEffect = !document.querySelector(M);

        // "Remove element" posts { slide, index }
        rightClick(h1);
        clickRow('Remove element');
        await settle();
        const rmPost = CALLS.post.find((c) => c.u.includes('/edit/element/remove'));
        r.postsRemove = rmPost?.body.slide === 1 && rmPost?.body.index === 0;

        // "Edit content (HTML)" reads the element's outerHTML fresh from the
        // FILE (the fake /edit/element/source above), never the live DOM, and
        // Save posts the edited value back
        rightClick(h1);
        clickRow('Edit content (HTML)');
        await settle();
        const W = '.decklight-editor';
        const ta = document.querySelector(`${W} textarea`);
        r.contentMounts = !!ta;
        r.contentLoadedFromSource = ta?.value === '<h1>One</h1>';
        ta.value = '<h1>Renamed</h1>';
        ta.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', metaKey: true, bubbles: true, cancelable: true }));
        await settle();
        const contentPost = CALLS.post.find((c) => c.u.includes('/edit/element/content'));
        r.postsContent = contentPost?.body.slide === 1 && contentPost?.body.index === 0
          && contentPost?.body.html === '<h1>Renamed</h1>';
        r.escapeClosesContentEditor = escapeUntilClosed(W);

        // A slide with no per-element source mapping (data-markdown-removed,
        // #112's stand-in for the notes editor's markdown guard — markdown
        // slides were removed in 0.3.0, so this repo has no real fixture)
        // declines the whole menu rather than opening one that lies about
        // what it can save.
        sections[1].setAttribute('data-markdown-removed', '');
        rightClick(sections[1].querySelector('h2'));
        r.declinesOnMarkdownSlide = !document.querySelector(M);

        // backdrop click closes
        rightClick(h1);
        document.querySelector(M)?.click();
        r.backdropCloses = !document.querySelector(M);

        // E again disarms — no more menu on right-click
        press('e');
        rightClick(h1);
        r.disarmedNoMenu = !document.querySelector(M);

        r.PASS = r.armingOpensNoMenu && r.opensOnElement && r.fullMenuRows && r.hasSelection && r.downMoves
          && r.escapeCloses && r.opensOnBackground && r.backgroundOnlyNotes
          && r.submenuShape && r.postsEffect && r.closesAfterEffect && r.postsRemove
          && r.contentMounts && r.contentLoadedFromSource && r.postsContent && r.escapeClosesContentEditor
          && r.declinesOnMarkdownSlide && r.backdropCloses && r.disarmedNoMenu;
      }
    } catch (e) {
      r.exception = String((e && e.stack) || e);
      r.PASS = false;
    }
    r.mode = mode;
    sink.textContent = 'DECKLIGHT-ENGINE-RESULTS ' + JSON.stringify(r);
    })();
  </script>
</body>
</html>
