<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decklight review comments — headless verification</title>
  <link rel="stylesheet" href="../dist/decklight.css">
</head>
<body>
  <!--
    Review comments (SPEC REVIEW) in a real browser.

    Two things can only be checked here. First, that the fingerprint the BROWSER
    computes for a slide is the one a tool reading the FILE computes — the unit
    tests pin each side separately, and a regex pretending to be a DOM would
    only prove that two regexes agree. Second, that a comment written against
    one deck is still found after the deck moves, which is the whole feature and
    is decided by DOM text extraction.

    The servers are mocked: `/review/*` for a reviewer, `/edit/*` for an author.
    Which one answers is what decides whether M can take a comment or resolve
    one, so each mode runs with exactly one of them up.
  -->
  <div class="decklight">
    <section><h1>Intro</h1><p>opening</p></section>
    <section><h2>Why this matters</h2><p>the argument</p></section>
    <section><h2>Cut me</h2><p>doomed</p></section>
  </div>

  <pre id="test-sink">running…</pre>

  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') ?? 'reviewer';

    // The store the mocked servers share, as lines — the same shape the real
    // file holds, so the page is exercising the real parser.
    window.__posted = [];
    const seeded = params.has('seed') ? [
      // written when slide 2 said "the argument" and slide 3 existed
      '{"id":"aa1","at":"2026-08-20T10:00:00Z","by":"Ana Ruiz <ana@x>","slide":2,'
        + '"title":"Why this matters","fp":"__FP2__","body":"This contradicts slide 1."}',
      '{"id":"rr1","at":"2026-08-20T11:00:00Z","by":"Bo <bo@x>","re":"aa1","body":"Or slide 1 is wrong."}',
      '{"id":"bb2","at":"2026-08-20T12:00:00Z","by":"Bo <bo@x>","slide":3,'
        + '"title":"Cut me","fp":"__FP3__","body":"Agreed, cut this."}',
      '{"id":"cc3","at":"2026-08-20T13:00:00Z","by":"Bo <bo@x>","slide":1,'
        + '"title":"Intro","fp":"__FP1__","body":"Nice opening."}',
      '{"op":"resolve","re":"cc3","at":"2026-08-21T09:00:00Z","by":"Gilles"}',
    ] : [];
    window.__store = [];

    const realFetch = window.fetch.bind(window);
    window.fetch = async (url, opts) => {
      const u = String(url);
      const reviewer = mode === 'reviewer' || mode === 'dock';
      if (u.endsWith('/review/ping')) {
        return reviewer
          ? new Response(JSON.stringify({ ok: true, name: 'review.html', review: true }),
            { status: 200, headers: { 'content-type': 'application/json' } })
          : new Response('', { status: 404 });
      }
      if (u.endsWith('/edit/ping')) {
        return reviewer
          ? new Response('', { status: 404 })
          : new Response(JSON.stringify({ ok: true, name: 'review.html', undo: 0, redo: 0 }),
            { status: 200, headers: { 'content-type': 'application/json' } });
      }
      if (u.endsWith('/review/submit')) {
        window.__submitCalls = (window.__submitCalls || 0) + 1;
        return new Response(JSON.stringify({ ok: true, branch: 'review/me-2026-08-24', comments: window.__store.length, resubmit: false }),
          { status: 200, headers: { 'content-type': 'application/json' } });
      }
      if (u.endsWith('/edit/review/incoming')) {
        // A done review is still LISTED — struck through, so it can be
        // un-done — it simply stops counting as waiting.
        const reviews = [{
          branch: 'review/ana-2026-08-25', who: 'ana', when: '2026-08-25',
          comments: 2, replies: 0, at: '2026-08-25T09:00:00Z',
          done: window.__done === 'review/ana-2026-08-25',
          records: [
            { id: 'in1', at: '2026-08-25T09:00:00Z', by: 'Ana Ruiz <ana@x>', slide: 2,
              title: 'Why this matters', fp: window.__fp2 ?? 'nope', body: 'Incoming: tighten this.' },
            { id: 'in2', at: '2026-08-25T09:01:00Z', by: 'Ana Ruiz <ana@x>', slide: 1,
              title: 'Intro', body: 'Incoming: strong start.' },
          ],
        }];
        return new Response(JSON.stringify({ ok: true, state: reviews.some((v) => !v.done) ? 'ok' : 'none', reviews }),
          { status: 200, headers: { 'content-type': 'application/json' } });
      }
      if (u.includes('/edit/review/at?')) {
        window.__atCalls = (window.__atCalls || 0) + 1;
        return new Response(JSON.stringify({ ok: true, known: true, deck: 'abc1234', slide: 3,
          title: 'Cut me', text: 'Cut me doomed' }),
          { status: 200, headers: { 'content-type': 'application/json' } });
      }
      if (u.endsWith('/edit/review/done')) {
        const req_ = JSON.parse(opts.body);
        window.__doneCalls = (window.__doneCalls || 0) + 1;
        // the server's half: the mark is remembered, and NOTHING is copied into
        // the local store — that is the whole point of the change
        window.__done = req_.done ? req_.branch : null;
        return new Response(JSON.stringify({ ok: true, branch: req_.branch, done: !!req_.done }),
          { status: 200, headers: { 'content-type': 'application/json' } });
      }
      if (u.endsWith('/review/comments') || u.endsWith('/edit/review')) {
        if (opts?.method === 'POST') {
          const rec = JSON.parse(opts.body);
          window.__posted.push(rec);
          // the server's half: it is the one that knows who and when
          window.__store.push(JSON.stringify(
            rec.op === 'resolve' ? { ...rec, at: 'now', by: 'Me <me@x>' }
              : { id: `n${window.__posted.length}`, at: 'now', by: 'Me <me@x>', ...rec }));
          return new Response(JSON.stringify({ ok: true, id: 'n1' }),
            { status: 200, headers: { 'content-type': 'application/json' } });
        }
        const lines = [...window.__store];
        const records = [];
        for (const l of lines) { try { records.push(JSON.parse(l)); } catch { /* counted below */ } }
        return new Response(JSON.stringify({ ok: true, records, skipped: lines.length - records.length }),
          { status: 200, headers: { 'content-type': 'application/json' } });
      }
      return realFetch(url, opts);
    };

    try {
      localStorage.setItem('decklight-onboarded', '1');
      localStorage.setItem('decklight-tips-off', '1');
    } catch (e) { /* private mode */ }
  </script>

  <script src="../dist/decklight.js"></script>
  <script type="module">
    // A MODULE, and it must be: module scripts are deferred, so this runs after
    // the classic bundle above and `Decklight` is already there. A classic
    // driver reaching for something a module had set would run first and find
    // nothing — which is exactly what the first version of this page did.
    //
    // Static imports, like character.html: dynamic import() races the virtual
    // clock. Importing the source directly is what lets the page compute a
    // fingerprint with the SAME function the CLI uses.
    import { fingerprint, indexSlides } from '../src/core/review.js';
    import { slideTitle, slideBody } from '../src/core/finder.js';
    const sink = document.getElementById('test-sink');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const press = (k, target = document.body, opts = {}) => target.dispatchEvent(
      new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...opts }));
    async function until(fn, ms = 6000) {
      const stop = Date.now() + ms;
      for (;;) {
        const v = fn();
        if (v) return v;
        if (Date.now() > stop) return null;
        await wait(30);
      }
    }

    (async () => {
      const r = {};
      try {
        const deck = Decklight.init({});
        // The ENGINE's own list, not a fresh query: init moves the sections
        // under `.decklight-stage`, so `.decklight > section` matches nothing
        // afterwards — and `_sections` is exactly what the overlay reads.
        const idx = () => indexSlides(deck._sections, { titleOf: slideTitle, bodyOf: slideBody });

        // What the browser makes of this deck, for the file side to compare
        // against. THE cross-check: the unit tests pin each reader on its own.
        r.browserIndex = idx();

        // seed the store with comments anchored to THIS deck's own fingerprints
        const was = idx();
        window.__store = seeded.map((l) => l
          .replace('__FP1__', was[0].fp).replace('__FP2__', was[1].fp).replace('__FP3__', was[2].fp));
        // the incoming mock anchors its first comment to THIS deck's slide 2
        window.__fp2 = was[1].fp;

        if (mode === 'reviewer') {
          // A reviewer: the composer is there, and what it posts carries the
          // anchor the author will need to find this slide again.
          deck.goto(2, 0);
          await wait(50);
          press('m');
          const card = await until(() => document.querySelector('.decklight-review .narr-card'));
          r.opened = !!card;
          const input = await until(() => card.querySelector('.rv-input'));
          r.composerShown = !!input;
          r.saysWhichSlide = /on slide 2 · Why this matters/.test(card.querySelector('.rv-on')?.textContent ?? '');

          input.value = 'This contradicts slide 1.';
          card.querySelector('.rv-send').click();
          await until(() => window.__posted.length);
          r.posted = window.__posted[0];
          r.anchoredToTheSlideOnScreen = r.posted?.slide === 2
            && r.posted.title === 'Why this matters' && r.posted.fp === was[1].fp;
          // …and the list picked it straight up
          r.listedAfterPosting = !!(await until(() => [...card.querySelectorAll('.rv-body')]
            .some((n) => n.textContent === 'This contradicts slide 1.')));

          // Submitting is ARMED, then CONFIRMED — pushing is outward-facing,
          // and the first S must never be enough.
          const submitRow = await until(() => card.querySelector('.rv-submit'));
          r.submitRowShown = !!submitRow;
          press('s');
          await until(() => document.querySelector('.rv-submit.rv-arm'));
          r.submitArmedNotFired = !window.__submitCalls;
          // Escape backs out of the arm WITHOUT closing — the house two-step
          press('Escape');
          await wait(120);
          r.submitEscapeDisarmed = !document.querySelector('.rv-submit.rv-arm')
            && !!document.querySelector('.decklight-review');
          r.stillNotFired = !window.__submitCalls;
          press('s');
          await until(() => document.querySelector('.rv-submit.rv-arm'));
          press('s');
          await until(() => window.__submitCalls);
          r.submittedOnSecond = window.__submitCalls === 1;

          r.PASS = r.opened && r.composerShown && r.saysWhichSlide
            && r.anchoredToTheSlideOnScreen && r.listedAfterPosting
            && r.submitRowShown && r.submitArmedNotFired && r.submitEscapeDisarmed
            && r.stillNotFired && r.submittedOnSecond;
          sink.textContent = 'DECKLIGHT-REVIEW-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'dock') {
          // The panel docks beside the slide instead of covering it: it reflows
          // the stage, keeps the deck navigable, follows the current slide while
          // the box is empty and locks once you type, and remembers its place.
          deck.goto(1, 0);
          await wait(50);
          press('m');
          const card = await until(() => document.querySelector('.decklight-review .narr-card'));
          r.opened = !!card;
          const rootEl = document.querySelector('.decklight');
          const frame = document.querySelector('.decklight-review');
          const stage = document.querySelector('.decklight-stage');

          // opens floating (no dimming backdrop over the slide), not a modal
          r.defaultFloat = frame.dataset.dock === 'float';
          r.noBackdrop = getComputedStyle(frame).backgroundColor === 'rgba(0, 0, 0, 0)'
            || getComputedStyle(frame).backgroundImage === 'none' && !/blur/.test(getComputedStyle(frame).backdropFilter || '');
          const transformBefore = stage.style.transform;

          // dock right → the stage reserves a gutter and shifts to fit beside it
          const floatRect = card.getBoundingClientRect();
          card.querySelector('.rv-dock-btn[data-mode="right"]').click();
          await wait(50);
          r.dockedRight = frame.dataset.dock === 'right';
          r.reservedGutter = parseFloat(getComputedStyle(rootEl).getPropertyValue('--dock-right')) > 0;
          r.stageReflowed = stage.style.transform !== transformBefore
            && /translate\(-?\d/.test(stage.style.transform);

          // THE PIXELS, not just the state. The first cut set the dock attribute
          // and the gutter var correctly while the card stayed exactly where it
          // had floated — inline left/top from the float placement outrank the
          // stylesheet — so the stage reflowed away from a gutter nothing sat in.
          // Assert where the card actually IS, and that it fills the gutter it
          // was given rather than overhanging it (box-sizing).
          const dockedRect = card.getBoundingClientRect();
          r.cardActuallyMoved = Math.round(dockedRect.x) !== Math.round(floatRect.x)
            || Math.round(dockedRect.y) !== Math.round(floatRect.y);
          const gutterPx = parseFloat(getComputedStyle(rootEl).getPropertyValue('--dock-right'));
          r.cardOnTheRightEdge = Math.abs(dockedRect.right - rootEl.clientWidth) <= 1;
          r.cardFillsGutter = Math.abs(dockedRect.width - gutterPx) <= 1;
          r.cardFullHeight = Math.abs(dockedRect.height - rootEl.clientHeight) <= 1;
          // …and the slide it reflowed for must not sit under it
          const stageRect = stage.getBoundingClientRect();
          r.slideClearOfPanel = Math.round(stageRect.right) <= Math.round(dockedRect.left) + 1;

          // remembered per deck
          try {
            r.persisted = JSON.parse(localStorage.getItem('decklight-review-dock:' + location.pathname))?.mode === 'right';
          } catch (e) { r.persisted = false; }

          // non-modal: a touch on the deck hands the arrows back to the slides,
          // and the empty composer follows the slide you land on
          document.querySelector('.decklight-stage section')
            .dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
          const wasSlide = deck.state.slide;
          press('ArrowRight');
          await wait(40);
          r.arrowNavigatedDeck = deck.state.slide === wasSlide + 1;
          r.targetFollowedWhileEmpty = /on slide 2/.test(card.querySelector('.rv-on').textContent);

          // …but once you start writing, walking the deck must NOT move the target
          const input = card.querySelector('.rv-input');
          input.value = 'a note about slide 2';
          input.dispatchEvent(new Event('input', { bubbles: true }));
          document.querySelector('.decklight-stage section')
            .dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
          press('ArrowRight');
          await wait(40);
          r.targetLockedWhileTyping = deck.state.slide === wasSlide + 2
            && /on slide 2\b/.test(card.querySelector('.rv-on').textContent)
            && /viewing 3/.test(card.querySelector('.rv-on').textContent);

          // closing hands the stage its full width back
          press('m');
          await wait(30);
          r.gutterReleased = !document.querySelector('.decklight-review')
            && (getComputedStyle(rootEl).getPropertyValue('--dock-right').trim() === ''
              || parseFloat(getComputedStyle(rootEl).getPropertyValue('--dock-right')) === 0);
          // reopening returns to the remembered placement
          press('m');
          await wait(40);
          r.restoredPlacement = document.querySelector('.decklight-review')?.dataset.dock === 'right';

          r.PASS = r.opened && r.defaultFloat && r.dockedRight && r.reservedGutter
            && r.stageReflowed && r.cardActuallyMoved && r.cardOnTheRightEdge
            && r.cardFillsGutter && r.cardFullHeight && r.slideClearOfPanel
            && r.persisted && r.arrowNavigatedDeck
            && r.targetFollowedWhileEmpty && r.targetLockedWhileTyping
            && r.gutterReleased && r.restoredPlacement;
          sink.textContent = 'DECKLIGHT-REVIEW-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'moved') {
          // The deck moves under the comments: a slide inserted above, slide 2
          // edited, slide 3 deleted. Then M is opened and every verdict has to
          // be on screen and pointing at the right place.
          const [first,, third] = deck._sections;
          const stage = first.parentElement;
          third.remove();                                          // "Cut me" is gone
          deck._sections[1].querySelector('p').textContent = 'the argument, rewritten';
          const fresh = document.createElement('section');
          fresh.innerHTML = '<h2>Brand new</h2><p>inserted above everything</p>';
          stage.prepend(fresh);
          // sync() is the engine's own door for slides that appeared after
          // init — without it `_sections` is still the list built at load and
          // the overlay would resolve against a deck that no longer exists
          deck.sync();
          await wait(150);
          r.slidesNow = deck._sections.length;

          press('m');
          const card = await until(() => document.querySelector('.decklight-review .narr-card'));
          const rowText = () => [...card.querySelectorAll('.rv-row')].map((n) => n.textContent);
          await until(() => rowText().length >= 2);
          r.rows = rowText();

          // MOVED: "Nice opening" was on slide 1, which is now slide 2
          r.foundTheMovedSlide = r.rows.some((t) => /slide 2/.test(t) && /Nice opening/.test(t));
          // EDITED: found by title, and flagged
          r.flaggedTheEdited = r.rows.some((t) => /This contradicts slide 1/.test(t)
            && /changed since the comment was written/.test(t));
          // DELETED: not silently re-pinned to whatever is third now
          r.orphanNotRepinned = r.rows.some((t) => /slide gone/.test(t) && /Agreed, cut this/.test(t));
          // a reply hangs off its parent rather than standing alone
          r.replyNested = r.rows.some((t) => /Or slide 1 is wrong/.test(t) && /This contradicts/.test(t));
          // ⏎ on the ORPHAN has nowhere to go — it unfolds what the slide
          // SAID at the commit the comment was written against
          const orphanIdx = rowText().findIndex((t) => /slide gone/.test(t));
          for (let i = 0; i < 12; i++) {
            const on = card.querySelector('.rv-sel');
            if (on && /slide gone/.test(on.textContent)) break;
            press('ArrowDown'); await wait(50);
          }
          press('Enter');
          await until(() => card.querySelector('.rv-then'));
          r.orphanUnfolds = /what it said — slide 3 · Cut me/.test(card.querySelector('.rv-then')?.textContent ?? '')
            && /Cut me doomed/.test(card.querySelector('.rv-then')?.textContent ?? '');
          r.unfoldedNotClosed = !!document.querySelector('.decklight-review');

          // A moves it to the slide ON SCREEN — armed, then confirmed, an
          // APPENDED anchor op, and the row re-resolves where it now points
          press('a');
          await until(() => card.querySelector('.rv-arm'));
          r.anchorArmedNotFired = !window.__posted.some((p) => p.op === 'anchor');
          press('a');
          await until(() => window.__posted.some((p) => p.op === 'anchor'));
          const anch = window.__posted.find((p) => p.op === 'anchor');
          r.anchorIsAnAppend = anch && anch.re === 'bb2' && Number.isInteger(anch.slide)
            && typeof anch.fp === 'string';
          // the store's fold now finds it: the row stops saying "slide gone"
          await until(() => ![...card.querySelectorAll('.rv-row')].some((n) => /slide gone/.test(n.textContent)));
          r.orphanRepinnedAfterAnchor = ![...card.querySelectorAll('.rv-row')]
            .some((n) => /slide gone/.test(n.textContent));

          // ⏎ goes to where the slide IS now, not where it was
          for (let i = 0; i < 12; i++) {
            const on = card.querySelector('.rv-sel');
            if (on && /Nice opening/.test(on.textContent)) break;
            press('ArrowUp'); await wait(50);
          }
          const target = [...card.querySelectorAll('.rv-row')].find((n) => /Nice opening/.test(n.textContent));
          target.click();
          await wait(80);
          r.jumpedTo = deck.state.slide;
          r.jumpedToWhereItIsNow = r.jumpedTo === 2;
          // …and the panel is STILL THERE. It used to close on the jump, which
          // was right while it was a modal covering the deck and wrong the
          // moment it sat beside it: walking a review is jump, read, jump, and
          // a panel that dismissed itself meant pressing M again for every
          // comment after the first.
          r.panelSurvivedTheJump = !!document.querySelector('.decklight-review .narr-card');
          // a second jump works without reopening anything — the actual symptom
          const other = [...card.querySelectorAll('.rv-row')].find((n) => /contradicts/.test(n.textContent));
          if (other) { other.click(); await wait(80); }
          r.secondJumpWorked = !!document.querySelector('.decklight-review .narr-card');

          r.PASS = r.foundTheMovedSlide && r.flaggedTheEdited && r.orphanNotRepinned
            && r.replyNested && r.jumpedToWhereItIsNow
            && r.panelSurvivedTheJump && r.secondJumpWorked && r.orphanUnfolds
            && r.unfoldedNotClosed && r.anchorArmedNotFired && r.anchorIsAnAppend
            && r.orphanRepinnedAfterAnchor;
          sink.textContent = 'DECKLIGHT-REVIEW-RESULTS ' + JSON.stringify(r);
          return;
        }

        if (mode === 'author') {
          // An author: no composer, and R resolves — armed, then confirmed.
          press('m');
          const card = await until(() => document.querySelector('.decklight-review .narr-card'));
          await until(() => card.querySelectorAll('.rv-row').length >= 2);
          r.noComposerForAnAuthor = !card.querySelector('.rv-input');
          r.saysResolveIsThere = /R resolves/.test(card.querySelector('.rec-hint')?.textContent ?? '');
          // what reviewers sent, above the local list — the COMMENTS
          // list — the COMMENTS, not a count and a git command
          const incoming = await until(() => card.querySelector('.rv-incoming'));
          r.incomingShown = !!incoming;
          r.incomingSaysWhoAndHowMany = /ana · 2 comments waiting · review\/ana-2026-08-25/
            .test(incoming?.textContent ?? '');
          r.incomingShowsTheComments = /Incoming: tighten this\./.test(incoming?.textContent ?? '')
            && /Incoming: strong start\./.test(incoming?.textContent ?? '');
          r.noGitCommandAsked = !/git merge/.test(incoming?.textContent ?? '');
          // an incoming comment is anchored against the deck AS IT IS NOW and
          // ⏎ jumps to it like any local row
          const incRow = [...incoming.querySelectorAll('.rv-row.rv-inc')]
            .find((n) => /tighten this/.test(n.textContent));
          incRow.click();
          await wait(100);
          r.incomingJumps = deck.state.slide === 2;
          // The panel STAYS on a jump now, so there is nothing to reopen — this
          // step used to be `press('m')` with the comment "the click closed the
          // overlay". An incoming row is the case that made the old behaviour
          // worst: you jump to see what Ana meant and lose the list of what else
          // she said.
          r.panelStayedAfterIncomingJump = !!document.querySelector('.decklight-review .narr-card');
          const card2 = card;   // same live node — the jump did not replace it
          await until(() => card2.querySelector('.rv-incoming'));
          // T marks the whole review done. NOT a two-step: the result is
          // visible the instant it lands (the rows strike through) and pressing
          // T again undoes it, so there is nothing an arm would protect.
          const sel_ = () => card2.querySelector('.rv-sel');
          for (let i = 0; i < 8 && !sel_()?.classList.contains('rv-inc'); i++) { press('ArrowDown'); await wait(50); }
          press('t');
          await until(() => window.__doneCalls);
          r.markedDoneOnce = window.__doneCalls === 1 && window.__done === 'review/ana-2026-08-25';
          // NOTHING WAS COPIED — the point of dropping take-in. The local store
          // must be exactly what it was.
          r.nothingImported = !window.__store.some((l) => /Incoming: tighten this/.test(l));
          // still listed, struck through, so it can be un-done
          const doneRow = await until(() => card2.querySelector('.rv-inc-row.rv-done'));
          r.doneStillListed = !!doneRow && /T reopens it/.test(doneRow.textContent);
          r.doneCommentsStruck = card2.querySelectorAll('.rv-row.rv-inc.rv-done').length >= 1;
          // …and T again takes the mark off
          press('t');
          await until(() => window.__doneCalls === 2);
          r.reopened = window.__done === null
            && !!(await until(() => !card2.querySelector('.rv-inc-row.rv-done')));

          // The resolve two-step, on a LOCAL row: an incoming comment lives on
          // somebody else's branch and nothing copies it here, so it is
          // read-only — resolving it would answer a question this file never
          // asked. Walk to a row that is not .rv-inc.
          for (let i = 0; i < 12 && sel_()?.classList.contains('rv-inc'); i++) { press('ArrowDown'); await wait(40); }
          press('r');
          r.armedNotFired = !!(await until(() => card2.querySelector('.rv-arm')));
          r.nothingPostedYet = window.__posted.length === 0;
          // Escape backs out of the arm WITHOUT closing — the house two-step
          press('Escape');
          await wait(120);
          r.escapeDisarmedNotClosed = !card2.querySelector('.rv-arm')
            && !!document.querySelector('.decklight-review');

          press('r');
          await until(() => document.querySelector('.decklight-review .rv-arm'));
          // ⏎ is what the arm text promises — it must CONFIRM, not jump away
          press('Enter');
          await until(() => window.__posted.length);
          r.resolvedOnSecond = window.__posted[0]?.op === 'resolve';
          r.enterDidNotCloseOrJump = !!document.querySelector('.decklight-review');
          r.resolveIsAnAppend = !!window.__posted[0]?.re;
