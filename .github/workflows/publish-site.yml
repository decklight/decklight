# Publishes decklight.io: every push to main rebuilds the runtime, bundles
# demo/showcase.html with every theme into ONE self-contained file, and
# deploys the assembled site to GitHub Pages on THIS repo (decklight.io is
# the repo's custom domain, set in Settings → Pages). Pages auth is the
# workflow's own OIDC token.
#
# The showcase's voice track is not in git. It is one release asset
# (`site-voices`, voices.tar.gz) that this workflow pulls, brings up to date
# with the deck, checks, and pushes back (tools/site-voices.mjs). Bringing it
# up to date is an ElevenLabs call per slide whose notes changed, and only
# those: the manifest says which, and the clip cache restored below makes a
# slide that merely moved a cache hit. It needs one secret on the repo:
#
#   secrets.ELEVENLABS_API_KEY   the account whose voices site/voices.json names
#
# Without it, the re-voicing is skipped and the deploy goes ahead only if the
# pulled track already matches the deck: `check` fails the run otherwise,
# before Pages, so the site never publishes narration that disagrees with its
# slides.
name: publish decklight.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the voices release asset
  pages: write
  id-token: write

# one Pages deployment at a time; never cancel one mid-flight (the voices
# asset is read-modify-write, so two runs must not interleave)
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # the engine reads it from the environment and never writes it anywhere;
  # a secret cannot be tested in `if:` directly, through env it can
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tools/site-voices.mjs tags the voices release at the root commit

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      # node-pty (optional dep) is CLI-recording only — skip its native build
      - run: npm ci --omit=optional

      - run: node build.mjs

      - name: pull the voices (the last deploy's asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/site-voices.mjs pull

      # the shared clip cache: a sentence already voiced in a voice is never
      # bought twice, across runs too. A new key every run, restored by prefix,
      # so the newest cache is always the one picked up.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/decklight/tts
          key: tts-clips-${{ github.run_id }}
          restore-keys: tts-clips-

      # the track is m4a, and the encoder is ffmpeg, which the runner image no
      # longer ships; the synthesizer checks for it before it voices anything
      - name: ffmpeg, for the m4a encoding
        if: env.ELEVENLABS_API_KEY != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null && ffmpeg -version | head -1

      - name: re-voice the slides whose notes changed
        if: env.ELEVENLABS_API_KEY != ''
        run: node tools/site-voices.mjs refresh

      - name: every clip matches its notes
        run: node tools/site-voices.mjs check

      - name: push the voices back (only when a clip changed)
        if: env.ELEVENLABS_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/site-voices.mjs push

      - name: assemble the site
        run: |
          mkdir -p out/dist out/themes
          cp site/index.html out/index.html
          cp dist/decklight.js dist/decklight.css out/dist/
          # paper.css and meadow.css are still shipped: the landing page's recorded
          # terminal casts name them, and a visitor who follows those commands lands
          # on a deck that expects them to resolve
          cp themes/paper.css themes/meadow.css out/themes/
          # the voice track pulled above (see site/voices.json)
          cp -r site/voices out/voices
          rm -f out/voices/.pulled
          node cli/decklight.mjs bundle demo/showcase.html --themes all -o out/showcase.html
          # the talk the showcase builds, published with its voice inside (demo/postmortem/README.md);
          # the showcase's last slide links to it
          mkdir -p out/postmortem && cp demo/postmortem/published/index.html out/postmortem/index.html
          # the landing page's live tiles: one small deck, embedded and driven by the page;
          # the themes are the ones its theme tile cycles through (THEMES in site/index.html)
          node cli/decklight.mjs bundle site/pillars.html --themes eclipse,paper,synthwave,meadow,berry,glacier -o out/pillars.html
          cp -r site/img out/img
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("site/voices.json", "utf8"));
            // segments: the per-beat clips of the track (slide-NN-KK) play one per [click],
            // so the voice steps the builds; without it a slide plays as one clip
            const files = cfg.voices.map(v => `{ label: ${JSON.stringify(v.label)}, dir: ${JSON.stringify(v.dir)}, segments: true }`).join(", ");
            const p = "out/showcase.html";
            const h = fs.readFileSync(p, "utf8");
            const out = h.replace("Decklight.init({", `Decklight.init({\n    narration: { files: [${files}] },`);
            if (out === h) throw new Error("init config anchor not found");
            fs.writeFileSync(p, out);
            console.log("narration config injected:", cfg.voices.length, "voice(s)");
          '

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - id: deployment
        uses: actions/deploy-pages@v5
