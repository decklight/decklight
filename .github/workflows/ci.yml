# The build loop. Until now nothing ran the tests on a pull request — the suite
# only ever ran on a release tag, which is the one moment it is too late to hear
# about a failure. Every PR and every push to main now builds, tests, renders the
# deck in a real browser, and leaves a screenshot behind as an artifact.
name: CI

on:
  # `verify · macos` runs on a self-hosted Mac, so it is dispatchable: a laptop
  # is not always awake, and a job that queues against a sleeping runner should
  # be asked for rather than assumed.
  workflow_dispatch:
  pull_request:
  # a merge queue tests each PR against `main + everything ahead of it in the
  # queue` on a gh-readonly-queue/* ref, then merges in order. Without this
  # trigger the queue's required checks never run and nothing ever lands.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# a second push supersedes the first: nobody needs the results of a commit that
# has already been replaced
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build · test · render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20 # the floor in package.json engines — test what we promise
          cache: npm

      # node-pty (optional dep) is CLI-recording only — skip its native build
      - run: npm ci --omit=optional

      # the render harnesses drive a real headless browser; without one they exit
      # 1 rather than pretending to pass
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - name: unit tests
        run: npm test

      - name: build, render, contrast, palette (npm run verify)
        run: npm run verify
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

      # The deck has to still LOOK like a deck. A render harness proves the DOM;
      # this proves the pixels, and it is the same tool the ready-to-dev loop uses
      # to show a reviewer what a change actually did.
      - name: screenshot the demo deck
        run: |
          mkdir -p .shots
          node tools/shot.mjs demo/showcase.html -o .shots/showcase.png --wait 2500
          node tools/shot.mjs demo/showcase.html -o .shots/showcase-slide-3.png --slide 3 --wait 2500
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots
          path: .shots/
          # .shots is a DOTTED directory and upload-artifact skips hidden files by
          # default — without this it uploads nothing, cheerfully, and the step
          # still goes green
          include-hidden-files: true
          retention-days: 14

  # Windows is where the bug that started the soak came from — a raw ENOENT on
  # any path with a space in it, on every profile named "Firstname Lastname" —
  # and until now nothing here ever ran on it. `decklight` is published to npm
  # for every platform Node runs on; testing one of them is a claim about the
  # other two.
  #
  # UNIT TESTS ONLY, deliberately. `npm run verify` drives a headless browser
  # through fifteen render harnesses, and a rendering difference on another OS is
  # a different investigation from "does the code run there at all" — one worth
  # having, but not worth blocking every PR on before the first question is
  # answered. This job answers the first question, including the platform module
  # test/soak.mjs branches on (test/soak-platform.test.mjs), which is otherwise
  # only ever checked by pretending.
  windows:
    name: test · windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20 # the floor in package.json engines — test what we promise
          cache: npm

      # node-pty needs a C++ toolchain and is CLI-recording only; the suite skips
      # what it gates (test/helpers.mjs optionalDepSkip) rather than failing
      - run: npm ci --omit=optional

      # --test-timeout turns a HANG into a named failure. Both runs here died to
      # the job timeout after 29 minutes of SILENCE with no clue which file was
      # stuck: node --test reports a file only when it finishes, so a file that
      # never finishes reports nothing at all. 120s is far above the slowest
      # legitimate test (~12s) and far below this job's own limit.
      - name: unit tests
        run: npm test -- --test-timeout=120000

  # `npm test` answers "does the code run there". This asks the other question
  # (#309): does it LOOK right there. They are different investigations, and the
  # second is where platforms differ — font stacks, subpixel metrics, DPI, and
  # Chrome's own defaults. The overflow guardrail (SPEC PRESENTING) asserts about
  # text metrics directly, so a font present on Ubuntu and absent here would be a
  # real way for this to fail.
  #
  # It did not fail that way. All fifteen rendering harnesses passed on Windows
  # unchanged; the only two that failed were `contrast` and `palette-rules`,
  # which render nothing — they resolved `themes/` through `new URL(…).pathname`
  # and read `D:\D:\a\decklight\themes`. A path bug, fixed, and the sweep that
  # guards against it now covers `test/` as well.
  #
  # HOSTED MACOS IS DELIBERATELY NOT HERE, and this is the note that should stop
  # the next person re-attempting it blind. A GitHub-hosted macOS runner cannot
  # run headless Chrome at all — not with our flags, not with any. Five variants
  # were probed and all five failed the same way:
  #
  #   with --no-sandbox        ENOBUFS   — bootstrap_look_up …MachPortRendezvous-
  #   WITHOUT it               ETIMEDOUT     Server.N: Unknown service name (1102)
  #   bare --headless          ENOBUFS       / Permission denied (1100), and
  #   --headless=new           ENOBUFS       "No rendezvous client, terminating
  #   without, own profile     ENOBUFS        process (parent died?)"
  #
  # Chrome finds its child processes over a Mach port registered in the session
  # bootstrap namespace; that runner's session does not permit the lookup, so no
  # renderer ever spawns and every harness hangs until it is killed. `--version`
  # answers fine, which is why this looks like a working browser until something
  # asks it to render.
  #
  # The `--no-sandbox` line is worth its own sentence: chromeArgs() adds that
  # flag whenever CI is set, on every platform, and the first round of probes all
  # carried it — so the finding was nearly recorded as "cannot run there" when
  # what had been tested was "cannot run there with --no-sandbox". Removing it
  # changes nothing here. (The flag is a Linux-in-a-container answer to running
  # as root and is unnecessary on macOS and Windows; narrowing it to Linux is a
  # separate, unforced change.)
  #
  # It is not Chrome-specific either. Three builds were probed there:
  #
  #   chrome-for-testing     KILLED at 45s — Permission denied (1100)
  #   chromium               KILLED at 45s — CVDisplayLinkCreateWithCGDisplay
  #   chrome-headless-shell  OK — 40 bytes in 0.4s
  #
  # THE OLD HEADLESS BINARY WORKS. `chrome-headless-shell` is headless by
  # construction rather than by flag, and it does not go through the
  # multi-process rendezvous that the other two die in. So a hosted macOS render
  # job IS buildable — pointing $CHROME at it — and the reason not to is a
  # choice rather than a limit: it is a different headless implementation from
  # the one a presenter's browser uses, and the self-hosted runner below already
  # drives the real thing. Worth knowing before anyone concludes, as this
  # comment nearly did, that macOS rendering cannot be checked without hardware.
  #
  # This is an environment limitation, not a rendering difference and not a
  # decklight bug: `npm run verify` passes on a SELF-HOSTED Mac in ~155s and on a
  # developer's own machine in ~135s — see the `verify-macos` job below.
  verify-windows:
    name: verify · windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20 # the floor in package.json engines — test what we promise
          cache: npm

      - run: npm ci --omit=optional

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      # Before seventeen harnesses drive it: does this machine's Chrome answer at
      # ALL? Eight seconds here, against seventeen harnesses each hanging for
      # three minutes — which is exactly what a broken browser costs otherwise,
      # and how the macOS answer above took four rounds to arrive.
      #
      # `--version` is NOT probed: on Windows it hangs for 30s and tells you
      # nothing, which is its own small lesson about assuming a flag is cheap.
      - name: probe the browser before driving it (#309)
        timeout-minutes: 5
        shell: bash
        run: |
          node - <<'PROBE' 2>&1 | tee "probe-windows.log"
          const { execFileSync } = require('child_process');
          const at = Date.now();
          try {
            const out = execFileSync(process.env.CHROME,
              ['--headless', '--disable-gpu', '--no-sandbox', '--dump-dom', 'about:blank'],
              { timeout: 60000, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            console.log(`chrome: OK in ${((Date.now() - at) / 1000).toFixed(1)}s — ${out.length} bytes`);
          } catch (e) {
            const why = String(e.stderr || e.message).trim().split('\n').slice(-3).join(' | ');
            console.log(`chrome: ${e.code ?? 'FAILED'} after ${((Date.now() - at) / 1000).toFixed(1)}s — ${why}`);
            process.exit(1);
          }
          PROBE
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

      # THE TIMEOUT IS ON THE STEP, NOT THE JOB, and the output is teed to a
      # file. Three rounds of this investigation reported nothing at all: a job
      # cancelled by its own `timeout-minutes` discards its log AND skips the
      # `if: always()` steps below. A step that times out fails instead, so the
      # log is uploaded with whatever it got to.
      #
      # pipefail because a pipeline reports the LAST command's status, and `tee`
      # always succeeds: without it a failing verify would upload its own
      # failure and go green.
      - name: build, render, contrast, palette (npm run verify)
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "verify-windows.log"
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # A hung harness names itself in three minutes rather than ten, so a
          # browser that stops working costs one round and not seventeen.
          VERIFY_TIMEOUT_MS: 180000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-log-windows
          path: |
            verify-*.log
            probe-*.log
          retention-days: 14

      # Beside the Ubuntu job's shots, so a rendering difference is VISIBLE
      # rather than described. Bounded and non-fatal like everything else here:
      # tools/shot.mjs hands Chrome to execFile with no timeout of its own, so on
      # a machine where the browser never returns this is the step that runs out
      # the JOB's clock — and a cancelled job uploads nothing and keeps no log.
      - name: screenshot the demo deck
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          mkdir -p .shots
          node tools/shot.mjs demo/showcase.html -o .shots/showcase.png --wait 2500
          node tools/shot.mjs demo/showcase.html -o .shots/showcase-slide-3.png --slide 3 --wait 2500
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots-windows
          path: .shots/
          include-hidden-files: true
          retention-days: 14

  # The macOS answer #309 could not get from a GitHub-hosted runner, which
  # cannot run headless Chrome at all: Chrome finds its child processes over a
  # Mach port registered in the session bootstrap namespace, and that runner's
  # non-GUI session has none. A self-hosted Mac has a real session, so the
  # question is finally askable.
  #
  # It is somebody's LAPTOP, and two things follow from that:
  #
  #   1. It must not touch the config home. test/verify.mjs now gives every
  #      harness a scratch DECKLIGHT_HOME of its own, because four of them spawn
  #      the CLI and a command reads the unit library from there — on an
  #      ephemeral runner that home is empty and it never mattered; on a real
  #      machine it is a person's own marketplaces, plugins and credentials.
  #   2. It uses the Chrome that is already installed rather than downloading
  #      its own into somebody's tool cache. That is also the more useful claim:
  #      "verify passes on a real Mac with a real Chrome" is what CONTRIBUTING
  #      says, and this is the thing that would check it.
  verify-macos:
    name: verify · macos
    # ON DEMAND, not on every PR. The runner is a laptop: it is not always
    # awake, and a job queued against a sleeping runner sits pending for hours
    # before it fails — noise, not signal. Three minutes when you ask for it,
    # before a release or after anything that touches rendering:
    #
    #   gh workflow run CI --ref <branch>
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20 # the floor in package.json engines — test what we promise

      - run: npm ci --omit=optional

      # Which browser, and does it answer — before seventeen harnesses drive it.
      # No CHROME is set: tools/chrome.mjs finds the installed one, exactly as it
      # does for a developer running `npm run verify` by hand.
      - name: probe the browser before driving it (#309)
        timeout-minutes: 5
        shell: bash
        run: |
          node - <<'PROBE' 2>&1 | tee "probe-macos.log"
          const { execFileSync } = require('child_process');
          // stdin is read as CJS, so the ESM probe is reached through a dynamic
          // import inside an async IIFE — top-level await is not available here.
          (async () => {
            const { findChrome } = await import('./tools/chrome.mjs');
            const chrome = process.env.CHROME || findChrome();
            console.log('chrome path:', chrome ?? 'NONE FOUND');
            if (!chrome) process.exit(1);
            const at = Date.now();
            try {
              const out = execFileSync(chrome,
                ['--headless', '--disable-gpu', '--dump-dom', 'about:blank'],
                { timeout: 60000, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              console.log(`chrome: OK in ${((Date.now() - at) / 1000).toFixed(1)}s — ${out.length} bytes`);
            } catch (e) {
              const why = String(e.stderr || e.message).trim().split('\n').slice(-3).join(' | ');
              console.log(`chrome: ${e.code ?? 'FAILED'} after ${((Date.now() - at) / 1000).toFixed(1)}s — ${why}`);
              process.exit(1);
            }
          })();
          PROBE

      # Same shape as the Windows job: the timeout is on the STEP so a failure
      # keeps its log, and pipefail so `tee` cannot turn a red run green.
      - name: build, render, contrast, palette (npm run verify)
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "verify-macos.log"
        env:
          VERIFY_TIMEOUT_MS: 180000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-log-macos
          path: |
            verify-*.log
            probe-*.log
          retention-days: 14

      - name: screenshot the demo deck
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          mkdir -p .shots
          node tools/shot.mjs demo/showcase.html -o .shots/showcase.png --wait 2500
          node tools/shot.mjs demo/showcase.html -o .shots/showcase-slide-3.png --slide 3 --wait 2500

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots-macos
          path: .shots/
          include-hidden-files: true
          retention-days: 14

  # macOS rendering on every PR, without anyone's laptop. The hosted runner
  # cannot start Chrome or Chromium (see the note above `verify-windows`), but
  # `chrome-headless-shell` — the OLD headless implementation, headless by
  # construction rather than by flag — starts in 0.4s there, because it never
  # goes through the multi-process Mach rendezvous the other two die in.
  #
  # It is a different headless implementation from the one a presenter's browser
  # uses, so this job is a COMPLEMENT to `verify-macos` on the self-hosted Mac
  # rather than a replacement: that one drives the real Chrome on demand, this
  # one catches a macOS-only layout or font regression on the PR that causes it.
  # The layout stack underneath is the same Blink and the same CoreText, which is
  # what makes the overflow guardrail meaningful here.
  #
  # Two harnesses are SKIPPED BY NAME and the summary says so. Old headless
  # refuses `fetch()` over `file://` whatever --allow-file-access-from-files
  # says, and both are about exactly that: player-render loads its cast fixtures
  # that way, and shot-render asserts that the danger it exists to contain is
  # REAL — which on this binary it is not. Both run on Linux and Windows every
  # PR, so nothing is uncovered; they are simply not askable here.
  verify-macos-hosted:
    name: verify · macos-hosted
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20 # the floor in package.json engines — test what we promise
          cache: npm

      - run: npm ci --omit=optional

      - name: install chrome-headless-shell
        id: shell
        shell: bash
        run: |
          # Prints "chrome-headless-shell@version /path/to/binary" on the last line.
          line=$(npx -y @puppeteer/browsers install chrome-headless-shell@stable \
            --path "$RUNNER_TEMP/browsers" | tail -1)
          echo "version=${line%% *}" >> "$GITHUB_OUTPUT"
          echo "path=${line#* }" >> "$GITHUB_OUTPUT"
          echo "installed $line"

      - name: build, render, contrast, palette (npm run verify)
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "verify-macos-hosted.log"
        env:
          CHROME: ${{ steps.shell.outputs.path }}
          VERIFY_SKIP: player-render,shot-render
          VERIFY_TIMEOUT_MS: 180000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-log-macos-hosted
          path: verify-*.log
          retention-days: 14

      - name: screenshot the demo deck
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          mkdir -p .shots
          node tools/shot.mjs demo/showcase.html -o .shots/showcase.png --wait 2500
        env:
          CHROME: ${{ steps.shell.outputs.path }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots-macos-hosted
          path: .shots/
          include-hidden-files: true
          retention-days: 14
